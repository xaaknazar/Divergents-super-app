<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Заявки на событие</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="844" safe-top="{{false}}" hint-size="390px,844px">
  <dc-import name="NavHeader" variant="inline" title="Заявки" back-label="Поездка" back-href="TripDetail.dc.html" hint-size="100%,118px"></dc-import>
  <dc-import name="Wrapper" pad-top="8" pad-bottom="24" hint-size="100%,560px">
    <dc-import name="SectionHeader" size="small" title="{{summary}}" hint-size="100%,32px"></dc-import>
    <dc-import name="Wrapper2" pad-x="16" gap="10" hint-size="100%,520px">
      <sc-for list="{{applicants}}" as="a" hint-placeholder-count="6">
        <dc-import name="EventApplicantRow" person="{{a.person}}" subtitle="Публичное имя участника" status="{{a.status}}" hint-size="100%,72px"></dc-import>
      </sc-for>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var applicants = [
      { person: 'aru_runner', status: 'new' }, { person: 'Данияр', status: 'new' }, { person: 'mountain.erlan', status: 'new' },
      { person: 'Мадина', status: 'accepted' }, { person: 'saule_reads', status: 'rejected' }, { person: 'Тимур', status: 'withdrawn' }
    ];
    var waiting = applicants.filter(function (a) { return a.status === 'new'; }).length;
    var accepted = applicants.filter(function (a) { return a.status === 'accepted'; }).length;
    return {
      applicants: applicants,
      summary: applicants.length + ' заявок · ' + waiting + ' ждут решения · ' + accepted + ' принято'
    };
  }
}
</script>
</body>
</html>
