<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>EventCard — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="1730" safe-top="{{false}}" hint-size="390px,1730px">
<dc-import name="Wrapper" pad="20" gap="24" hint-size="100%,866px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" hint-size="100%,34px">EventCard</dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" hint-size="100%,18px">Карточка челленджа / поездки: variant banner|cover|plain · kind none|challenge|trip|sport (только plain) · badges · meta · action</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">PLAIN · KIND=CHALLENGE (открыт набор)</dc-import>
<dc-import name="EventCard" variant="plain" kind="challenge" icon="flame" title="Divergents challenge: Teachers version" date="Старт 12 октября" description="Пять команд, 15 дней и общий рейтинг. Заявки открыты." badges="{{openBadges}}" meta="Набор открыт" meta-dot="success" action="Подробнее" action-chevron="{{true}}" href="ChallengeDetail.dc.html" hint-size="100%,230px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">PLAIN · KIND=TRIP (поездки)</dc-import>
<dc-import name="EventCard" variant="plain" kind="trip" icon="mountains" title="Выходные в горах" date="18 октября" badges="{{tripBadges}}" meta="Лёгкий маршрут · 1 день" action="Бесплатно" href="TripDetail.dc.html" hint-size="100%,140px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">PLAIN · KIND=NONE (белый)</dc-import>
<dc-import name="EventCard" variant="plain" icon="calendar" title="Книжный клуб" date="16 октября, 18:00" badges="{{tripBadges}}" meta="Алматы · Кофейня" action="Бесплатно" href="MeetupDetail.dc.html" hint-size="100%,140px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">BANNER · ОТКРЫТ НАБОР</dc-import>
<dc-import name="EventCard" hint-size="100%,236px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">COVER · ПОЕЗДКА</dc-import>
<dc-import name="EventCard" variant="cover" icon="mountains" title="Выходные в горах" date="18 октября" badges="{{tripBadges}}" meta="Лёгкий маршрут · 1 день" action="Бесплатно" href="TripDetail.dc.html" hint-size="100%,262px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">BANNER · ПОЕЗДКА БЕЗ ОБЛОЖКИ</dc-import>
<dc-import name="EventCard" variant="banner" icon="map" title="Кольсай и Каинды" date="1 ноября" badges="{{tripBadges2}}" meta="Алматинская область · 2 дня" action="Бесплатно" href="TripDetail.dc.html" hint-size="100%,170px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1730}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      openBadges: [{ label: 'Онлайн', icon: 'globe', tone: 'success' }, { label: '15 дней', icon: 'flame', tone: 'brand' }, { label: '12 заявок', icon: 'people', tone: 'neutral' }],
      tripBadges: [{ label: 'Офлайн', icon: 'body-standing', tone: 'warning' }, { label: 'Алматы', icon: 'pin', tone: 'neutral' }, { label: 'Начальный', icon: '', tone: 'neutral' }],
      tripBadges2: [{ label: 'Офлайн', icon: 'body-standing', tone: 'warning' }, { label: 'Алматинская область', icon: 'pin', tone: 'neutral' }, { label: 'Средняя', icon: '', tone: 'neutral' }]
    };
  }
}
</script>
</body>
</html>
