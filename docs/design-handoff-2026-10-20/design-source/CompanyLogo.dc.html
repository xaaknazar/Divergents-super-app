<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>CompanyLogo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<span aria-hidden="true" style="{{boxCss}}"><sc-if value="{{hasSrc}}" hint-placeholder-val="{{false}}"><img src="{{src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></sc-if><sc-if value="{{noSrc}}" hint-placeholder-val="{{true}}"><span style="{{letterCss}}">{{letter}}</span></sc-if></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"company":{"editor":"text","default":"Ритейл-группа"},"tone":{"editor":"enum","default":"brand","options":["brand","success","indigo","purple","orange","teal"]},"size":{"editor":"enum","default":"md","options":["sm","md","lg"]},"variant":{"editor":"enum","default":"muted","options":["muted","elevated"]},"src":{"editor":"text","default":""},"$preview":{"width":52,"height":52}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var SZ = { sm: [40, 10, 15, 20], md: [52, 14, 20, 25], lg: [60, 14, 28, 34] };
    var s = SZ[p.size] || SZ.md;
    var INK = { brand: '#234088', success: '#34C759', indigo: '#5856D6', purple: '#AF52DE', orange: '#FF9500', teal: '#30B0C7' };
    var company = String(p.company ?? 'Ритейл-группа').trim();
    var elevated = p.variant === 'elevated';
    var src = p.src || '';
    return {
      src: src, hasSrc: !!src, noSrc: !src,
      letter: company ? company.charAt(0).toUpperCase() : '?',
      boxCss: ['display: flex', 'align-items: center', 'justify-content: center', 'flex-shrink: 0', 'overflow: hidden', 'box-sizing: border-box',
        'width: ' + s[0] + 'px', 'height: ' + s[0] + 'px', 'border-radius: ' + s[1] + 'px',
        'background: ' + (elevated ? '#FFFFFF' : 'rgba(116,116,128,0.08)'), F].join('; '),
      letterCss: 'font-size: ' + s[2] + 'px; line-height: ' + s[3] + 'px; font-weight: 700; color: ' + (INK[p.tone] || INK.brand)
    };
  }
}
</script>
</body>
</html>
