<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ProgressBar — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="480" safe-top="{{false}}" hint-size="390px,480px">
<dc-import name="Wrapper" pad="20" gap="24" hint-size="100%,446px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" hint-size="100%,34px">ProgressBar</dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" hint-size="100%,18px">Полоса прогресса: value · tone · size · label</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,84px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">TONE · BRAND / SUCCESS / SKY / WARNING</dc-import>
<dc-import name="Wrapper3" gap="12"  hint-size="100%,60px">
<dc-import name="ProgressBar" value="42" tone="brand" label="" hint-size="100%,6px"></dc-import>
<dc-import name="ProgressBar" value="100" tone="success" label="" hint-size="100%,6px"></dc-import>
<dc-import name="ProgressBar" value="65" tone="sky" label="" hint-size="100%,6px"></dc-import>
<dc-import name="ProgressBar" value="20" tone="warning" label="" hint-size="100%,6px"></dc-import>
</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,68px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">SIZE · THIN 4 / REGULAR 6 / THICK 10</dc-import>
<dc-import name="Wrapper3" gap="12"  hint-size="100%,44px">
<dc-import name="ProgressBar" value="30" size="thin" label="" hint-size="100%,4px"></dc-import>
<dc-import name="ProgressBar" value="60" size="regular" label="" hint-size="100%,6px"></dc-import>
<dc-import name="ProgressBar" value="80" size="thick" label="" hint-size="100%,10px"></dc-import>
</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,96px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">WITH LABEL</dc-import>
<dc-import name="Wrapper3" gap="12"  hint-size="100%,72px">
<dc-import name="ProgressBar" value="42" label="42% · 5 из 12 уроков" hint-size="100%,30px"></dc-import>
<dc-import name="ProgressBar" value="100" tone="success" label="Курс пройден" hint-size="100%,30px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
