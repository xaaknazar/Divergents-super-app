<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TeamPickRow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<button type="button" aria-pressed="{{pressed}}" style="{{css}}">
<dc-import name="TaskCheck" checked="{{selected}}" size="md" hint-size="20px,20px"></dc-import>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 17px; line-height: 24px; letter-spacing: -0.2px; color: #000000">{{title}}</span><span style="font-size: 12px; line-height: 16px; color: #5C5C60">{{subtitle}}</span></span>
<sc-if value="{{hasNeed}}" hint-placeholder-val="{{true}}"><span style="font-size: 11px; line-height: 14px; font-weight: 700; color: #934900; white-space: nowrap">{{need}}</span></sc-if>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Ray"},"subtitle":{"editor":"text","default":"17/22 · капитан Dilyara"},"need":{"editor":"text","default":"нужно 5"},"selected":{"editor":"boolean","default":true},"separator":{"editor":"boolean","default":false},"$preview":{"width":358,"height":70}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var on = function (v) { return v === true || v === 'true'; };
    var demo = p.title === undefined;
    var sel = p.selected === undefined ? demo : on(p.selected);
    var need = p.need ?? (demo ? 'нужно 5' : '');
    return {
      title: p.title ?? 'Ray', subtitle: p.subtitle ?? '17/22 · капитан Dilyara', need: need, hasNeed: !!need,
      selected: sel, pressed: sel ? 'true' : 'false',
      css: "width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 14px; margin: 0; border: 0; cursor: pointer; text-align: left; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: " + (sel ? 'rgba(61,91,219,0.13)' : 'transparent') + '; border-top: ' + (on(p.separator) ? '0.5px solid rgba(60,60,67,0.18)' : '0')
    };
  }
}
</script>
</body>
</html>
