<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>BookPromptRow — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<dc-import name="Screen" height="420" safe-top="{{false}}" hint-size="390px,420px">
  <dc-import name="Wrapper" pad-x="16" pad-top="24" pad-bottom="24" gap="24" hint-size="100%,386px">
    <dc-import name="Text" variant="title2" heading="1" text="BookPromptRow" hint-size="100%,28px"></dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,260px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="в ListSection · separator на 2-й+ строке" hint-size="100%,18px"></dc-import>
      <dc-import name="ListSection" header="Например" hint-size="100%,224px"><sc-for list="{{items}}" as="s" hint-placeholder-count="4"><dc-import name="BookPromptRow" label="{{s.label}}" separator="{{s.sep}}" hint-size="100%,48px"></dc-import></sc-for></dc-import>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":420}}'>
class Component extends DCLogic { renderVals() { return { items: [ { label: "Что почитать под мои таланты?", sep: false }, { label: "Книги по лидерству для меня", sep: true }, { label: "Посоветуй книгу под мой психотип", sep: true }, { label: "С чего начать развитие?", sep: true } ] }; } }
</script>
</body>
</html>
