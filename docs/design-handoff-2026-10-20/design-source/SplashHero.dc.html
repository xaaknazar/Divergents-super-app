<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SplashHero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<sc-if value="{{isLink}}" hint-placeholder-val="{{false}}"><a href="{{href}}" aria-label="{{aria}}" style="{{rootCss}}">
  <span aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #27478F 0%, #234088 46%, #1A3068 100%)"></span>
  <span style="position: relative; display: flex; flex-direction: column; align-items: center">
    <dc-import name="Logo" size="lg" variant="white" hint-size="93px,117px"></dc-import>
    <span style="margin-top: 28px; font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: 0.3px; color: #FFFFFF; white-space: nowrap">{{title}}</span>
    <span style="margin-top: 10px; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 2.4px; color: rgba(255,255,255,0.68); text-transform: uppercase; white-space: nowrap">{{tagline}}</span>
  </span>
  <span style="position: absolute; left: 0; right: 0; bottom: 48px; text-align: center; font-size: 12px; line-height: 16px; letter-spacing: 0.4px; color: rgba(255,255,255,0.45)">{{footer}}</span>
</a></sc-if>
<sc-if value="{{isStatic}}" hint-placeholder-val="{{true}}"><div role="img" aria-label="{{aria}}" style="{{rootCss}}">
  <span aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #27478F 0%, #234088 46%, #1A3068 100%)"></span>
  <span style="position: relative; display: flex; flex-direction: column; align-items: center">
    <dc-import name="Logo" size="lg" variant="white" hint-size="93px,117px"></dc-import>
    <span style="margin-top: 28px; font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: 0.3px; color: #FFFFFF; white-space: nowrap">{{title}}</span>
    <span style="margin-top: 10px; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 2.4px; color: rgba(255,255,255,0.68); text-transform: uppercase; white-space: nowrap">{{tagline}}</span>
  </span>
  <span style="position: absolute; left: 0; right: 0; bottom: 48px; text-align: center; font-size: 12px; line-height: 16px; letter-spacing: 0.4px; color: rgba(255,255,255,0.45)">{{footer}}</span>
</div></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Divergents"},"tagline":{"editor":"text","default":"non-stop development"},"footer":{"editor":"text","default":"divergents.kz"},"href":{"editor":"text","default":""},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var title = p.title || 'Divergents';
    var tagline = p.tagline ?? 'non-stop development';
    var href = p.href || '';
    return {
      title: title, tagline: tagline, footer: p.footer ?? 'divergents.kz',
      href: href, isLink: !!href, isStatic: !href,
      aria: title + (tagline ? ' — ' + tagline : ''),
      rootCss: ['position: relative', 'box-sizing: border-box', 'width: 100%', 'height: 844px', 'overflow: hidden', 'display: flex', 'flex-direction: column',
        'align-items: center', 'justify-content: center', 'padding: 0 24px 40px', 'background: #234088', 'color: #FFFFFF', 'text-decoration: none',
        "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif", '-webkit-font-smoothing: antialiased'].join('; ')
    };
  }
}
</script>
</body>
</html>
