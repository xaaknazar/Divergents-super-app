<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PersonalizeSection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<section aria-label="{{title}}" style="{{rootCss}}">
  <div style="display: flex; align-items: center; gap: 10px; padding: 13px 16px 12px">
    <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 8px; background: rgba(61,91,219,0.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><dc-import name="Icon" icon="{{icon}}" variant="solid" size="sm" tone="brand" hint-size="16px,16px"></dc-import></span>
    <span style="flex: 1; min-width: 0"><dc-import name="Text" variant="subheadEm" heading="2" text="{{title}}" hint-size="100%,20px"></dc-import></span>
    <dc-import name="Text" variant="subhead" tone="secondary" align="end" text="{{value}}" hint-size="90px,20px"></dc-import>
  </div>
  <div style="padding: 0 12px 14px">
    <sc-if value="{{hasChildren}}" hint-placeholder-val="{{true}}">{{children}}</sc-if>
    <sc-if value="{{isDemo}}" hint-placeholder-val="{{false}}"><dc-import name="Segmented" items="{{demoItems}}" value="{{0}}" hint-size="100%,48px"></dc-import></sc-if>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","default":"sun","options":["sun","palette","text-t","image","crescent","sliders"]},"title":{"editor":"text","default":"Оформление"},"value":{"editor":"text","default":"Система"},"children":{"editor":null},"$preview":{"width":358,"height":126}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var hasChildren = p.children !== undefined && p.children !== null && p.children !== '';
    return {
      rootCss: ['display: block', 'box-sizing: border-box', 'width: 100%', 'background: #FFFFFF', 'border-radius: 14px', 'overflow: hidden', 'color: #000000', F].join('; '),
      icon: p.icon || 'sun', title: p.title ?? 'Оформление', value: p.value ?? 'Система',
      hasChildren: hasChildren, isDemo: !hasChildren, children: p.children,
      demoItems: ['Система', 'Светлая', 'Тёмная']
    };
  }
}
</script>
</body>
</html>
