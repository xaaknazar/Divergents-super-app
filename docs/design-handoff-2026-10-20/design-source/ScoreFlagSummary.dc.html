<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ScoreFlagSummary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{css}}">
<div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px">
<dc-import name="Icon" icon="flag" variant="solid" size="sm" tone="danger" hint-size="16px,16px"></dc-import>
<span style="{{titleCss}}">{{title}}</span>
<span style="{{countCss}}">{{total}}<dc-import name="Icon" icon="flag" variant="solid" size="xs" tone="danger" hint-size="12px,12px"></dc-import></span>
</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="3">
<div style="{{tileCss}}">
<dc-import name="Icon" icon="{{it.icon}}" variant="solid" size="md" tone="{{it.tone}}" hint-size="20px,20px"></dc-import>
<span style="{{valueCss}}">{{it.count}}</span>
<span style="{{labelCss}}">{{it.label}}</span>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Мои флаги"},"items":{"editor":null},"separator":{"editor":"boolean","default":false},"$preview":{"width":330,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var on = function (v) { return v === true || v === 'true'; };
    var items = Array.isArray(p.items) && p.items.length ? p.items : [
      { icon: 'book-open', tone: 'brand', label: 'Чтение', count: 0 }, { icon: 'utensils', tone: 'danger', label: 'No Sugar', count: 0 }, { icon: 'body-standing', tone: 'success', label: 'Активность', count: 1 }
    ];
    var total = items.reduce(function (s, it) { return s + Number(it.count || 0); }, 0);
    return {
      title: p.title ?? 'Мои флаги', total: String(total),
      items: items.map(function (it) { return { icon: it.icon || 'flag', tone: it.tone || 'brand', label: it.label || '', count: String(it.count || 0) }; }),
      css: 'padding: 12px 0; border-top: ' + (on(p.separator) ? '0.5px solid rgba(60,60,67,0.18)' : '0') + '; ' + FF,
      titleCss: 'flex: 1; min-width: 0; font-size: 15px; line-height: 20px; font-weight: 700; color: #000000',
      countCss: 'display: inline-flex; align-items: center; gap: 3px; font-size: 12px; line-height: 16px; color: #C5221F',
      tileCss: 'flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 10px 0; border-radius: 12px; background: rgba(118,118,128,0.12)',
      valueCss: 'font-size: 20px; line-height: 25px; font-weight: 700; color: #000000; margin-top: 4px; font-variant-numeric: tabular-nums',
      labelCss: 'font-size: 11px; line-height: 14px; font-weight: 500; color: #5C5C60; margin-top: 1px'
    };
  }
}
</script>
</body>
</html>
