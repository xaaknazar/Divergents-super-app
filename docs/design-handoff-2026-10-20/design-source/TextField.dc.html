<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TextField</title>

<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
<label for="{{uid}}" style="{{labelCss}}">{{label}}<sc-if value="{{required}}" hint-placeholder-val="{{false}}"><span aria-hidden="true"> *</span></sc-if></label>
<div style="position: relative">
<sc-if value="{{multiline}}" hint-placeholder-val="{{false}}"><textarea id="{{uid}}" rows="{{rows}}" placeholder="{{placeholder}}" value="{{val}}" onChange="{{onInput}}" disabled="{{disabled}}" aria-invalid="{{invalid}}" aria-required="{{ariaRequired}}" aria-describedby="{{msgId}}" style="{{fieldCss}}"></textarea></sc-if>
<sc-if value="{{plainInput}}" hint-placeholder-val="{{true}}"><input id="{{uid}}" type="{{type}}" placeholder="{{placeholder}}" value="{{val}}" onChange="{{onInput}}" disabled="{{disabled}}" aria-invalid="{{invalid}}" aria-required="{{ariaRequired}}" aria-describedby="{{msgId}}" style="{{fieldCss}}"></sc-if>
<sc-if value="{{affixInput}}" hint-placeholder-val="{{false}}"><div style="{{boxCss}}"><sc-if value="{{hasPrefix}}" hint-placeholder-val="{{false}}"><span id="{{prefixId}}" style="{{prefixCss}}">{{prefix}}</span></sc-if><input id="{{uid}}" type="{{type}}" placeholder="{{placeholder}}" value="{{val}}" onChange="{{onInput}}" disabled="{{disabled}}" aria-invalid="{{invalid}}" aria-required="{{ariaRequired}}" aria-describedby="{{affixDescribedBy}}" style="{{innerCss}}"><sc-if value="{{hasSuffix}}" hint-placeholder-val="{{false}}"><span id="{{suffixId}}" style="{{suffixCss}}">{{suffix}}</span></sc-if><sc-if value="{{hasTrailing}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="display: flex; flex-shrink: 0; margin-left: 10px; pointer-events: none"><dc-import name="Icon" icon="{{trailingIcon}}" size="md" tone="secondary" hint-size="20px,20px"></dc-import></span></sc-if></div></sc-if>
<sc-if value="{{floatTrailing}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="{{trailCss}}"><dc-import name="Icon" icon="{{trailingIcon}}" size="md" tone="secondary" hint-size="20px,20px"></dc-import></span></sc-if>
</div>
<sc-if value="{{hasError}}" hint-placeholder-val="{{false}}"><p id="{{msgId}}" aria-live="polite" style="{{errCss}}">{{error}}</p></sc-if>
<sc-if value="{{hasHelper}}" hint-placeholder-val="{{false}}"><p id="{{msgId}}" style="{{helpCss}}">{{helper}}</p></sc-if>
</div>
</x-dc>
