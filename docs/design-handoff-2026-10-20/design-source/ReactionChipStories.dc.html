<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ReactionChip — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="420" safe-top="{{false}}" hint-size="390px,420px">
<dc-import name="Wrapper" pad="20" gap="24" hint-size="100%,386px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" hint-size="100%,34px">ReactionChip</dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" hint-size="100%,18px">Реакция под публикацией: icon · count · active</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">ИКОНКИ</dc-import>
<dc-import name="Wrapper3" dir="row" gap="6" wrap="{{true}}" hint-size="100%,26px">
<dc-import name="ReactionChip" icon="thumbs-up" count="12" hint-size="52px,24px"></dc-import>
<dc-import name="ReactionChip" icon="heart" count="8" hint-size="52px,24px"></dc-import>
<dc-import name="ReactionChip" icon="flame" count="5" hint-size="52px,24px"></dc-import>
<dc-import name="ReactionChip" icon="hand-heart" count="4" hint-size="52px,24px"></dc-import>
<dc-import name="ReactionChip" icon="sparkles" count="2" hint-size="52px,24px"></dc-import>
</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">ACTIVE (МОЯ РЕАКЦИЯ)</dc-import>
<dc-import name="Wrapper3" dir="row" gap="6" hint-size="100%,26px">
<dc-import name="ReactionChip" icon="heart" count="8" active="{{true}}" hint-size="52px,24px"></dc-import>
<dc-import name="ReactionChip" icon="thumbs-up" count="13" active="{{true}}" hint-size="52px,24px"></dc-import>
</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">БЕЗ СЧЁТЧИКА (COUNT = 0)</dc-import>
<dc-import name="Wrapper3" dir="row" gap="6" hint-size="100%,26px">
<dc-import name="ReactionChip" icon="hand-heart" count="0" hint-size="36px,24px"></dc-import>
<dc-import name="ReactionChip" icon="sparkles" count="0" hint-size="36px,24px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
