<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>NavHeader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<header style="{{rootCss}}">
  <sc-if value="{{isOverlay}}" hint-placeholder-val="{{false}}">
    <div style="{{overlayBarCss}}">
      <sc-if value="{{hasBack}}" hint-placeholder-val="{{true}}"><dc-import name="IconButton" icon="chevron-left" label="{{backLabel}}" href="{{backHref}}" variant="{{overlayVariant}}" hint-size="48px,48px"></dc-import></sc-if>
      <sc-if value="{{noBack}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 48px"></span></sc-if>
      <div style="display: flex; gap: 8px; align-items: center">
        <sc-if value="{{slotBefore}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; flex-shrink: 0">{{children}}</div></sc-if>
        <sc-for list="{{actions}}" as="a" hint-placeholder-count="0">
          <dc-import name="IconButton" icon="{{a.icon}}" label="{{a.label}}" href="{{a.href}}" badge="{{a.badge}}" tone="{{a.tone}}" variant="{{overlayVariant}}" hint-size="48px,48px"></dc-import>
        </sc-for>
        <sc-if value="{{slotAfter}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; flex-shrink: 0">{{children}}</div></sc-if>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{isBar}}" hint-placeholder-val="{{true}}">
    <div style="{{barCss}}">
      <sc-if value="{{backLink}}" hint-placeholder-val="{{true}}"><a href="{{backHref}}" aria-label="{{backLabel}}" style="{{backCss}}"><dc-import name="Icon" icon="chevron-left" size="md" tone="brand" hint-size="20px,20px"></dc-import><sc-if value="{{showBackLabel}}" hint-placeholder-val="{{false}}"><dc-import name="Text" variant="body" tone="brand" lines="1" text="{{backLabel}}" hint-size="60px,24px"></dc-import></sc-if></a></sc-if>
      <sc-if value="{{backButton}}" hint-placeholder-val="{{false}}"><button type="button" aria-label="{{backLabel}}" style="{{backCss}}"><dc-import name="Icon" icon="chevron-left" size="md" tone="brand" hint-size="20px,20px"></dc-import><sc-if value="{{showBackLabel}}" hint-placeholder-val="{{false}}"><dc-import name="Text" variant="body" tone="brand" lines="1" text="{{backLabel}}" hint-size="60px,24px"></dc-import></sc-if></button></sc-if>
      <sc-if value="{{modalCancelLink}}" hint-placeholder-val="{{false}}"><a href="{{backHref}}" style="{{textActionCss}}">{{backLabel}}</a></sc-if>
      <sc-if value="{{modalCancelButton}}" hint-placeholder-val="{{false}}"><button type="button" style="{{textActionCss}}">{{backLabel}}</button></sc-if>
      <sc-if value="{{noBack}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="{{spacerCss}}"></span></sc-if>
      <sc-if value="{{showInlineTitle}}" hint-placeholder-val="{{true}}"><div style="flex: 1; min-width: 0; margin: 0 8px"><dc-import name="Text" variant="headline" align="center" heading="1" lines="1" text="{{title}}" hint-size="100%,22px"></dc-import></div></sc-if>
      <sc-if value="{{noInlineTitle}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="flex: 1"></span></sc-if>
      <div style="min-width: 48px; display: flex; gap: 8px; padding-right: 6px; align-items: center; justify-content: flex-end; flex-shrink: 0">
        <sc-if value="{{slotBefore}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; flex-shrink: 0">{{children}}</div></sc-if>
        <sc-for list="{{actions}}" as="a" hint-placeholder-count="0">
          <dc-import name="IconButton" icon="{{a.icon}}" label="{{a.label}}" href="{{a.href}}" badge="{{a.badge}}" tone="{{a.tone}}" variant="plain" hint-size="48px,48px"></dc-import>
        </sc-for>
        <sc-if value="{{textActionLink}}" hint-placeholder-val="{{false}}"><a href="{{actionHref}}" style="{{textActionCss}}">{{actionLabel}}</a></sc-if>
        <sc-if value="{{textActionButton}}" hint-placeholder-val="{{false}}"><button type="button" style="{{textActionCss}}">{{actionLabel}}</button></sc-if>
        <sc-if value="{{slotAfter}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: center; flex-shrink: 0">{{children}}</div></sc-if>
        <sc-if value="{{modalClose}}" hint-placeholder-val="{{false}}"><dc-import name="IconButton" icon="x" label="Закрыть" variant="tinted" size="sm" hint-size="36px,36px"></dc-import></sc-if>
      </div>
    </div>
    <sc-if value="{{showLargeTitle}}" hint-placeholder-val="{{false}}">
      <div style="{{largeCss}}">
        <dc-import name="Text" variant="largeTitle" heading="1" text="{{title}}" hint-size="100%,41px"></dc-import>
        <sc-if value="{{hasSubtitle}}" hint-placeholder-val="{{false}}"><dc-import name="Text" variant="subhead" tone="secondary" text="{{subtitle}}" hint-size="100%,20px"></dc-import></sc-if>
      </div>
    </sc-if>
    <sc-if value="{{hairline}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 0.5px; background: rgba(60,60,67,0.18)"></span></sc-if>
  </sc-if>
</header>
</x-dc>

</html>
