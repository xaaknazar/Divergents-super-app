<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Канал</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="1440" safe-top="{{false}}" hint-size="390px,1440px">
  <dc-import name="NavHeader" variant="inline" back-label="Каналы" back-href="Channels.dc.html" actions="{{headerActions}}" hint-size="100%,118px"></dc-import>
  <dc-import name="Wrapper" pad-x="16" pad-top="16" pad-bottom="64" hint-size="100%,1290px">
    <dc-import name="ChannelHero" title="{{channel.title}}" description="{{channel.description}}" src="{{channel.src}}" members="{{channel.members}}" access="open" joined="{{true}}" hint-size="100%,214px"></dc-import>
    <dc-import name="Wrapper2" pad-top="20" pad-bottom="16" hint-size="100%,100px">
      <dc-import name="PostFeedHeader" title="Публикации" count="{{postCount}}" filters="{{filters}}" hint-size="100%,69px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="12" hint-size="100%,960px">
      <sc-for list="{{posts}}" as="p" hint-placeholder-count="3">
        <dc-import name="PostCard" kind="{{p.kind}}" date="{{p.date}}" title="{{p.title}}" text="{{p.text}}" clamped="{{p.clamped}}" reactions="{{p.reactions}}" total="{{p.total}}" hint-size="100%,320px"></dc-import>
      </sc-for>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1440}}'>
class Component extends DCLogic {
  renderVals() {
    var R = function (a, b, c, d, e, heartOn) {
      return [{ icon: 'thumbs-up', count: a }, { icon: 'heart', count: b, active: !!heartOn }, { icon: 'flame', count: c }, { icon: 'hand-heart', count: d }, { icon: 'sparkles', count: e }];
    };
    var posts = [
      { kind: 'article', date: '10 окт., 18:30', title: 'Анонс встреч на октябрь', clamped: true, total: 25, reactions: R(12, 8, 5, 0, 0, true),
        text: 'Друзья, в октябре нас ждёт насыщенный месяц. Каждую среду собираемся в книжном клубе, в выходные — выезд в горы для всех желающих. 12 октября стартует Divergents challenge: Teachers version — 15 дней, пять команд и общий рейтинг. Заявки уже открыты во вкладке «Челленджи». Также готовим лекцию о привычках и кинопоказ с обсуждением — подробности и регистрация появятся в ленте ближе к датам.' },
      { kind: 'voice', date: '8 окт., 09:15', title: 'Итоги прошлого челленджа', clamped: false, total: 19, reactions: R(6, 0, 9, 4, 0), text: '' },
      { kind: 'article', date: '3 окт., 20:00', title: 'Новый формат встреч', clamped: false, total: 6, reactions: R(4, 0, 0, 2, 0),
        text: 'Теперь мероприятия можно создавать прямо в приложении: кнопка «+» на вкладке «Сообщество».' }
    ];
    return {
      headerActions: [{ icon: 'dots-three-horizontal', label: 'Пожаловаться или заблокировать' }],
      channel: { title: 'Danday Amokachi', description: 'Про развитие', src: '/_blob/f528fbb80d712d453cd5785a9e1e06f6', members: 3 },
      postCount: posts.length,
      filters: [{ label: 'Все', count: 3, active: true }, { label: 'Статьи', count: 2 }, { label: 'Голос', count: 1 }],
      posts: posts
    };
  }
}
</script>
</body>
</html>
