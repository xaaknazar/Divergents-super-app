<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DayRow — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="380" safe-top="{{false}}" hint-size="390px,380px">
<dc-import name="Wrapper" pad="20" gap="24" hint-size="100%,340px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" hint-size="100%,34px">DayRow</dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" hint-size="100%,18px">Строка дня в истории: day · date · detail · points · penalty · flags · today · separator</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="8" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">СЕГОДНЯ / ОБЫЧНЫЙ / С ФЛАГОМ</dc-import>
<dc-import name="ListSection" hint-size="100%,200px">
<dc-import name="DayRow" hint-size="100%,64px"></dc-import>
<dc-import name="DayRow" day="8" date="11 октября" detail="24 стр. · без сахара · 10 400 шагов" points="+50" today="{{false}}" separator="{{true}}" hint-size="100%,64px"></dc-import>
<dc-import name="DayRow" day="3" date="6 октября" detail="20 стр. · без сахара · 8 200 шагов" points="+40" penalty="−100" flags="{{1}}" today="{{false}}" separator="{{true}}" hint-size="100%,64px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":380}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
