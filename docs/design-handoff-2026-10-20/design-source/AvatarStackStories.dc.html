</dc-import>

<dc-import name="Wrapper3" dir="row" gap="10" align="center" wrap="{{true}}" hint-size="100%,36px">
<dc-import name="AvatarStack" people="{{captains}}" max="4" size="md" more="106" hint-size="170px,36px"></dc-import>
</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,60px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">FEW · БЕЗ «+N»</dc-import>
<dc-import name="Wrapper3" dir="row" gap="10" align="center" wrap="{{true}}" hint-size="100%,36px">
<dc-import name="AvatarStack" people="{{pair}}" max="4" size="md" hint-size="70px,36px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
</dc-import>
