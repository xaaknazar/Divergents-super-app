<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ProgressRing — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="700" safe-top="{{false}}" hint-size="390px,700px">
<dc-import name="Wrapper" pad="20" gap="24" hint-size="100%,666px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" hint-size="100%,34px">ProgressRing</dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" hint-size="100%,18px">Кольцо прогресса: value · label · caption · size · tone</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,170px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">SIZE · COMPACT 64 / REGULAR 80 / LARGE 120</dc-import>
<dc-import name="Wrapper3" dir="row" gap="20" align="center" align="end" hint-size="100%,146px">
<dc-import name="ProgressRing" value="42" label="42%" size="compact" hint-size="64px,64px"></dc-import>
<dc-import name="ProgressRing" value="68" label="68%" size="regular" hint-size="80px,80px"></dc-import>
<dc-import name="ProgressRing" value="85" label="85%" caption="курса пройдено" size="large" hint-size="160px,146px"></dc-import>
</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,130px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">TONE · BRAND / SUCCESS</dc-import>
<dc-import name="Wrapper3" dir="row" gap="20" align="center" wrap="{{true}}" hint-size="100%,106px">
<dc-import name="ProgressRing" value="70" label="7/10" caption="уроков" tone="brand" hint-size="120px,106px"></dc-import>
<dc-import name="ProgressRing" value="100" label="100%" caption="Готово" tone="success" hint-size="120px,106px"></dc-import>
</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,162px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">INVERSE · НА БРЕНДОВОЙ ПОДЛОЖКЕ</dc-import>
<dc-import name="StoryBackdrop" tone="brand" hint-size="100%,138px"><dc-import name="Wrapper3" dir="row" gap="20" align="center" wrap="{{true}}" hint-size="100%,106px">
<dc-import name="ProgressRing" value="56" label="56%" caption="Неделя 2" tone="inverse" hint-size="120px,106px"></dc-import>
<dc-import name="ProgressRing" value="80" label="80%" size="compact" tone="inverse" hint-size="64px,64px"></dc-import>
</dc-import></dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
