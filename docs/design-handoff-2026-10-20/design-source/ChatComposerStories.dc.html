<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ChatComposer — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<dc-import name="Screen" height="420" safe-top="{{false}}" hint-size="390px,420px">
  <dc-import name="Wrapper" pad-x="16" pad-top="24" gap="20" hint-size="100%,360px">
    <dc-import name="Text" variant="title2" heading="1" text="ChatComposer" hint-size="100%,28px"></dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,74px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="пустое поле (отправка неактивна)" hint-size="100%,18px"></dc-import>
      <dc-import name="ChatComposer" placeholder="Спросите ассистента…" hint-size="100%,48px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,74px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="value (отправка активна)" hint-size="100%,18px"></dc-import>
      <dc-import name="ChatComposer" placeholder="Спросите ассистента…" value="Какую книгу почитать про лидерство?" hint-size="100%,48px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,74px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="disabled" hint-size="100%,18px"></dc-import>
      <dc-import name="ChatComposer" placeholder="Нет подключения к интернету" disabled="{{true}}" hint-size="100%,48px"></dc-import>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":420}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
