<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ShortcutCard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <dc-import name="IconTile" icon="{{icon}}" tone="{{tileTone}}" variant="{{tileVariant}}" size="md" hint-size="44px,44px"></dc-import>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
    <dc-import name="Text" variant="headline" text="{{title}}" hint-size="100%,22px"></dc-import>
    <sc-if value="{{hasSubtitle}}" hint-placeholder-val="{{true}}"><dc-import name="Text" variant="footnote" tone="secondary" text="{{subtitle}}" hint-size="100%,36px"></dc-import></sc-if>
  </div>
  <span aria-hidden="true" style="display: flex; flex-shrink: 0"><dc-import name="Icon" icon="chevron-right" size="sm" tone="tertiary" hint-size="16px,16px"></dc-import></span>
  <sc-if value="{{hasHref}}" hint-placeholder-val="{{false}}"><a href="{{href}}" aria-label="{{ariaLabel}}" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; border-radius: 14px"></a></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","default":"book","options":["arrow-down","arrow-from-square-up-right","arrow-left","arrow-right","arrow-rotate-cw-up","arrow-to-bracket-down","arrow-up","ball-soccer","bell","bell-slash","bike","bin","body-standing","bolt-vertical","book","book-bookmark","book-open","bookmark","books-spines","briefcase","building","bullseye","calendar","calendar-check","calendar-star","camera","car","chart-bar","chart-line","chart-pie","chat-bubble","chat-bubbles","check","check-circle","checks","chevron-down","chevron-left","chevron-right","chevron-small-down","chevron-small-right","chevron-up","clipboard","clock-3h","cloud-arrow-down","coffee-cup","compass","copy","credit-card","crescent","crown","dots-three-horizontal","dots-three-vertical","envelope","exclamation-circle","exclamation-triangle","eye","eye-slash","fast-backward","fast-forward","file","file-doc","flag","flame","funnel","gear","gift","globe","graduation-cap","grid-2x2","hand-heart","handshake","headphones","heart","history","home","image","images","inbox","layers","lightbulb","link","list","lock-locked","lock-unlocked","magic-wand","magnifying-glass","map","medal-sport","mic","minus","mountains","navigation","note","palette","paperplane","pause","pause-circle","pencil","pencil-square","people","person","person-check","person-circle","person-plus","person-running","person-square","phone","pin","pin-check","plane","play","play-circle","plus","plus-circle","pulse","qr-code","question-circle","quote-left","robot","rocket","seal-check","share-network","shield-check","shop","skip-backward","skip-forward","sliders","smartphone","sparkles","speaker","star","star-half","stopwatch","sun","tag","target-location","tent","text-i-circle","text-t","thumbs-up","ticket","translate","trending-up","trophy","utensils","video-camera","volume-2","wallet","weight","wifi-slash","x","x-circle"]},"title":{"editor":"text","default":"Библиотека книг"},"subtitle":{"editor":"text","default":""},"variant":{"editor":"enum","default":"gradient","options":["tinted","gradient","outlined"]},"accent":{"editor":"enum","default":"brand","options":["brand","violet","orange","emerald","pink"]},"href":{"editor":"text","default":""},"$preview":{"width":358,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var demo = p.title === undefined && p.subtitle === undefined && p.icon === undefined;
    var variant = p.variant || 'gradient';
    var ACCENTS = {
      brand: { c: '61,91,219', ink: '#234088' },
      violet: { c: '139,92,246', ink: '#5B21B6' },
      orange: { c: '249,115,22', ink: '#9A3412' },
      emerald: { c: '16,185,129', ink: '#047857' },
      pink: { c: '236,72,153', ink: '#9D174D' }
    };
    var A = ACCENTS[p.accent] || ACCENTS.brand;
    var title = p.title !== undefined && p.title !== null ? p.title : (demo ? 'Библиотека книг' : '');
    var subtitle = p.subtitle || (demo ? 'Каталог, рецензии и ИИ-советник по книгам под ваш профиль' : '');
    var href = p.href || (demo ? 'BooksCatalog.dc.html' : '');
    var big = variant === 'gradient';
    var tint = 'rgba(' + A.c + ',0.13)';
    var bg = variant === 'gradient' ? 'background: linear-gradient(135deg, rgba(' + A.c + ',0.20), ' + tint + ')'
      : variant === 'outlined' ? 'background: #FFFFFF' : 'background: ' + tint;
    var rootCss = ['position: relative', 'display: flex', 'align-items: center', 'gap: ' + (big ? 14 : 12) + 'px', 'padding: ' + (big ? 16 : 14) + 'px',
      'border-radius: 14px', 'box-sizing: border-box', 'width: 100%', 'min-width: 0', 'color: #000000', bg,
      "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif", '-webkit-font-smoothing: antialiased'].join('; ');
    return {
      rootCss: rootCss,
      tileTone: { brand: 'brand', violet: 'violet', orange: 'orange', emerald: 'trip', pink: 'pink' }[p.accent] || 'brand',
      tileVariant: variant === 'gradient' ? 'solid' : 'soft',
      icon: p.icon || (variant === 'tinted' ? 'cloud-arrow-down' : 'book'),
      title: title, subtitle: subtitle, hasSubtitle: !!subtitle,
      hasHref: !!href, href: href, ariaLabel: subtitle ? title + '. ' + subtitle : title
    };
  }
}
</script>
</body>
</html>
