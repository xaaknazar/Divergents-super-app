<head>

<title>IconTile — варианты</title>

<x-dc>

    <dc-import name="Wrapper2" gap="8" hint-size="100%,70px">
      <dc-import name="Text" variant="caption2Em" tone="secondary" text="VARIANT=SOLID · SIZE=MD" hint-size="100%,14px"></dc-import>

        <dc-import name="IconTile" icon="trophy" tone="orange" variant="solid" size="md" hint-size="44px,44px"></dc-import>
        <dc-import name="IconTile" icon="heart" tone="pink" variant="solid" size="md" hint-size="44px,44px"></dc-import>
        <dc-import name="IconTile" icon="gear" tone="neutral" variant="solid" size="md" hint-size="44px,44px"></dc-import>
      </dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,70px">
      <dc-import name="Text" variant="caption2Em" tone="secondary" text="VARIANT=SOFT · SIZE=MD" hint-size="100%,14px"></dc-import>

        <dc-import name="IconTile" icon="graduation-cap" tone="brand" variant="soft" size="md" hint-size="44px,44px"></dc-import>
        <dc-import name="IconTile" icon="flame" tone="challenge" variant="soft" size="md" hint-size="44px,44px"></dc-import>
        <dc-import name="IconTile" icon="mountains" tone="trip" variant="soft" size="md" hint-size="44px,44px"></dc-import>

        <dc-import name="IconTile" icon="book" tone="violet" variant="soft" size="md" hint-size="44px,44px"></dc-import>
        <dc-import name="IconTile" icon="trophy" tone="orange" variant="soft" size="md" hint-size="44px,44px"></dc-import>

        <dc-import name="IconTile" icon="gear" tone="neutral" variant="soft" size="md" hint-size="44px,44px"></dc-import>
      </dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,70px">
      <dc-import name="Text" variant="caption2Em" tone="secondary" text="SIZE SM · MD · LG" hint-size="100%,14px"></dc-import>
      <dc-import name="Wrapper3" dir="row" gap="10" align="center" hint-size="100%,52px">
        <dc-import name="IconTile" icon="map" tone="brand" size="sm" hint-size="36px,36px"></dc-import>
        <dc-import name="IconTile" icon="map" tone="brand" size="md" hint-size="44px,44px"></dc-import>
        <dc-import name="IconTile" icon="map" tone="brand" size="lg" hint-size="52px,52px"></dc-import>
      </dc-import>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":510}}'>
class Component extends DCLogic { renderVals() { return {}; } }
