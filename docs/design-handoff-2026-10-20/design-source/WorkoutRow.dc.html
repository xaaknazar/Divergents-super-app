<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WorkoutRow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<sc-if value="{{isLink}}" hint-placeholder-val="{{true}}"><a href="{{href}}" aria-label="{{aria}}" style="{{css}}"><sc-if value="{{separator}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: 0; left: 100px; right: 0; height: 0.5px; background: rgba(60,60,67,0.18)"></span></sc-if><dc-import name="RouteThumb" size="thumb" variant="tile" points="{{route}}" hint-size="72px,72px"></dc-import><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 6px; color: #234088"><dc-import name="Icon" icon="{{modeIcon}}" variant="solid" size="xs" tone="inherit" hint-size="12px,12px"></dc-import><dc-import name="Text" variant="caption1" tone="secondary" text="{{date}}" hint-size="120px,16px"></dc-import></span><dc-import name="Text" variant="title3" numeric="{{true}}" text="{{distance}}" hint-size="100%,25px"></dc-import><span style="display: flex; flex-wrap: wrap; gap: 12px"><sc-for list="{{stats}}" as="s" hint-placeholder-count="3"><dc-import name="Text" variant="caption1" tone="secondary" numeric="{{true}}" text="{{s.t}}" hint-size="48px,16px"></dc-import></sc-for></span></span><sc-if value="{{counted}}" hint-placeholder-val="{{false}}"><dc-import name="StatusBadge" icon="" label="✓" tone="success" hint-size="30px,22px"></dc-import></sc-if><sc-if value="{{chevron}}" hint-placeholder-val="{{true}}"><dc-import name="Icon" icon="chevron-right" size="xs" tone="tertiary" hint-size="12px,12px"></dc-import></sc-if></a></sc-if>
<sc-if value="{{isBlock}}" hint-placeholder-val="{{false}}"><div style="{{css}}"><sc-if value="{{separator}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: 0; left: 100px; right: 0; height: 0.5px; background: rgba(60,60,67,0.18)"></span></sc-if><dc-import name="RouteThumb" size="thumb" variant="tile" points="{{route}}" hint-size="72px,72px"></dc-import><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 6px; color: #234088"><dc-import name="Icon" icon="{{modeIcon}}" variant="solid" size="xs" tone="inherit" hint-size="12px,12px"></dc-import><dc-import name="Text" variant="caption1" tone="secondary" text="{{date}}" hint-size="120px,16px"></dc-import></span><dc-import name="Text" variant="title3" numeric="{{true}}" text="{{distance}}" hint-size="100%,25px"></dc-import><span style="display: flex; flex-wrap: wrap; gap: 12px"><sc-for list="{{stats}}" as="s" hint-placeholder-count="3"><dc-import name="Text" variant="caption1" tone="secondary" numeric="{{true}}" text="{{s.t}}" hint-size="48px,16px"></dc-import></sc-for></span></span><sc-if value="{{counted}}" hint-placeholder-val="{{false}}"><dc-import name="StatusBadge" icon="" label="✓" tone="success" hint-size="30px,22px"></dc-import></sc-if><sc-if value="{{chevron}}" hint-placeholder-val="{{true}}"><dc-import name="Icon" icon="chevron-right" size="xs" tone="tertiary" hint-size="12px,12px"></dc-import></sc-if></div></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","default":"run","options":["run","walk"]},"date":{"editor":"text","default":"Сегодня, 07:12"},"distance":{"editor":"text","default":"5,02 км"},"counted":{"editor":"boolean","default":false},"separator":{"editor":"boolean","default":false},"href":{"editor":"text","default":"WorkoutDetail.dc.html"},"stats":{"editor":null},"route":{"editor":null},"$preview":{"width":358,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var walk = p.mode === 'walk';
    var stats = (p.stats || ['28:34', '5′34″/км', '≈4 620']).map(function (t) { return { t: t }; });
    var counted = !!p.counted;
    var href = p.href ?? 'WorkoutDetail.dc.html';
    var date = p.date ?? 'Сегодня, 07:12';
    var distance = p.distance ?? '5,02 км';
    return {
      css: ['position: relative', 'box-sizing: border-box', 'width: 100%', 'display: flex', 'align-items: center', 'gap: 12px', 'padding: 12px 16px',
        'color: #000000', 'text-decoration: none', "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif", '-webkit-font-smoothing: antialiased'].join('; '),
      modeIcon: walk ? 'body-standing' : 'bolt-vertical',
      date: date, distance: distance, stats: stats,
      route: p.route || '',
      counted: counted, chevron: !counted,
      separator: !!p.separator,
      aria: (walk ? 'Ходьба' : 'Бег') + ', ' + date + ', ' + distance + (counted ? ', в зачёте челленджа' : ''),
      href: href, isLink: !!href, isBlock: !href
    };
  }
}
</script>
</body>
</html>
