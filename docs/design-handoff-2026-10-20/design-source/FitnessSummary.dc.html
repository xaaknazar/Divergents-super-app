<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>FitnessSummary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <a href="{{href}}" aria-label="{{title}}" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit">
    <dc-import name="IconTile" icon="person-running" tone="brand" variant="solid" size="sm" hint-size="36px,36px"></dc-import>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><dc-import name="Text" variant="headline" text="{{title}}" hint-size="100%,22px"></dc-import><dc-import name="Text" variant="caption1" tone="secondary" lines="1" text="{{subtitle}}" hint-size="100%,16px"></dc-import></span>
    <dc-import name="Icon" icon="chevron-right" size="sm" tone="tertiary" hint-size="16px,16px"></dc-import>
  </a>
  <div style="display: flex; gap: 8px">
    <sc-for list="{{stats}}" as="s" hint-placeholder-count="3"><div style="flex: 1 1 0; min-width: 0; background: rgba(118,118,128,0.12); border-radius: 12px; padding: 8px 0; display: flex; flex-direction: column; align-items: center"><dc-import name="Text" variant="subheadEm" align="center" numeric="{{true}}" text="{{s.value}}" hint-size="100%,20px"></dc-import><dc-import name="Text" variant="caption2" tone="secondary" align="center" text="{{s.label}}" hint-size="100%,14px"></dc-import></div></sc-for>
  </div>
  <div style="display: flex; gap: 8px">
    <div style="flex: 1 1 0; min-width: 0"><dc-import name="Button" label="Записать" icon="person-running" size="compact" full-width="{{true}}" href="{{recordHref}}" hint-size="100%,44px"></dc-import></div>
    <div style="flex: 1 1 0; min-width: 0"><dc-import name="Button" label="Открыть" icon="arrow-right" variant="tinted" size="compact" full-width="{{true}}" href="{{href}}" hint-size="100%,44px"></dc-import></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Мои тренировки"},"subtitle":{"editor":"text","default":"64,8 км всего · 12,6 км за неделю"},"href":{"editor":"text","default":"MyFitness.dc.html"},"recordHref":{"editor":"text","default":"WorkoutTrack.dc.html"},"stats":{"editor":null},"$preview":{"width":358,"height":176}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    return {
      rootCss: ['display: flex', 'flex-direction: column', 'gap: 12px', 'padding: 14px', 'box-sizing: border-box', 'width: 100%', 'color: #000000', F].join('; '),
      title: p.title ?? 'Мои тренировки', subtitle: p.subtitle ?? '64,8 км всего · 12,6 км за неделю',
      href: p.href ?? 'MyFitness.dc.html', recordHref: p.recordHref ?? 'WorkoutTrack.dc.html',
      stats: Array.isArray(p.stats) ? p.stats : [{ value: '8,4 км', label: 'рекорд бега' }, { value: '5′12″', label: 'лучший темп' }, { value: '2', label: 'целей' }]
    };
  }
}
</script>
</body>
</html>
