<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TeamStepper</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div role="group" aria-label="{{label}}" style="{{css}}">
<button type="button" aria-label="Уменьшить" style="{{btnCss}}"><dc-import name="Icon" icon="minus" size="md" tone="brand" hint-size="20px,20px"></dc-import></button>
<span aria-live="polite" style="{{valueCss}}">{{value}}</span>
<button type="button" aria-label="Увеличить" style="{{btnCss}}"><dc-import name="Icon" icon="plus" size="md" tone="brand" hint-size="20px,20px"></dc-import></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"value":{"editor":"int","default":22,"min":0,"max":999},"label":{"editor":"text","default":"Размер команды"},"$preview":{"width":170,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    var FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var p = this.props;
    return {
      value: p.value !== undefined && p.value !== null ? String(p.value) : '22',
      label: p.label || 'Размер команды',
      css: 'display: inline-flex; align-items: center; gap: 14px; padding: 4px 6px; border-radius: 12px; background: rgba(118,118,128,0.12); ' + FF,
      btnCss: 'width: 48px; height: 48px; border-radius: 24px; border: 0; padding: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer',
      valueCss: 'min-width: 28px; text-align: center; font-size: 17px; line-height: 22px; font-weight: 700; letter-spacing: -0.2px; color: #000000; font-variant-numeric: tabular-nums'
    };
  }
}
</script>
</body>
</html>
