<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DayCell</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<sc-if value="{{isButton}}" hint-placeholder-val="{{false}}"><button type="button" aria-label="{{aria}}" style="{{css}}"><span style="{{labelCss}}">{{label}}</span><sc-if value="{{hasSub}}" hint-placeholder-val="{{false}}"><span style="{{subCss}}">{{sub}}</span></sc-if><sc-if value="{{hasFlag}}" hint-placeholder-val="{{false}}"><dc-import name="Icon" icon="flag" variant="solid" size="xs" tone="danger" hint-size="12px,12px"></dc-import></sc-if></button></sc-if>
<sc-if value="{{isBox}}" hint-placeholder-val="{{true}}"><div aria-label="{{aria}}" style="{{css}}"><span style="{{labelCss}}">{{label}}</span><sc-if value="{{hasSub}}" hint-placeholder-val="{{true}}"><span style="{{subCss}}">{{sub}}</span></sc-if></div></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"12"},"sub":{"editor":"text","default":"Д9"},"state":{"editor":"enum","default":"current","options":["past","current","upcoming","done","flagged","missed","today"]},"size":{"editor":"enum","default":"compact","options":["compact","regular"]},"$preview":{"width":52,"height":44}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var state = p.state || 'current';
    var regular = p.size === 'regular';
    var label = p.label !== undefined && p.label !== null ? String(p.label) : '12';
    var sub = p.sub !== undefined && p.sub !== null ? p.sub : (regular ? '' : 'Д9');
    // [background, border, label color, sub color]
    var S = {
      past: ['rgba(61,91,219,0.13)', '0', '#234088', '#5C5C60'],
      current: ['#234088', '0', '#FFFFFF', 'rgba(255,255,255,0.82)'],
      upcoming: ['rgba(118,118,128,0.12)', '0', regular ? '#6B6B70' : '#000000', '#5C5C60'],
      done: ['rgba(52,199,89,0.18)', '0', '#187A32', '#5C5C60'],
      flagged: ['rgba(255,59,48,0.14)', '0', '#C5221F', '#5C5C60'],
      missed: ['rgba(255,59,48,0.28)', '0', '#C5221F', '#5C5C60'],
      today: ['rgba(61,91,219,0.13)', '1.5px solid #234088', '#234088', '#5C5C60']
    };
    var s = S[state] || S.current;
    var css = ['box-sizing: border-box', 'display: flex', 'flex-direction: column', 'align-items: center', 'justify-content: center', 'padding: 0', 'margin: 0',
      'background: ' + s[0], 'border: ' + s[1], FF, 'font: inherit'];
    if (regular) css.push('width: 44px', 'height: 44px', 'border-radius: 12px', 'cursor: pointer');
    else css.push('width: 100%', 'min-height: 40px', 'border-radius: 10px');
    var aria = 'День ' + (regular ? label : (sub || label)) + (state === 'today' || state === 'current' ? ', сегодня' : '');
    return {
      css: css.join('; '),
      labelCss: (regular ? 'font-size: 15px; line-height: ' + (state === 'flagged' ? 18 : 20) + 'px' : 'font-size: 13px; line-height: 18px') + '; font-weight: 700; color: ' + s[2] + '; ' + FF,
      subCss: 'font-size: 11px; line-height: 14px; font-weight: 500; margin-top: 1px; color: ' + s[3] + '; ' + FF,
      label: label, sub: sub, hasSub: !!sub && !regular,
      hasFlag: regular && state === 'flagged',
      isButton: regular && state !== 'upcoming', isBox: !(regular && state !== 'upcoming'),
      aria: aria
    };
  }
}
</script>
</body>
</html>
