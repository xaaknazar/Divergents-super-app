<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>VacancyRow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <sc-if value="{{separator}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: rgba(60,60,67,0.18)"></span></sc-if>
  <dc-import name="CompanyLogo" company="{{company}}" tone="{{logoTone}}" size="sm" hint-size="40px,40px"></dc-import>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
    <dc-import name="Text" variant="body" text="{{title}}" hint-size="100%,24px"></dc-import>
    <dc-import name="Text" variant="subhead" tone="secondary" lines="1" text="{{subtitle}}" hint-size="100%,20px"></dc-import>
  </div>
  <sc-if value="{{hasStatus}}" hint-placeholder-val="{{false}}"><span style="display: flex; flex-shrink: 0"><dc-import name="StatusBadge" label="{{status}}" tone="{{statusTone}}" hint-size="80px,22px"></dc-import></span></sc-if>
  <sc-if value="{{isBookmark}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="Сохранено" style="display: flex; flex-shrink: 0"><dc-import name="Icon" icon="bookmark" variant="solid" size="sm" tone="brand" hint-size="16px,16px"></dc-import></span></sc-if>
  <sc-if value="{{isChevron}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="display: flex; flex-shrink: 0"><dc-import name="Icon" icon="chevron-right" size="sm" tone="tertiary" hint-size="16px,16px"></dc-import></span></sc-if>
  <sc-if value="{{hasHref}}" hint-placeholder-val="{{false}}"><a href="{{href}}" aria-label="{{ariaLabel}}" style="{{overlayCss}}"></a></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Продуктовый аналитик"},"company":{"editor":"text","default":"IT-компания"},"city":{"editor":"text","default":"Астана"},"logoTone":{"editor":"enum","default":"indigo","options":["brand","success","indigo","purple","orange","teal"]},"status":{"editor":"text","default":""},"statusTone":{"editor":"enum","default":"success","options":["brand","success","warning","danger","neutral","sky"]},"trailing":{"editor":"enum","default":"none","options":["none","chevron","bookmark"]},"separator":{"editor":"boolean","default":false},"href":{"editor":"text","default":""},"$preview":{"width":358,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var demo = ['title', 'company', 'city', 'status', 'trailing'].every(function (k) { return p[k] === undefined || p[k] === null; });
    var title = p.title ?? (demo ? 'Продуктовый аналитик' : '');
    var company = p.company ?? (demo ? 'IT-компания' : '');
    var city = p.city ?? (demo ? 'Астана' : '');
    var subtitle = [company, city].filter(Boolean).join(' · ');
    var trailing = p.trailing || (demo ? 'bookmark' : 'none');
    var status = p.status || '';
    var href = p.href || (demo ? 'VacancyDetail.dc.html' : '');
    var R = 0;
    return {
      rootCss: ['position: relative', 'display: flex', 'align-items: center', 'gap: 12px', 'padding: 11px 16px', 'min-height: 48px', 'box-sizing: border-box',
        'width: 100%', 'min-width: 0', 'color: #000000', F].join('; '),
      separator: p.separator === true || p.separator === 'true',
      title: title, subtitle: subtitle, company: company, logoTone: p.logoTone || (demo ? 'indigo' : 'brand'),
      status: status, hasStatus: !!status, statusTone: p.statusTone || 'success',
      isBookmark: trailing === 'bookmark', isChevron: trailing === 'chevron',
      href: href, hasHref: !!href, ariaLabel: [title, subtitle, status].filter(Boolean).join(', '),
      overlayCss: 'position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; border-radius: ' + R + 'px'
    };
  }
}
</script>
</body>
</html>
