<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PageDots — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="340" safe-top="{{false}}" hint-size="390px,340px">
<dc-import name="Wrapper" pad="20" gap="24" hint-size="100%,306px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" hint-size="100%,34px">PageDots</dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" hint-size="100%,18px">Индикатор шагов онбординга: count · index (с 0) · variant</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,70px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">DOTS · ШАГ 1 / 2 / 4 ИЗ 4</dc-import>
<dc-import name="Wrapper3" gap="14"  hint-size="100%,46px">
<dc-import name="PageDots" count="4" index="0" variant="dots" hint-size="100%,6px"></dc-import>
<dc-import name="PageDots" count="4" index="1" variant="dots" hint-size="100%,6px"></dc-import>
<dc-import name="PageDots" count="4" index="3" variant="dots" hint-size="100%,6px"></dc-import>
</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,46px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">BAR · ШАГ 1 ИЗ 4 / 3 ИЗ 5</dc-import>
<dc-import name="Wrapper3" gap="14"  hint-size="100%,22px">
<dc-import name="PageDots" count="4" index="0" variant="bar" hint-size="100%,4px"></dc-import>
<dc-import name="PageDots" count="5" index="2" variant="bar" hint-size="100%,4px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":340}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
