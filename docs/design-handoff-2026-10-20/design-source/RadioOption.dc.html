<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>RadioOption</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<button type="button" role="radio" aria-checked="{{ariaChecked}}" onClick="{{pick}}" style="{{css}}">
<sc-if value="{{hasIcon}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="{{tileCss}}"><dc-import name="Icon" icon="{{icon}}" size="md" tone="brand" hint-size="20px,20px"></dc-import></span></sc-if>
<span style="{{textCss}}"><span style="{{titleCss}}">{{title}}</span><sc-if value="{{hasDesc}}" hint-placeholder-val="{{true}}"><span style="{{descCss}}">{{description}}</span></sc-if></span>
<span aria-hidden="true" style="{{ringCss}}"><span style="{{dotCss}}"></span></span>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Пешком"},"description":{"editor":"text","default":"Маршрут по тротуарам и паркам"},"selected":{"editor":"boolean","default":false},"icon":{"editor":"enum","default":"body-standing","options":["","arrow-down","arrow-from-square-up-right","arrow-left","arrow-right","arrow-rotate-cw-up","arrow-to-bracket-down","arrow-up","ball-soccer","bell","bell-slash","bike","bin","body-standing","bolt-vertical","book","book-bookmark","book-open","bookmark","books-spines","briefcase","building","bullseye","calendar","calendar-check","calendar-star","camera","car","chart-bar","chart-line","chart-pie","chat-bubble","chat-bubbles","check","check-circle","checks","chevron-down","chevron-left","chevron-right","chevron-small-down","chevron-small-right","chevron-up","clipboard","clock-3h","cloud-arrow-down","coffee-cup","compass","copy","credit-card","crescent","crown","dots-three-horizontal","dots-three-vertical","envelope","exclamation-circle","exclamation-triangle","eye","eye-slash","fast-backward","fast-forward","file","file-doc","flag","flame","funnel","gear","gift","globe","graduation-cap","grid-2x2","hand-heart","handshake","headphones","heart","history","home","image","images","inbox","layers","lightbulb","link","list","lock-locked","lock-unlocked","magic-wand","magnifying-glass","map","medal-sport","mic","minus","mountains","navigation","note","palette","paperplane","pause","pause-circle","pencil","pencil-square","people","person","person-check","person-circle","person-plus","person-running","person-square","phone","pin","pin-check","plane","play","play-circle","plus","plus-circle","pulse","qr-code","question-circle","quote-left","robot","rocket","seal-check","share-network","shield-check","shop","skip-backward","skip-forward","sliders","smartphone","sparkles","speaker","star","star-half","stopwatch","sun","tag","target-location","tent","text-i-circle","text-t","thumbs-up","ticket","translate","trending-up","trophy","utensils","video-camera","volume-2","wallet","weight","wifi-slash","x","x-circle"]},"$preview":{"width":390,"height":66}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var on = this.state && this.state.on ? true : !!p.selected;
    var desc = p.description ?? 'Маршрут по тротуарам и паркам';
    var icon = p.icon ?? 'body-standing';
    return {
      ariaChecked: on ? 'true' : 'false',
      pick: function () { self.setState({ on: true }); },
      title: p.title ?? 'Пешком',
      description: desc,
      hasDesc: !!desc,
      icon: icon,
      hasIcon: !!icon,
      css: ['display: flex', 'align-items: center', 'gap: 12px', 'width: 100%', 'box-sizing: border-box', 'margin: 0', 'min-height: 48px', 'padding: 14px',
        'border: 0', 'border-radius: 14px', 'background: #FFFFFF', 'color: #000000', 'text-align: left', 'cursor: pointer',
        'box-shadow: ' + (on ? 'inset 0 0 0 1.5px #234088' : 'none'), F].join('; '),
      tileCss: 'width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: ' + (on ? 'rgba(61,91,219,0.20)' : 'rgba(61,91,219,0.13)'),
      textCss: 'flex: 1; min-width: 0; display: flex; flex-direction: column',
      titleCss: 'font-size: 15px; line-height: 20px; font-weight: 700; letter-spacing: -0.1px',
      descCss: 'font-size: 12px; line-height: 16px; color: #5C5C60; margin-top: 1px',
      ringCss: 'width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: ' + (on ? '2px solid #234088' : '1.5px solid rgba(60,60,67,0.30)'),
      dotCss: 'width: 10px; height: 10px; border-radius: 50%; background: ' + (on ? '#234088' : 'transparent')
    };
  }
}
</script>
</body>
</html>
