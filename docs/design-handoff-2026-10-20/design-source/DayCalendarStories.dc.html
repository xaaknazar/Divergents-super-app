<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DayCalendar — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="680" safe-top="{{false}}" hint-size="390px,680px">
<dc-import name="Wrapper" pad="20" gap="24" hint-size="100%,640px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" hint-size="100%,34px">DayCalendar</dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" hint-size="100%,18px">Календарь дней: variant week|status · days[{label, sub, state}] · legend</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="8" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">WEEK (КАРТОЧКА НА ДЕТАЛЯХ ЧЕЛЛЕНДЖА)</dc-import>
<dc-import name="Card" size="flush" hint-size="100%,190px"><dc-import name="DayCalendar" variant="week" hint-size="100%,190px"></dc-import></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="8" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">STATUS + ЛЕГЕНДА</dc-import>
<dc-import name="Card" size="compact" hint-size="100%,190px"><dc-import name="DayCalendar" variant="status" hint-size="100%,160px"></dc-import></dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":680}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
