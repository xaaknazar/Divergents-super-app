<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DayCell — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="360" safe-top="{{false}}" hint-size="390px,360px">
<dc-import name="Wrapper" pad="20" gap="24" hint-size="100%,320px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" hint-size="100%,34px">DayCell</dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" hint-size="100%,18px">Ячейка дня календаря: state · size</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="8" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">COMPACT · PAST / CURRENT / UPCOMING</dc-import>
<dc-import name="Wrapper3" cols="5" gap="4" hint-size="100%,40px">
<dc-import name="DayCell" label="11" sub="Д8" state="past" size="compact" hint-size="100%,40px"></dc-import>
<dc-import name="DayCell" label="12" sub="Д9" state="current" size="compact" hint-size="100%,40px"></dc-import>
<dc-import name="DayCell" label="13" sub="Д10" state="upcoming" size="compact" hint-size="100%,40px"></dc-import>
</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="8" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">REGULAR · DONE / FLAGGED / MISSED / TODAY / UPCOMING</dc-import>
<dc-import name="Wrapper3" dir="row" gap="8" wrap="{{true}}" hint-size="100%,44px">
<dc-import name="DayCell" label="1" state="done" size="regular" hint-size="44px,44px"></dc-import>
<dc-import name="DayCell" label="3" state="flagged" size="regular" hint-size="44px,44px"></dc-import>
<dc-import name="DayCell" label="5" state="missed" size="regular" hint-size="44px,44px"></dc-import>
<dc-import name="DayCell" label="9" state="today" size="regular" hint-size="44px,44px"></dc-import>
<dc-import name="DayCell" label="10" state="upcoming" size="regular" hint-size="44px,44px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":360}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
