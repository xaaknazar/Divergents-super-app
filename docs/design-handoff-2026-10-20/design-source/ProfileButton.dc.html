<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ProfileButton</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<a href="{{href}}" aria-label="{{aria}}" style="{{rootCss}}">
  <sc-if value="{{hasRing}}" hint-placeholder-val="{{true}}">
    <svg width="{{box}}" height="{{box}}" viewBox="0 0 52 52" aria-hidden="true" style="position: absolute; inset: 0; transform: rotate(-90deg)"><circle cx="26" cy="26" r="24" fill="none" stroke="rgba(35,64,136,0.14)" stroke-width="2.5"></circle><circle cx="26" cy="26" r="24" fill="none" stroke="#234088" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="{{dash}}"></circle></svg>
  </sc-if>
  <span style="{{faceCss}}">
    <sc-if value="{{hasPhoto}}" hint-placeholder-val="{{false}}"><img src="{{src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></sc-if>
    <sc-if value="{{noPhoto}}" hint-placeholder-val="{{true}}"><span style="{{initialsCss}}">{{initials}}</span></sc-if>
  </span>
  <sc-if value="{{hasBadge}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="{{badgeCss}}">{{badgeText}}</span></sc-if>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"person":{"editor":"text","default":"Акназар"},"src":{"editor":"text","default":""},"progress":{"editor":"range","default":75,"min":0,"max":100,"step":5},"badge":{"editor":"int","default":0,"min":0,"max":99},"variant":{"editor":"enum","default":"plain","options":["plain","floating"]},"href":{"editor":"text","default":"ProfileHome.dc.html"},"$preview":{"width":52,"height":52}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var person = (p.person || 'Акназар').trim();
    var parts = person.split(/\s+/);
    var initials = (parts[0] ? parts[0][0] : 'А') + (parts[1] ? parts[1][0] : '');
    var progress = p.progress === undefined || p.progress === null || p.progress === '' ? 75 : Math.max(0, Math.min(100, Number(p.progress)));
    var floating = p.variant === 'floating';
    var box = 52;
    var face = 42;
    var circ = 2 * Math.PI * 24;
    var badge = Number(p.badge || 0);
    var rootCss = [
      'position: relative', 'display: flex', 'align-items: center', 'justify-content: center',
      'width: ' + box + 'px', 'height: ' + box + 'px', 'border-radius: 50%', 'text-decoration: none', 'flex-shrink: 0',
      floating ? 'background: rgba(255,255,255,0.72); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); box-shadow: 0 6px 18px rgba(16,29,44,0.16), inset 0 0 0 0.5px rgba(0,0,0,0.06)' : 'background: transparent'
    ].join('; ');
    var faceCss = [
      'width: ' + face + 'px', 'height: ' + face + 'px', 'border-radius: 50%', 'overflow: hidden', 'display: flex',
      'align-items: center', 'justify-content: center', 'background: linear-gradient(140deg, #3D5BDB 0%, #234088 100%)',
      'box-shadow: 0 2px 6px rgba(35,64,136,0.28), inset 0 0 0 2px rgba(255,255,255,0.9)'
    ].join('; ');
    return {
      href: p.href || 'ProfileHome.dc.html',
      aria: 'Профиль' + (progress > 0 && progress < 100 ? ', анкета заполнена на ' + progress + '%' : '') + (badge > 0 ? ', новых: ' + badge : ''),
      rootCss: rootCss, faceCss: faceCss, box: box,
      hasRing: progress > 0 && progress < 100,
      dash: (circ * progress / 100).toFixed(1) + ' ' + circ.toFixed(1),
      src: p.src || '', hasPhoto: !!p.src, noPhoto: !p.src,
      initials: initials.toUpperCase(),
      initialsCss: "font-family: 'Gotham Rounded', system-ui, sans-serif; font-weight: 700; font-size: 17px; line-height: 1; color: #FFFFFF; letter-spacing: 0.3px",
      hasBadge: badge > 0, badgeText: badge > 9 ? '9+' : String(badge),
      badgeCss: "position: absolute; top: 1px; right: 0; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #FF3B30; color: #FFFFFF; border: 2px solid #FFFFFF; font-family: 'Gotham Rounded', system-ui, sans-serif; font-size: 10px; font-weight: 700; line-height: 14px; text-align: center"
    };
  }
}
</script>
</body>
</html>
