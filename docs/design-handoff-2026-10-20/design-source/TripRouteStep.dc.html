<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TripRouteStep</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="display: flex; gap: 12px; padding: 12px 16px; box-sizing: border-box; width: 100%; background: #FFFFFF; color: #000000; {{ff}}">
  <div aria-hidden="true" style="width: 32px; display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0">
    <span style="width: 28px; height: 28px; border-radius: 14px; background: rgba(61,91,219,0.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><dc-import name="Icon" icon="{{icon}}" variant="solid" size="sm" tone="brand" hint-size="16px,16px"></dc-import></span>
    <sc-if value="{{hasLine}}" hint-placeholder-val="{{true}}"><span style="width: 2px; flex: 1; background: rgba(118,118,128,0.12)"></span></sc-if>
  </div>
  <div style="{{bodyCss}}">
    <span style="font-size: 11px; line-height: 14px; font-weight: 700; color: #5C5C60; text-transform: uppercase">{{day}}</span>
    <dc-import name="Text" variant="body" text="{{title}}" hint-size="100%,24px"></dc-import>
    <sc-if value="{{hasNote}}" hint-placeholder-val="{{true}}"><dc-import name="Text" variant="caption1" tone="secondary" text="{{note}}" hint-size="100%,16px"></dc-import></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","default":"car","options":["car","crescent","mountains","home","tent","plane","utensils","flag","pin"]},"day":{"editor":"text","default":"День 1"},"title":{"editor":"text","default":"Переезд к озеру Кольсай"},"note":{"editor":"text","default":"Выезд в 06:00, в пути около 4 часов"},"last":{"editor":"boolean","default":false},"$preview":{"width":358,"height":82}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var last = p.last === true || p.last === 'true';
    var note = p.note !== undefined ? (p.note || '') : 'Выезд в 06:00, в пути около 4 часов';
    return {
      ff: "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased",
      icon: p.icon || 'car', day: p.day || 'День 1', title: p.title || 'Переезд к озеру Кольсай',
      note: note, hasNote: !!note, hasLine: !last,
      bodyCss: 'flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-bottom: ' + (last ? 0 : 12) + 'px'
    };
  }
}
</script>
</body>
</html>
