<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DaySyncStatus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div role="status" style="{{css}}"><dc-import name="Icon" icon="{{icon}}" variant="solid" size="sm" tone="{{tone}}" hint-size="16px,16px"></dc-import><span style="{{textCss}}">{{text}}</span></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","default":"synced","options":["synced","pending"]},"text":{"editor":"text","default":"Синхронизировано с сервером · итог дня в 23:01"},"separator":{"editor":"boolean","default":false},"$preview":{"width":330,"height":38}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var on = function (v) { return v === true || v === 'true'; };
    var pending = p.state === 'pending';
    return {
      icon: pending ? 'clock-3h' : 'check-circle', tone: pending ? 'warning' : 'success',
      text: p.text ?? 'Синхронизировано с сервером · итог дня в 23:01',
      css: 'min-height: 38px; display: flex; align-items: center; gap: 7px; border-top: ' + (on(p.separator) ? '0.5px solid rgba(60,60,67,0.18)' : '0') + '; ' + FF,
      textCss: 'flex: 1; min-width: 0; font-size: 11px; line-height: 14px; font-weight: 500; color: #5C5C60'
    };
  }
}
</script>
</body>
</html>
