<helmet>
<style>

@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}

<div style="{{rootCss}}">
  <sc-if value="{{hasIcon}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="{{iconCss}}"><dc-import name="Icon" icon="{{icon}}" variant="solid" size="md" tone="inherit" hint-size="20px,20px"></dc-import></span></sc-if>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
    <dc-import name="Text" variant="subhead" tone="{{textTone}}" text="{{text}}" hint-size="100%,20px"></dc-import>
    <sc-if value="{{hasCaption}}" hint-placeholder-val="{{false}}"><dc-import name="Text" variant="caption1" tone="tertiary" text="{{caption}}" hint-size="100%,16px"></dc-import></sc-if>
  </div>
  <sc-if value="{{isLink}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="display: flex; flex-shrink: 0"><dc-import name="Icon" icon="arrow-to-bracket-down" size="sm" tone="tertiary" hint-size="16px,16px"></dc-import></span></sc-if>
  <sc-if value="{{hasHref}}" hint-placeholder-val="{{false}}"><a href="{{href}}" aria-label="{{ariaLabel}}" style="{{overlayCss}}"></a></sc-if>
  <sc-if value="{{isButton}}" hint-placeholder-val="{{false}}"><button type="button" aria-label="{{ariaLabel}}" style="{{overlayCss}}"></button></sc-if>
</div>
</x-dc>

brand","success","warning"]},"text":{"editor":"text","default":"Алматы, [адрес офиса]"},"caption":{"editor":"text","default":""},"variant":{"editor":"enum","default":"plain","options":["plain","link"]},"href":{"editor":"text","default":""},"$preview":{"width":330,"height":24}}'>
class Component extends DCLogic {

    var p = this.props;
