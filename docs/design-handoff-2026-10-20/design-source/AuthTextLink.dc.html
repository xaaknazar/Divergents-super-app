<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AuthTextLink</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<sc-if value="{{isLink}}" hint-placeholder-val="{{false}}"><a href="{{href}}" style="{{css}}">{{label}}</a></sc-if><sc-if value="{{isButton}}" hint-placeholder-val="{{true}}"><button type="button" style="{{css}}">{{label}}</button></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Не получается войти?"},"href":{"editor":"text","default":""},"$preview":{"width":322,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var css = ['display: flex', 'width: 100%', 'box-sizing: border-box', 'align-items: center', 'justify-content: center', 'margin: 0',
      'min-height: 48px', 'padding: 10px', 'border: 0', 'background: transparent', 'cursor: pointer', 'text-decoration: none',
      "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif", '-webkit-font-smoothing: antialiased', 'color: #234088', 'text-align: center',
      'font-size: 15px', 'line-height: 20px', 'font-weight: 500'].join('; ');
    return { css: css, label: p.label || 'Не получается войти?', href: p.href || '', isLink: !!p.href, isButton: !p.href };
  }
}
</script>
</body>
</html>
