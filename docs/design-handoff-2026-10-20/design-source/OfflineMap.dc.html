<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Офлайн-карта</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="844" safe-top="{{false}}" hint-size="390px,844px">
  <dc-import name="Wrapper" layer="overlay-fill" hint-size="390px,844px">
    <dc-import name="MapCanvas" size="screen" pin-size="compact" pins="{{pins}}" user="{{user}}" hint-size="390px,844px"></dc-import>
  </dc-import>
  <dc-import name="Wrapper" layer="overlay-top" hint-size="100%,246px">
    <dc-import name="NavHeader" variant="inline" back-label="Карта" back-href="MapHome.dc.html" hint-size="100%,118px"></dc-import>
    <dc-import name="Wrapper2" pad-x="12" pad-top="64" hint-size="100%,128px">
      <dc-import name="MapBanner" tone="warning" text="Базовая карта без ключа — детализация ограничена." hint-size="100%,44px"></dc-import>
    </dc-import>
  </dc-import>
  <dc-import name="Wrapper" layer="overlay-bottom" align="end" pad-x="12" pad-bottom="120" gap="12" hint-size="100%,228px">
    <dc-import name="MapControl" icon="target-location" shape="round" label="Центр города: Алматы" hint-size="48px,48px"></dc-import>
    <dc-import name="MapControl" icon="cloud-arrow-down" tone="brand" shape="round" label="Скачать офлайн" hint-size="48px,48px"></dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {

    return {
      pins: [
        { x: 96, y: 271, kind: 'cafe', label: 'Кафе', href: 'PlaceDetail.dc.html' },
        { x: 295, y: 363, kind: 'restaurant', label: 'Ресторан' },
        { x: 239, y: 223, kind: 'hotel', label: 'Отель' },
        { x: 63, y: 601, kind: 'park', label: 'Парк' },
        { x: 179, y: 491, kind: 'gym', label: 'Спортзал' },
        { x: 253, y: 461, kind: 'tourism', label: 'Туризм' },
        { x: 109, y: 381, kind: 'guesthouse', label: 'Гостевой дом' }
      ],
      user: { x: 200, y: 422 }
    };
  }
}
</script>
</body>
</html>
