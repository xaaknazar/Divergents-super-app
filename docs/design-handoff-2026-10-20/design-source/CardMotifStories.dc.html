<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>CardMotif — виды</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<dc-import name="Screen" height="900" safe-top="{{false}}" hint-size="390px,900px">
  <dc-import name="Wrapper" pad="16" gap="16" hint-size="100%,860px">
    <dc-import name="Wrapper2" pad-x="4" gap="4" hint-size="100%,56px">
      <dc-import name="Text" variant="title1" heading="1" text="CardMotif" hint-size="100%,34px"></dc-import>
      <dc-import name="Text" variant="footnote" tone="secondary" text="Фон тематических карточек: градиент + иллюстрация. Ставят EventCard / EventRow (kind) и CommunityChallengeProgress" hint-size="100%,36px"></dc-import>
    </dc-import>
    <sc-for list="{{kinds}}" as="k" hint-placeholder-count="4">
      <dc-import name="Wrapper2" layer="anchor" clip="{{true}}" hint-size="100%,170px">
        <dc-import name="CardMotif" kind="{{k.kind}}" hint-size="100%,0px"></dc-import>
        <dc-import name="Wrapper3" layer="anchor" pad="16" pad-bottom="120" hint-size="100%,170px">
          <dc-import name="Text" variant="headline" tone="{{k.tone}}" text="{{k.kind}}" hint-size="100%,22px"></dc-import>
        </dc-import>
      </dc-import>
    </sc-for>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic { renderVals() { return { kinds: [{ kind: 'challenge', tone: 'primary' }, { kind: 'challengeDark', tone: 'white' }, { kind: 'trip', tone: 'primary' }, { kind: 'sport', tone: 'primary' }] }; } }
</script>
</body>
</html>
