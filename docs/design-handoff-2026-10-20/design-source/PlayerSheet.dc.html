<style>

<section style="{{rootCss}}">

  <sc-if value="{{isDemo}}" hint-placeholder-val="{{true}}"><div style="padding: 0 20px 20px; display: flex; flex-direction: column; gap: 2px"><dc-import name="Text" variant="title3" text="Significance" hint-size="100%,25px"></dc-import><dc-import name="Text" variant="subhead" tone="secondary" text="Урок 15 из 34 · Максимизация талантов Gallup" hint-size="100%,20px"></dc-import></div></sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"detent":{"editor":"enum","default":"fill","options":["fill","content"]},"children":{"editor":null},"$preview":{"width":390,"height":552}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var hasChildren = p.children !== undefined && p.children !== null && p.children !== '';
    var rootCss = ['position: relative', 'display: flex', 'flex-direction: column', 'box-sizing: border-box', 'width: 100%', 'min-height: ' + ((p.detent || 'fill') === 'fill' ? 552 : 0) + 'px',

    return { rootCss: rootCss, hasChildren: hasChildren, isDemo: !hasChildren, children: p.children };
  }
}
</script>
