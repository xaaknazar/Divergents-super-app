<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ListSection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<section style="display: flex; flex-direction: column; box-sizing: border-box; width: 100%; min-width: 0; color: #000000; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <sc-if value="{{hasHeader}}" hint-placeholder-val="{{true}}"><h3 style="margin: 0; padding: 8px 20px 6px; font-size: 13px; line-height: 18px; font-weight: 400; color: #5C5C60; text-transform: uppercase; letter-spacing: 0.4px">{{header}}</h3></sc-if>
  <div style="background: #FFFFFF; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column">
    <sc-if value="{{hasChildren}}" hint-placeholder-val="{{false}}">{{children}}</sc-if>
    <sc-if value="{{isDemo}}" hint-placeholder-val="{{true}}">
      <dc-import name="ListRow" icon="check" icon-tone="success" title="Прочитано" detail="3" href="ProfileHome.dc.html" hint-size="100%,48px"></dc-import>
      <dc-import name="ListRow" icon="flame" icon-tone="orange" title="Хочу прочитать" detail="5" separator="{{true}}" href="ProfileHome.dc.html" hint-size="100%,48px"></dc-import>
      <dc-import name="ListRow" icon="book" icon-tone="brand" title="Библиотека книг" separator="{{true}}" href="BooksCatalog.dc.html" hint-size="100%,48px"></dc-import>
    </sc-if>
  </div>
  <sc-if value="{{hasFooter}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 6px 20px 0; font-size: 13px; line-height: 18px; color: #5C5C60">{{footer}}</p></sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"header":{"editor":"text","default":"Мои книги"},"footer":{"editor":"text","default":""},"children":{"editor":null},"$preview":{"width":358,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var hasChildren = p.children !== undefined && p.children !== null && p.children !== '';
    var demo = !hasChildren && p.header === undefined && p.footer === undefined;
    var header = p.header !== undefined && p.header !== null ? p.header : (demo ? 'Мои книги' : '');
    var footer = p.footer !== undefined && p.footer !== null ? p.footer : (demo ? 'Оценённые книги из библиотеки появляются здесь автоматически' : '');
    return {
      header: header, hasHeader: !!header,
      footer: footer, hasFooter: !!footer,
      hasChildren: hasChildren, isDemo: !hasChildren,
      children: p.children
    };
  }
}
</script>
</body>
</html>
