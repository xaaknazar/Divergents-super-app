<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>VacancyHero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <div style="display: flex; gap: 14px; align-items: center">
    <dc-import name="CompanyLogo" company="{{company}}" tone="{{logoTone}}" size="lg" variant="elevated" src="{{logoSrc}}" hint-size="60px,60px"></dc-import>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
      <dc-import name="Text" variant="title2" heading="1" text="{{title}}" hint-size="100%,28px"></dc-import>
      <dc-import name="Text" variant="subhead" tone="secondary" text="{{subtitle}}" hint-size="100%,20px"></dc-import>
    </div>
  </div>
  <sc-if value="{{hasTags}}" hint-placeholder-val="{{true}}"><div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{tags}}" as="t" hint-placeholder-count="3"><dc-import name="StatusBadge" label="{{t.label}}" tone="{{t.tone}}" icon="{{t.icon}}" hint-size="90px,22px"></dc-import></sc-for></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"HR бизнес-партнёр"},"company":{"editor":"text","default":"Ритейл-группа"},"city":{"editor":"text","default":"Алматы"},"logoTone":{"editor":"enum","default":"brand","options":["brand","success","indigo","purple","orange","teal"]},"logoSrc":{"editor":"text","default":""},"tags":{"editor":null},"$preview":{"width":350,"height":100}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var demo = ['title', 'company', 'city', 'tags'].every(function (k) { return p[k] === undefined || p[k] === null; });
    var company = p.company ?? (demo ? 'Ритейл-группа' : '');
    var city = p.city ?? (demo ? 'Алматы' : '');
    var raw = Array.isArray(p.tags) ? p.tags : (demo ? [{ label: 'Гибрид' }, { label: 'от 600 000 ₸' }, { label: '3 дня назад' }] : []);
    var tags = raw.map(function (t) { return { label: t.label || '', tone: t.tone || 'neutral', icon: t.icon || '' }; });
    return {
      rootCss: 'display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; width: 100%; min-width: 0; color: #000000; ' + F,
      title: p.title ?? (demo ? 'HR бизнес-партнёр' : ''), company: company, subtitle: [company, city].filter(Boolean).join(' · '),
      logoTone: p.logoTone || 'brand', logoSrc: p.logoSrc || '', tags: tags, hasTags: tags.length > 0
    };
  }
}
</script>
</body>
</html>
