<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ScoreLegend</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{css}}"><sc-for list="{{items}}" as="it" hint-placeholder-count="2"><span style="{{iconWrapCss}}"><dc-import name="Icon" icon="{{it.icon}}" variant="{{it.variant}}" size="xs" tone="{{it.tone}}" hint-size="12px,12px"></dc-import></span><span>{{it.text}} </span></sc-for></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"items":{"editor":null},"$preview":{"width":358,"height":60}}'>
class Component extends DCLogic {
  renderVals() {
    var FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var M = { flag: ['flag', 'solid', 'danger'], eliminated: ['x-circle', 'solid', 'danger'], left: ['flag', 'line', 'tertiary'] };
    var raw = Array.isArray(this.props.items) && this.props.items.length ? this.props.items : [
      { mark: 'flag', text: '— флаги за пропуск дневной нормы.' },
      { mark: 'eliminated', text: '— участник выбыл, очки заморожены.' },
      { mark: 'left', text: '— вышел по белому флагу капитана.' }
    ];
    return {
      css: 'margin: 0; padding: 6px 20px 0; font-size: 13px; line-height: 18px; color: #5C5C60; ' + FF,
      iconWrapCss: 'display: inline-flex; vertical-align: -1px; margin-right: 3px',
      items: raw.map(function (it) { var m = M[it.mark] || M.flag; return { icon: m[0], variant: m[1], tone: m[2], text: it.text || '' }; })
    };
  }
}
</script>
</body>
</html>
