<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ResumeStepHeader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: rgba(61,91,219,0.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><dc-import name="Icon" icon="{{icon}}" variant="solid" size="md" tone="brand" hint-size="20px,20px"></dc-import></span>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <span style="font-size: 11px; line-height: 14px; font-weight: 700; color: #5C5C60; text-transform: uppercase; letter-spacing: 0.2px">{{eyebrow}}</span>
    <dc-import name="Text" variant="title3" heading="2" text="{{title}}" hint-size="100%,25px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","default":"person","options":["arrow-down","arrow-from-square-up-right","arrow-left","arrow-right","arrow-rotate-cw-up","arrow-to-bracket-down","arrow-up","ball-soccer","bell","bell-slash","bike","bin","body-standing","bolt-vertical","book","book-bookmark","book-open","bookmark","books-spines","briefcase","building","bullseye","calendar","calendar-check","calendar-star","camera","car","chart-bar","chart-line","chart-pie","chat-bubble","chat-bubbles","check","check-circle","checks","chevron-down","chevron-left","chevron-right","chevron-small-down","chevron-small-right","chevron-up","clipboard","clock-3h","cloud-arrow-down","coffee-cup","compass","copy","credit-card","crescent","crown","dots-three-horizontal","dots-three-vertical","envelope","exclamation-circle","exclamation-triangle","eye","eye-slash","fast-backward","fast-forward","file","file-doc","flag","flame","funnel","gear","gift","globe","graduation-cap","grid-2x2","hand-heart","handshake","headphones","heart","history","home","image","images","inbox","layers","lightbulb","link","list","lock-locked","lock-unlocked","magic-wand","magnifying-glass","map","medal-sport","mic","minus","mountains","navigation","note","palette","paperplane","pause","pause-circle","pencil","pencil-square","people","person","person-check","person-circle","person-plus","person-running","person-square","phone","pin","pin-check","plane","play","play-circle","plus","plus-circle","pulse","qr-code","question-circle","quote-left","robot","rocket","seal-check","share-network","shield-check","shop","skip-backward","skip-forward","sliders","smartphone","sparkles","speaker","star","star-half","stopwatch","sun","tag","target-location","tent","text-i-circle","text-t","thumbs-up","ticket","translate","trending-up","trophy","utensils","video-camera","volume-2","wallet","weight","wifi-slash","x","x-circle"]},"step":{"editor":"int","default":1,"min":1,"max":9},"total":{"editor":"int","default":4,"min":1,"max":9},"title":{"editor":"text","default":"Личные данные"},"$preview":{"width":358,"height":40}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    return {
      rootCss: 'display: flex; align-items: center; gap: 10px; box-sizing: border-box; width: 100%; min-width: 0; color: #000000; ' + F,
      icon: p.icon || 'person',
      eyebrow: 'Шаг ' + Number(p.step || 1) + ' из ' + Number(p.total || 4),
      title: p.title ?? 'Личные данные'
    };
  }
}
</script>
</body>
</html>
