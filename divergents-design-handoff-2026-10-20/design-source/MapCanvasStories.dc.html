<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MapCanvas — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Wrapper" pad="24" gap="24" hint-size="820px,1000px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" text="MapCanvas" hint-size="100%,34px"></dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" text="Стилизованная карта: size · route · routeEnds · routeHead · watermark · pins · events · user · drop" hint-size="100%,18px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" text="SIZE=SCREEN (ПИНЫ, СОБЫТИЯ, Я) · SIZE=CARD / PREVIEW / MINI" hint-size="100%,14px"></dc-import>
<dc-import name="Wrapper3" dir="row" gap="24" align="start" hint-size="100%,844px">
<dc-import name="MapCanvas" size="screen" pins="{{pins}}" events="{{events}}" user="{{user}}" hint-size="390px,844px"></dc-import>
<dc-import name="Wrapper4" gap="16" hint-size="358px,780px">
<dc-import name="Text" variant="caption2Em" tone="secondary" text="CARD · ROUTE + ROUTEENDS + WATERMARK" hint-size="100%,14px"></dc-import>
<dc-import name="MapCanvas" size="card" route="{{route}}" route-ends="{{true}}" watermark="{{true}}" hint-size="358px,300px"></dc-import>
<dc-import name="Text" variant="caption2Em" tone="secondary" text="PREVIEW · DROP LARGE" hint-size="100%,14px"></dc-import>
<dc-import name="MapCanvas" size="preview" drop="{{dropLarge}}" hint-size="358px,220px"></dc-import>
<dc-import name="Text" variant="caption2Em" tone="secondary" text="MINI · DROP" hint-size="100%,14px"></dc-import>
<dc-import name="MapCanvas" size="mini" drop="{{drop}}" hint-size="358px,150px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      pins: [
        { x: 96, y: 252, kind: 'cafe', label: 'Little stars', href: 'PlaceDetail.dc.html' }, { x: 296, y: 346, kind: 'restaurant' },
        { x: 306, y: 230, kind: 'hotel' }, { x: 66, y: 606, kind: 'park' }, { x: 176, y: 520, kind: 'gym' }, { x: 38, y: 416, kind: 'cafe', muted: true }
      ],
      events: [{ x: 167, y: 160, kind: 'meetup', time: '18:30' }, { x: 279, y: 573, kind: 'sport', time: '07:00' }],
      user: { x: 196, y: 434 },
      route: '60,250 116,250 116,170 180,170 180,120 246,120 246,70 300,70 300,44 270,30 236,30',
      drop: { x: 179, y: 75, category: 'cafe' },
      dropLarge: { x: 179, y: 110, category: 'cafe', large: true }
    };
  }
}
</script>
</body>
</html>
