<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ProgramDisclosure</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <div style="position: relative; min-height: 56px; padding: 16px; box-sizing: border-box; display: flex; align-items: center; gap: 12px">
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
      <dc-import name="Text" variant="headline" text="{{title}}" hint-size="100%,22px"></dc-import>
      <dc-import name="Text" variant="footnote" tone="secondary" text="{{subtitle}}" hint-size="100%,18px"></dc-import>
    </div>
    <dc-import name="Icon" icon="{{chevron}}" size="sm" tone="secondary" hint-size="16px,16px"></dc-import>
    <button type="button" aria-expanded="{{expandedAttr}}" aria-label="{{title}}" onClick="{{toggle}}" style="{{buttonCss}}"></button>
  </div>
  <sc-if value="{{showBody}}" hint-placeholder-val="{{false}}"><div style="padding: 0 16px 16px">{{children}}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Результаты по дням"},"subtitle":{"editor":"text","default":"19 с нормой · 1 частично · 1 без записи"},"expanded":{"editor":"boolean","default":false},"children":{"editor":null},"$preview":{"width":358,"height":76}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var open = this.state && this.state.open !== undefined ? this.state.open : (p.expanded === true || p.expanded === 'true');
    var hasChildren = p.children !== undefined && p.children !== null && p.children !== '';
    return {
      rootCss: ['display: flex', 'flex-direction: column', 'box-sizing: border-box', 'width: 100%', 'background: #FFFFFF', 'border-radius: 14px', 'overflow: hidden', 'color: #000000', F].join('; '),
      buttonCss: 'position: absolute; top: 0; left: 0; right: 0; bottom: 0; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer',
      title: p.title ?? 'Результаты по дням', subtitle: p.subtitle ?? '19 с нормой · 1 частично · 1 без записи',
      expandedAttr: open ? 'true' : 'false', chevron: open ? 'chevron-up' : 'chevron-down',
      toggle: function () { self.setState({ open: !open }); },
      showBody: open && hasChildren, children: p.children
    };
  }
}
</script>
</body>
</html>
