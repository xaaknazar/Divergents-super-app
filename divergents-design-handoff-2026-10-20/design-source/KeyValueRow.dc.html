<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>KeyValueRow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 22px; box-sizing: border-box; width: 100%; min-width: 0; color: #000000; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0; max-width: 50%; min-width: 0">
    <sc-if value="{{hasIcon}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="display: flex; flex-shrink: 0"><dc-import name="Icon" icon="{{icon}}" size="sm" tone="secondary" hint-size="16px,16px"></dc-import></span></sc-if>
    <dc-import name="Text" variant="{{labelVariant}}" tone="{{labelTone}}" text="{{label}}" hint-size="120px,20px"></dc-import>
  </div>
  <div style="flex: 1; min-width: 0"><dc-import name="Text" variant="{{valueVariant}}" align="end" numeric="{{true}}" text="{{value}}" hint-size="100%,20px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Стоимость курса"},"value":{"editor":"text","default":"30 000 ₸"},"icon":{"editor":"enum","default":"","options":["","calendar","clock-3h","pin","wallet","credit-card","tag","ticket","people","book","person","globe"]},"emphasis":{"editor":"boolean","default":false},"$preview":{"width":322,"height":24}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var demo = p.label === undefined && p.value === undefined;
    var emph = p.emphasis === true || p.emphasis === 'true';
    return {
      label: p.label !== undefined && p.label !== null ? p.label : (demo ? 'Стоимость курса' : ''),
      value: p.value !== undefined && p.value !== null ? String(p.value) : (demo ? '30 000 ₸' : ''),
      icon: p.icon || '', hasIcon: !!p.icon,
      labelVariant: emph ? 'headline' : 'subhead', labelTone: emph ? 'primary' : 'secondary',
      valueVariant: emph ? 'headline' : 'subhead'
    };
  }
}
</script>
</body>
</html>
