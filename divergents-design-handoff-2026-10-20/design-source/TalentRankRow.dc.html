<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TalentRankRow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <sc-if value="{{separator}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: rgba(60,60,67,0.18)"></span></sc-if>
  <span style="{{rankCss}}">{{rank}}</span>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
    <dc-import name="Text" variant="body" text="{{title}}" hint-size="100%,24px"></dc-import>
    <dc-import name="Text" variant="subhead" tone="secondary" text="{{domainLabel}}" hint-size="100%,20px"></dc-import>
  </div>
  <span aria-hidden="true" style="{{dotCss}}"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"rank":{"editor":"int","default":1,"min":1,"max":34},"title":{"editor":"text","default":"Стратег"},"domain":{"editor":"enum","default":"strategic","options":["strategic","influencing","executing","relationship"]},"separator":{"editor":"boolean","default":false},"$preview":{"width":358,"height":68}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var D = {
      strategic: ['#16A34A', 'rgba(22,163,74,0.13)', 'Стратегическое мышление'],
      influencing: ['#EA580C', 'rgba(234,88,12,0.13)', 'Влияние'],
      executing: ['#7C3AED', 'rgba(124,58,237,0.13)', 'Исполнение'],
      relationship: ['#2563EB', 'rgba(37,99,235,0.13)', 'Построение отношений']
    };
    var d = D[p.domain] || D.strategic;
    return {
      rootCss: 'position: relative; display: flex; align-items: center; gap: 12px; padding: 11px 16px; min-height: 48px; box-sizing: border-box; width: 100%; min-width: 0; color: #000000; ' + F,
      separator: p.separator === true || p.separator === 'true',
      rank: String(p.rank ?? 1), title: p.title ?? 'Стратег', domainLabel: d[2],
      rankCss: 'width: 26px; height: 26px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; line-height: 14px; font-weight: 700; background: ' + d[1] + '; color: ' + d[0],
      dotCss: 'width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; background: ' + d[0]
    };
  }
}
</script>
</body>
</html>
