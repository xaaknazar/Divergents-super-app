<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ReadingRules</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<section aria-label="Правила" style="{{rootCss}}">
  <p style="{{summaryCss}}">{{summary}}</p>
  <sc-for list="{{items}}" as="r" hint-placeholder-count="5">
    <div role="button" aria-expanded="false" style="{{rowCss}}">
      <span style="{{numCss}}">{{r.n}}</span>
      <span style="{{itemCss}}">{{r.title}}</span>
      <span aria-hidden="true" style="{{chevCss}}"><dc-import name="Icon" icon="chevron-down" size="sm" tone="inherit" hint-size="16px,16px"></dc-import></span>
    </div>
  </sc-for>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scheme": {"editor": "enum", "default": "light", "options": ["light", "dark"]}, "items": {"editor": null}, "$preview": {"width": 358, "height": 490}}'>
class Component extends DCLogic {
  static PAL = {
    light: { card: '#FFFFFF', border: '#E4E7EF', sep: 'rgba(60,60,67,0.12)', ink: '#0B0E16', ink2: '#5C5C60', ink3: '#6B6B70', brand: '#234088', accent: '#3D5BDB', tint: 'rgba(35,64,136,0.07)', track: '#E9ECF5', ok: '#187A32', okTint: 'rgba(24,122,50,0.09)', warn: '#934900', warnTint: 'rgba(255,149,0,0.12)', shadow: '0 1px 2px rgba(16,24,40,0.05), 0 10px 24px -14px rgba(16,24,40,0.22)', book: '/_blob/534c3a5937de37a34afa6a6ebd91be4b' },
    dark: { card: '#161B26', border: 'rgba(255,255,255,0.08)', sep: 'rgba(255,255,255,0.10)', ink: '#F5F6FA', ink2: 'rgba(235,235,245,0.64)', ink3: 'rgba(235,235,245,0.5)', brand: '#8AA0FF', accent: '#8AA0FF', tint: 'rgba(138,160,255,0.12)', track: 'rgba(255,255,255,0.10)', ok: '#6FD39A', okTint: 'rgba(111,211,154,0.12)', warn: '#FFB35C', warnTint: 'rgba(255,179,92,0.14)', shadow: 'none', book: '/_blob/402f38a271f02261a3be20e630746183' }
  };
  static FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";

  // Short summary + numbered collapsible rules (titles only, details expand in place)
  renderVals() {
    var p = this.props;
    var C = Component.PAL[p.scheme === 'dark' ? 'dark' : 'light'];
    var items = p.items || ['Вступление через капитана команды', 'Час чтения в день — можно частями', 'Паузы и страницы за каждый подход', 'Дополнительное время после часа', 'День заканчивается в 00:00 по Алматы', 'Как считается рейтинг', 'Ограничение выбранных приложений', 'Что видят другие участники'];
    return {
      summary: p.summary || 'Каждый день — 60 минут активного чтения с таймером. Место в рейтинге зависит от среднего времени в день.',
      items: items.map(function (t, i) { return { n: String(i + 1), title: t }; }),
      rootCss: ['box-sizing: border-box', 'width: 100%', 'min-width: 0', 'padding: 6px 16px', 'border-radius: 16px', 'background: ' + C.card, 'border: 1px solid ' + C.border, 'color: ' + C.ink, Component.FF].join('; '),
      summaryCss: 'margin: 10px 0 8px; font-size: 15px; line-height: 21px; color: ' + C.ink2,
      rowCss: 'display: flex; align-items: center; gap: 12px; min-height: 48px; border-top: 0.5px solid ' + C.sep,
      numCss: 'width: 22px; flex-shrink: 0; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: ' + C.ink3,
      itemCss: 'flex: 1; min-width: 0; font-size: 15px; line-height: 20px; color: ' + C.ink,
      chevCss: 'display: flex; flex-shrink: 0; color: ' + C.ink3
    };
  }
}
</script>
</body>
</html>
