<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>FitnessHero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<header style="{{rootCss}}">
  <div style="{{barCss}}">
    <a href="{{backHref}}" style="min-height: 48px; display: flex; align-items: center; gap: 2px; padding: 0 6px; text-decoration: none; color: #FFFFFF"><dc-import name="Icon" icon="chevron-left" size="md" tone="white" hint-size="20px,20px"></dc-import><dc-import name="Text" variant="body" tone="white" text="{{backLabel}}" hint-size="80px,24px"></dc-import></a>
  </div>
  <div style="position: relative; padding: 4px 20px 22px">
    <span aria-hidden="true" style="{{lanesCss}}"></span>
    <span aria-hidden="true" style="position: absolute; right: 16px; top: 4px; width: 56px; height: 56px; border-radius: 17px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; background: rgba(255,255,255,0.14); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.28), inset 0 1px 0 rgba(255,255,255,0.22)"><dc-import name="Icon" icon="{{icon}}" variant="solid" size="xl" tone="inherit" hint-size="28px,28px"></dc-import></span>
    <span style="position: relative; display: block; font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 0.6px">{{eyebrow}}</span>
    <div style="position: relative; margin-top: 2px"><dc-import name="Text" variant="largeTitle" tone="white" heading="1" lines="1" text="{{title}}" hint-size="100%,41px"></dc-import></div>
    <div style="position: relative; display: flex; margin-top: 16px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3"><div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column"><dc-import name="Text" variant="title2" tone="white" numeric="{{true}}" text="{{s.value}}" hint-size="100%,28px"></dc-import><span style="font-size: 11px; line-height: 14px; font-weight: 500; color: rgba(255,255,255,0.8)">{{s.label}}</span></div></sc-for>
    </div>
    <div style="position: relative; display: flex; gap: 10px; margin-top: 16px">
      <a href="{{primaryHref}}" style="{{primaryCss}}"><dc-import name="Icon" icon="{{primaryIcon}}" variant="solid" size="sm" tone="brand" hint-size="16px,16px"></dc-import><span>{{primaryLabel}}</span></a>
      <a href="{{secondaryHref}}" style="{{secondaryCss}}"><dc-import name="Icon" icon="{{secondaryIcon}}" size="sm" tone="white" hint-size="16px,16px"></dc-import><span>{{secondaryLabel}}</span></a>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"backLabel":{"editor":"text","default":"Профиль"},"backHref":{"editor":"text","default":"ProfileHome.dc.html"},"eyebrow":{"editor":"text","default":"Физические показатели"},"title":{"editor":"text","default":"Мои тренировки"},"icon":{"editor":"enum","default":"person-running","options":["person-running","body-standing","pulse","bike","weight","stopwatch"]},"primaryLabel":{"editor":"text","default":"Записать бег"},"primaryHref":{"editor":"text","default":"WorkoutTrack.dc.html"},"primaryIcon":{"editor":"enum","default":"body-standing","options":["body-standing","play","plus","stopwatch"]},"secondaryLabel":{"editor":"text","default":"История"},"secondaryHref":{"editor":"text","default":"WorkoutHistory.dc.html"},"secondaryIcon":{"editor":"enum","default":"list","options":["list","history","chart-bar","calendar"]},"safeArea":{"editor":"boolean","default":true},"stats":{"editor":null},"$preview":{"width":390,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var top = (p.safeArea === false || p.safeArea === 'false') ? 0 : 54;
    var btn = ['flex: 1 1 0', 'min-width: 0', 'min-height: 46px', 'border-radius: 13px', 'display: flex', 'align-items: center', 'justify-content: center', 'gap: 7px',
      'text-decoration: none', 'font-size: 15px', 'line-height: 20px', 'font-weight: 700', F];
    return {
      rootCss: ['position: relative', 'display: block', 'width: 100%', 'box-sizing: border-box', 'overflow: hidden', 'background: linear-gradient(135deg, #234088, #3D5BDB)', 'color: #FFFFFF', F].join('; '),
      barCss: 'display: flex; align-items: center; min-height: 48px; padding: ' + (top + 6) + 'px 8px 10px 12px',
      backLabel: p.backLabel ?? 'Профиль', backHref: p.backHref ?? 'ProfileHome.dc.html',
      // running-track lanes behind the section glyph (decor only)
      lanesCss: "position: absolute; right: -150px; top: -60px; width: 320px; height: 190px; pointer-events: none; background: url(\"data:image/svg+xml;charset=utf-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="320" height="190" viewBox="0 0 320 190"><rect x="10" y="10" width="300" height="170" rx="85" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/><rect x="26" y="26" width="268" height="138" rx="69" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1.5" stroke-dasharray="7 7"/><rect x="42" y="42" width="236" height="106" rx="53" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/><rect x="58" y="58" width="204" height="74" rx="37" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/></svg>') + "\") no-repeat",
      eyebrow: p.eyebrow ?? 'Физические показатели', title: p.title ?? 'Мои тренировки', icon: p.icon || 'person-running',
      stats: Array.isArray(p.stats) ? p.stats : [{ value: '12,6', label: 'км за неделю' }, { value: '6', label: 'тренировок' }, { value: '1', label: 'на сегодня' }],
      primaryLabel: p.primaryLabel ?? 'Записать бег', primaryHref: p.primaryHref ?? 'WorkoutTrack.dc.html', primaryIcon: p.primaryIcon || 'person-running',
      secondaryLabel: p.secondaryLabel ?? 'История', secondaryHref: p.secondaryHref ?? 'WorkoutHistory.dc.html', secondaryIcon: p.secondaryIcon || 'list',
      primaryCss: btn.concat(['background: #FFFFFF', 'color: #234088']).join('; '),
      secondaryCss: btn.concat(['background: rgba(255,255,255,0.18)', 'color: #FFFFFF']).join('; ')
    };
  }
}
</script>
</body>
</html>
