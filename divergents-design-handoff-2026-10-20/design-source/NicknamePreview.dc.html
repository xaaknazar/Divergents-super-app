<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>NicknamePreview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="display: flex; align-items: center; gap: 12px; box-sizing: border-box; width: 100%; min-width: 0; min-height: 68px; padding: 12px 16px; border-radius: 14px; background: #FFFFFF; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <dc-import name="Avatar" person="{{nickname}}" size="md" tone="solid" hint-size="40px,40px"></dc-import>
  <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
    <span style="font-size: 17px; line-height: 22px; font-weight: 700; letter-spacing: -0.2px; color: #000000; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{nickname}}</span>
    <span style="font-size: 13px; line-height: 18px; color: #5C5C60">{{caption}}</span>
  </div>
  <span style="{{tagCss}}">Превью</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"nickname":{"editor":"text","default":"Aknazar"},"caption":{"editor":"text","default":"Так вас увидят другие участники"},"$preview":{"width":342,"height":68}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var nick = (p.nickname ?? 'Aknazar').trim();
    return {
      nickname: nick || 'Псевдоним',
      caption: p.caption ?? 'Так вас увидят другие участники',
      tagCss: 'flex-shrink: 0; padding: 3px 8px; border-radius: 999px; background: rgba(118,118,128,0.12); font-size: 11px; line-height: 14px; font-weight: 700; color: #5C5C60'
    };
  }
}
</script>
</body>
</html>
