<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>BookComposer — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<dc-import name="Screen" height="560" safe-top="{{false}}" hint-size="390px,560px">
  <dc-import name="Wrapper" pad-x="16" pad-top="24" gap="20" hint-size="100%,500px">
    <dc-import name="Text" variant="title2" heading="1" text="BookComposer" hint-size="100%,28px"></dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,190px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="variant=review · пусто (кнопка неактивна)" hint-size="100%,18px"></dc-import>
      <dc-import name="BottomBar" placement="inline" hint-size="100%,166px"><dc-import name="BookComposer" variant="review" placeholder="Написать рецензию" hint-size="100%,104px"></dc-import></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,132px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="variant=ask · пусто / с текстом" hint-size="100%,18px"></dc-import>
      <dc-import name="Wrapper3" gap="12" hint-size="100%,108px"><dc-import name="BookComposer" variant="ask" placeholder="Спросить про книги" hint-size="100%,48px"></dc-import><dc-import name="BookComposer" variant="ask" placeholder="Спросить про книги" value="Что почитать про лидерство?" hint-size="100%,48px"></dc-import></dc-import>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":560}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
