<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ProgramHighlight</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 16px; background: rgba(61,91,219,0.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><dc-import name="Icon" icon="{{icon}}" variant="solid" size="lg" tone="brand" hint-size="24px,24px"></dc-import></span>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
    <dc-import name="Text" variant="headline" text="{{title}}" hint-size="100%,22px"></dc-import>
    <dc-import name="Text" variant="subhead" tone="secondary" text="{{text}}" hint-size="100%,20px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","default":"flame","options":["flame","bolt-vertical","trophy","star","seal-check","calendar-check","medal-sport"]},"title":{"editor":"text","default":"7 дней подряд"},"text":{"editor":"text","default":"Лучшая серия — 12 дней с выполненной нормой."},"$preview":{"width":358,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    return {
      rootCss: ['display: flex', 'align-items: flex-start', 'gap: 12px', 'box-sizing: border-box', 'width: 100%', 'padding: 16px', 'background: #FFFFFF', 'border-radius: 14px', 'color: #000000', F].join('; '),
      icon: p.icon || 'flame', title: p.title ?? '7 дней подряд', text: p.text ?? 'Лучшая серия — 12 дней с выполненной нормой.'
    };
  }
}
</script>
</body>
</html>
