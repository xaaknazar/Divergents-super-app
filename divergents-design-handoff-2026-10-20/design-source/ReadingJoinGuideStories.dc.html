<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ReadingJoinGuide — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<dc-import name="Screen" height="1120" safe-top="{{false}}" hint-size="390px,1120px">
  <dc-import name="Wrapper" pad="16" gap="20" hint-size="100%,1020px">
    <dc-import name="Wrapper2" pad-x="4" gap="4" hint-size="100%,56px">
      <dc-import name="Text" variant="title1" heading="1" text="ReadingJoinGuide" hint-size="100%,34px"></dc-import>
      <dc-import name="Text" variant="footnote" tone="secondary" text="Следующий шаг: выбрать команду → капитан одобрит → читать 60 минут в день" hint-size="100%,36px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,120px">
      <dc-import name="Text" variant="caption2Em" tone="secondary" text="STATE=CHOOSE" hint-size="100%,14px"></dc-import>
      <dc-import name="ReadingJoinGuide" state="choose" hint-size="100%,300px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,120px">
      <dc-import name="Text" variant="caption2Em" tone="secondary" text="STATE=PENDING" hint-size="100%,14px"></dc-import>
      <dc-import name="ReadingJoinGuide" state="pending" team="Vertex" hint-size="100%,250px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,120px">
      <dc-import name="Text" variant="caption2Em" tone="secondary" text="STATE=APPROVED (ДО СТАРТА)" hint-size="100%,14px"></dc-import>
      <dc-import name="ReadingJoinGuide" state="approved" team="Vertex" start-date="1 ноября" hint-size="100%,250px"></dc-import>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
