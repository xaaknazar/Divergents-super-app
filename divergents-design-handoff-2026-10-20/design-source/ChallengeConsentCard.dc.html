<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ChallengeConsentCard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<button type="button" role="checkbox" aria-checked="{{ariaChecked}}" style="{{css}}">
<span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 10px; background: rgba(61,91,219,0.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><dc-import name="Icon" icon="{{icon}}" size="md" tone="brand" hint-size="20px,20px"></dc-import></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; line-height: 20px; font-weight: 700; color: #000000">{{title}}</span><span style="font-size: 12px; line-height: 16px; color: #5C5C60; margin-top: 1px">{{description}}</span></span>
<dc-import name="TaskCheck" checked="{{checked}}" size="md" hint-size="20px,20px"></dc-import>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","default":"body-standing","options":["body-standing","navigation","pin","bell","shield-check"]},"title":{"editor":"text","default":"Разрешить запись тренировок по GPS"},"description":{"editor":"text","default":"Бег и ходьбу можно записывать в приложении по геолокации — дистанция пересчитывается в шаги."},"checked":{"editor":"boolean","default":true},"$preview":{"width":358,"height":110}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var on = p.checked === undefined ? true : (p.checked === true || p.checked === 'true');
    return {
      icon: p.icon || 'body-standing', title: p.title ?? 'Разрешить запись тренировок по GPS',
      description: p.description ?? 'Бег и ходьбу можно записывать в приложении по геолокации — дистанция пересчитывается в шаги.',
      checked: on, ariaChecked: on ? 'true' : 'false',
      css: "width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 12px; padding: 14px; min-height: 48px; margin: 0; border: 0; cursor: pointer; text-align: left; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased"
    };
  }
}
</script>
</body>
</html>
