<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SearchField — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="600" safe-top="{{false}}" hint-size="390px,600px">
<dc-import name="Wrapper" pad="20" gap="24" hint-size="100%,586px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" hint-size="100%,34px">SearchField</dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" hint-size="100%,18px">Поле поиска: placeholder · value (кнопка очистки) · surface grouped|raised</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,72px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">EMPTY</dc-import>
<dc-import name="SearchField" placeholder="Поиск курсов" hint-size="100%,48px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,72px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">FILLED</dc-import>
<dc-import name="SearchField" placeholder="Поиск курсов" value="Лидерство" hint-size="100%,48px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,130px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">OTHER CONTEXTS</dc-import>
<dc-import name="Wrapper3" gap="10"  hint-size="100%,106px">
<dc-import name="SearchField" placeholder="Поиск книг или авторов" hint-size="100%,48px"></dc-import>
<dc-import name="SearchField" placeholder="Поиск мест" hint-size="100%,48px"></dc-import>
</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,72px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">SURFACE=RAISED (белое поле на фоне шапки вкладки)</dc-import>
<dc-import name="SearchField" placeholder="Курсы, уроки, книги" surface="raised" hint-size="100%,48px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
