<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ChannelHero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<section style="{{css}}">
  <div style="position: relative; padding: 18px; background: linear-gradient(135deg, #234088, #3D5BDB)">
    <span aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, rgba(0,0,0,0.22), rgba(0,0,0,0.04))"></span>
    <div style="position: relative; display: flex; align-items: center; gap: 14px">
      <span aria-hidden="true" style="width: 66px; height: 66px; border-radius: 20px; background: rgba(255,255,255,0.22); overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><sc-if value="{{hasSrc}}" hint-placeholder-val="{{true}}"><img src="{{src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></sc-if><sc-if value="{{noSrc}}" hint-placeholder-val="{{false}}"><dc-import name="Icon" icon="chat-bubbles" variant="solid" size="xl" tone="white" hint-size="28px,28px"></dc-import></sc-if></span>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 7px">
        <dc-import name="Text" variant="title2" tone="white" heading="1" text="{{title}}" hint-size="100%,28px"></dc-import>
        <span aria-label="{{membersAria}}" style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,0.2); color: #FFFFFF"><dc-import name="Icon" icon="{{accessIcon}}" size="xs" tone="white" hint-size="12px,12px"></dc-import><span style="font-size: 11px; line-height: 14px; font-weight: 700">{{members}}</span></span>
      </div>
    </div>
    <sc-if value="{{hasDescription}}" hint-placeholder-val="{{true}}"><p style="position: relative; margin: 12px 0 0; font-size: 15px; line-height: 20px; color: rgba(255,255,255,0.95)">{{description}}</p></sc-if>
  </div>
  <div style="background: #FFFFFF; padding: 14px">
    <sc-if value="{{joined}}" hint-placeholder-val="{{true}}"><dc-import name="Button" label="Вы участник" icon="check-circle" variant="tinted" tone="neutral" full-width="{{true}}" hint-size="100%,50px"></dc-import></sc-if>
    <sc-if value="{{notJoined}}" hint-placeholder-val="{{false}}"><dc-import name="Button" label="Вступить" icon="person-plus" variant="solid" tone="brand" full-width="{{true}}" hint-size="100%,50px"></dc-import></sc-if>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Danday Amokachi"},"description":{"editor":"text","default":"Про развитие"},"src":{"editor":"text","default":"/_blob/f528fbb80d712d453cd5785a9e1e06f6"},"members":{"editor":"int","default":3,"min":0,"max":99999},"access":{"editor":"enum","default":"open","options":["open","closed"]},"joined":{"editor":"boolean","default":true},"$preview":{"width":358,"height":214}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var src = p.src !== undefined ? (p.src || '') : '/_blob/f528fbb80d712d453cd5785a9e1e06f6';
    var joined = !(p.joined === false || p.joined === 'false');
    var members = p.members !== undefined && p.members !== null ? Number(p.members) : 3;
    var description = p.description !== undefined ? (p.description || '') : 'Про развитие';
    return {
      css: ['display: block', 'box-sizing: border-box', 'width: 100%', 'min-width: 0', 'border-radius: 22px', 'overflow: hidden',
        'color: #000000', FF].join('; '),
      src: src, hasSrc: !!src, noSrc: !src,
      title: p.title || 'Danday Amokachi',
      description: description, hasDescription: !!description,
      members: String(members), membersAria: 'Участников: ' + members,
      accessIcon: p.access === 'closed' ? 'lock-locked' : 'globe',
      joined: joined, notJoined: !joined
    };
  }
}
</script>
</body>
</html>
