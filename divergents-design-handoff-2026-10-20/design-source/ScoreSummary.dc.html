<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ScoreSummary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{css}}">
<sc-for list="{{items}}" as="it" hint-placeholder-count="2">
<sc-if value="{{it.divider}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 0.5px; align-self: stretch; background: rgba(60,60,67,0.18); flex-shrink: 0"></span></sc-if>
<div style="flex: 1 1 auto; min-width: 0">
<dc-import name="Text" variant="caption1" tone="secondary" text="{{it.label}}" hint-size="100%,16px"></dc-import>
<div style="margin-top: 2px; white-space: nowrap"><dc-import name="Text" variant="title2" numeric="{{true}}" text="{{it.value}}" hint-size="100%,28px"></dc-import></div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"items":{"editor":null},"$preview":{"width":330,"height":50}}'>
class Component extends DCLogic {
  renderVals() {
    var items = Array.isArray(this.props.items) && this.props.items.length ? this.props.items : [{ label: 'Очки', value: '650' }, { label: 'Среди всех', value: '4 место из 160' }];
    return {
      css: "display: flex; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif",
      items: items.map(function (it, i) { return { label: it.label, value: String(it.value), divider: i > 0 }; })
    };
  }
}
</script>
</body>
</html>
