<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ThemePreviewCard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div role="group" aria-label="Предпросмотр темы" style="{{rootCss}}">
  <div style="position: relative; padding: 18px; background: linear-gradient(135deg, #234088, #3D5BDB)">
    <span aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, rgba(0,0,0,0.24), rgba(0,0,0,0.04))"></span>
    <div style="position: relative; display: flex; align-items: center; gap: 14px">
      <span aria-hidden="true" style="width: 54px; height: 54px; border-radius: 16px; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><dc-import name="Text" variant="title2" tone="white" text="{{initial}}" hint-size="20px,28px"></dc-import></span>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <dc-import name="Text" variant="title3" tone="white" text="{{person}}" hint-size="100%,25px"></dc-import>
        <dc-import name="Text" variant="subhead" tone="whiteMuted" text="{{caption}}" hint-size="100%,20px"></dc-import>
        <span style="margin-top: 7px; align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.20); color: #FFFFFF; font-size: 11px; line-height: 14px; font-weight: 700"><dc-import name="Icon" icon="palette" variant="solid" size="xs" tone="white" hint-size="12px,12px"></dc-import>{{accentLabel}}</span>
      </div>
      <dc-import name="ProgressRing" value="{{completion}}" label="{{completionLabel}}" size="compact" tone="inverse" hint-size="64px,64px"></dc-import>
    </div>
  </div>
  <div style="background: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 11px; background: rgba(61,91,219,0.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><dc-import name="Icon" icon="palette" variant="solid" size="md" tone="brand" hint-size="20px,20px"></dc-import></span>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <dc-import name="Text" variant="headline" text="Пример текста" hint-size="100%,22px"></dc-import>
        <dc-import name="Text" variant="footnote" tone="secondary" lines="1" text="Размер меняется по всему приложению" hint-size="100%,18px"></dc-import>
      </div>
    </div>
    <dc-import name="ProgressBar" value="{{sampleProgress}}" size="regular" label="" hint-size="100%,6px"></dc-import>
    <div style="display: flex; gap: 10px; align-items: center">
      <div style="flex: 1; min-width: 0"><dc-import name="Button" label="Кнопка" icon="star" size="compact" full-width="{{true}}" hint-size="100%,44px"></dc-import></div>
      <span style="padding: 10px 15px; border-radius: 18px; background: rgba(61,91,219,0.13); font-size: 13px; line-height: 18px; font-weight: 700; color: #234088">Чип</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"person":{"editor":"text","default":"Акназар"},"caption":{"editor":"text","default":"Так выглядит ваша тема"},"accentLabel":{"editor":"text","default":"Divergents"},"completion":{"editor":"int","default":100,"min":0,"max":100},"sampleProgress":{"editor":"int","default":72,"min":0,"max":100},"$preview":{"width":358,"height":250}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var person = p.person ?? 'Акназар';
    var c = Math.max(0, Math.min(100, Number(p.completion ?? 100)));
    return {
      rootCss: ['display: block', 'box-sizing: border-box', 'width: 100%', 'border-radius: 24px', 'overflow: hidden', 'color: #000000', F].join('; '),
      person: person, initial: (person || '?').charAt(0).toUpperCase(), caption: p.caption ?? 'Так выглядит ваша тема',
      accentLabel: p.accentLabel ?? 'Divergents', completion: c, completionLabel: c + '%', sampleProgress: Number(p.sampleProgress ?? 72)
    };
  }
}
</script>
</body>
</html>
