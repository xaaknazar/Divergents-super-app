<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ReadingProgressSummary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<section aria-label="Прогресс" style="{{rootCss}}">
  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
    <span style="{{labelCss}}">Сегодня</span>
    <span style="{{todayCss}}">{{today}}<span style="{{goalCss}}"> / {{goal}} мин</span></span>
  </div>
  <div role="progressbar" aria-label="Минут сегодня" aria-valuemin="0" aria-valuemax="{{goal}}" aria-valuenow="{{today}}" style="{{trackCss}}"><div style="{{fillCss}}"></div></div>
  <div style="{{gridCss}}">
    <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
      <div style="{{s.css}}">
        <span style="{{valueCss}}">{{s.value}}</span>
        <span style="{{statLabelCss}}">{{s.label}}</span>
        <sc-if value="{{s.hasBadge}}" hint-placeholder-val="{{false}}"><span style="{{s.badgeCss}}">{{s.badge}}</span></sc-if>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scheme": {"editor": "enum", "default": "light", "options": ["light", "dark"]}, "today": {"editor": "int", "default": 18, "min": 0, "max": 300}, "goal": {"editor": "int", "default": 60}, "pace": {"editor": "int", "default": 54, "min": 0, "max": 300}, "streak": {"editor": "int", "default": 6}, "pages": {"editor": "int", "default": 312}, "$preview": {"width": 358, "height": 180}}'>
class Component extends DCLogic {
  static PAL = {
    light: { card: '#FFFFFF', border: '#E4E7EF', sep: 'rgba(60,60,67,0.12)', ink: '#0B0E16', ink2: '#5C5C60', ink3: '#6B6B70', brand: '#234088', accent: '#3D5BDB', tint: 'rgba(35,64,136,0.07)', track: '#E9ECF5', ok: '#187A32', okTint: 'rgba(24,122,50,0.09)', warn: '#934900', warnTint: 'rgba(255,149,0,0.12)', shadow: '0 1px 2px rgba(16,24,40,0.05), 0 10px 24px -14px rgba(16,24,40,0.22)', book: '/_blob/534c3a5937de37a34afa6a6ebd91be4b' },
    dark: { card: '#161B26', border: 'rgba(255,255,255,0.08)', sep: 'rgba(255,255,255,0.10)', ink: '#F5F6FA', ink2: 'rgba(235,235,245,0.64)', ink3: 'rgba(235,235,245,0.5)', brand: '#8AA0FF', accent: '#8AA0FF', tint: 'rgba(138,160,255,0.12)', track: 'rgba(255,255,255,0.10)', ok: '#6FD39A', okTint: 'rgba(111,211,154,0.12)', warn: '#FFB35C', warnTint: 'rgba(255,179,92,0.14)', shadow: 'none', book: '/_blob/402f38a271f02261a3be20e630746183' }
  };
  static FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";

  // Today vs goal + cumulative: average pace (the ranking metric), streak, pages. Status always in text, not colour only.
  renderVals() {
    var p = this.props;
    var C = Component.PAL[p.scheme === 'dark' ? 'dark' : 'light'];
    var today = Number(p.today ?? 18), goal = Number(p.goal ?? 60), pace = Number(p.pace ?? 54);
    var met = pace >= goal;
    var stats = [
      { value: pace + ' мин', label: 'в среднем в день', badge: met ? 'Темп достигнут' : 'Ниже цели', hasBadge: true, tone: met ? 'ok' : 'warn' },
      { value: String(p.streak ?? 6), label: 'дней подряд' },
      { value: String(p.pages ?? 312), label: 'страниц всего' }
    ].map(function (s, i) {
      var T = s.tone === 'ok' ? [C.okTint, C.ok] : [C.warnTint, C.warn];
      return { value: s.value, label: s.label, badge: s.badge || '', hasBadge: !!s.hasBadge,
        css: 'display: flex; flex-direction: column; gap: 2px; min-width: 0; ' + (i ? 'padding-left: 12px; border-left: 0.5px solid ' + C.sep : ''),
        badgeCss: 'align-self: flex-start; margin-top: 4px; font-size: 11px; line-height: 14px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: ' + T[0] + '; color: ' + T[1] };
    });
    return {
      today: String(today), goal: String(goal), stats: stats,
      rootCss: ['box-sizing: border-box', 'width: 100%', 'min-width: 0', 'padding: 16px', 'border-radius: 16px', 'background: ' + C.card, 'border: 1px solid ' + C.border, 'color: ' + C.ink, Component.FF].join('; '),
      labelCss: 'font-size: 15px; line-height: 20px; font-weight: 700; color: ' + C.ink,
      todayCss: 'font-size: 22px; line-height: 28px; font-weight: 700; font-variant-numeric: tabular-nums; color: ' + C.ink,
      goalCss: 'font-size: 15px; font-weight: 500; color: ' + C.ink3,
      trackCss: 'height: 6px; border-radius: 3px; margin-top: 10px; overflow: hidden; background: ' + C.track,
      fillCss: 'height: 100%; border-radius: 3px; width: ' + Math.min(100, Math.round(today / goal * 100)) + '%; background: ' + C.brand,
      gridCss: 'display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 0.5px solid ' + C.sep,
      valueCss: 'font-size: 18px; line-height: 23px; font-weight: 700; font-variant-numeric: tabular-nums; color: ' + C.ink + '; white-space: nowrap',
      statLabelCss: 'font-size: 12px; line-height: 16px; color: ' + C.ink2
    };
  }
}
</script>
</body>
</html>
