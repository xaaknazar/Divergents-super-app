<html lang="ru">
<head>
<meta charset="utf-8">
<title>Checkbox — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="560" safe-top="{{false}}" hint-size="390px,560px">
<dc-import name="Wrapper" pad="20" gap="24" hint-size="100%,526px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" hint-size="100%,34px">Checkbox</dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" hint-size="100%,18px">Флажок: label · checked · description</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,124px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">CHECKED / UNCHECKED</dc-import>
<dc-import name="Wrapper3" gap="4"  hint-size="100%,100px">
<dc-import name="Checkbox" label="Запомнить меня" checked="{{true}}" hint-size="100%,48px"></dc-import>
<dc-import name="Checkbox" label="Получать новости о курсах" hint-size="100%,48px"></dc-import>
</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,96px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">WITH DESCRIPTION</dc-import>
<dc-import name="Checkbox" label="Разрешить запись тренировок по GPS" description="Бег и ходьбу можно записывать в приложении по геолокации — дистанция пересчитывается в шаги." checked="{{true}}" hint-size="100%,72px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,88px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">AGREEMENT</dc-import>
<dc-import name="Checkbox" label="Я прочитал(а) и ознакомился с правилами челленджа выше и согласен(на) их соблюдать." checked="{{true}}" hint-size="100%,64px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
