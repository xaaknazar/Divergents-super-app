<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PodiumMedal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<span role="img" aria-label="{{aria}}" style="{{css}}"><dc-import name="Icon" icon="{{icon}}" variant="solid" size="{{size}}" tone="inherit" hint-size="16px,16px"></dc-import></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","default":"gold","options":["crown","gold","silver","bronze","trophy"]},"size":{"editor":"enum","default":"md","options":["sm","md","lg"]},"$preview":{"width":24,"height":24}}'>
class Component extends DCLogic {
  renderVals() {
    var K = {
      crown: ['crown', '#D4AF37', 'Лидер'], gold: ['medal-sport', '#D4AF37', '1 место'], silver: ['medal-sport', '#A8A9AD', '2 место'],
      bronze: ['medal-sport', '#CD7F32', '3 место'], trophy: ['trophy', '#E0A21A', 'Победитель']
    };
    var k = K[this.props.kind] || K.gold;
    return {
      icon: k[0], aria: k[2], size: { sm: 'sm', md: 'md', lg: 'lg' }[this.props.size] || 'md',
      css: 'display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: ' + k[1]
    };
  }
}
</script>
</body>
</html>
