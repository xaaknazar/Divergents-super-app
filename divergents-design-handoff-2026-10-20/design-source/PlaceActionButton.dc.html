<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PlaceActionButton</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<sc-if value="{{isLink}}" hint-placeholder-val="{{false}}"><a href="{{href}}" style="{{css}}"><dc-import name="Icon" icon="{{icon}}" size="md" tone="primary" hint-size="20px,20px"></dc-import><dc-import name="Text" variant="caption1" tone="secondary" align="center" text="{{label}}" hint-size="90px,16px"></dc-import></a></sc-if>
<sc-if value="{{isButton}}" hint-placeholder-val="{{true}}"><button type="button" aria-pressed="{{pressed}}" style="{{css}}"><dc-import name="Icon" icon="{{icon}}" size="md" tone="primary" hint-size="20px,20px"></dc-import><dc-import name="Text" variant="caption1" tone="secondary" align="center" text="{{label}}" hint-size="90px,16px"></dc-import></button></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","default":"heart","options":["heart","share-network","flag","exclamation-circle","bookmark","phone","navigation","map"]},"label":{"editor":"text","default":"В избранное"},"active":{"editor":"boolean","default":false},"href":{"editor":"text","default":""},"$preview":{"width":112,"height":62}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var on = !!p.active;
    return {
      css: ['box-sizing: border-box', 'width: 100%', 'min-height: 62px', 'margin: 0', 'padding: 0 4px', 'display: flex', 'flex-direction: column',
        'align-items: center', 'justify-content: center', 'gap: 5px', 'border-radius: 14px', 'background: ' + (on ? 'rgba(61,91,219,0.13)' : '#FFFFFF'),
        'border: 0', 'text-decoration: none', 'cursor: pointer', "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif"].join('; '),
      icon: p.icon || 'heart', label: p.label ?? 'В избранное', pressed: on ? 'true' : 'false',
      href: p.href || '', isLink: !!p.href, isButton: !p.href
    };
  }
}
</script>
</body>
</html>
