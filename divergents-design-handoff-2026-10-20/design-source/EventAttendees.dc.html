<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>EventAttendees</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div role="list" aria-label="{{aria}}" style="padding: 14px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; box-sizing: border-box; width: 100%; background: #FFFFFF">
  <sc-for list="{{people}}" as="m" hint-placeholder-count="8"><span role="listitem" aria-label="{{m.label}}" style="width: 36px; height: 36px; border-radius: 18px; background: rgba(61,91,219,0.13); overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><sc-if value="{{m.hasSrc}}" hint-placeholder-val="{{false}}"><img src="{{m.src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></sc-if><sc-if value="{{m.noSrc}}" hint-placeholder-val="{{true}}"><dc-import name="Icon" icon="person" variant="solid" size="sm" tone="brand" hint-size="16px,16px"></dc-import></sc-if></span></sc-for>
  <sc-if value="{{hasMore}}" hint-placeholder-val="{{false}}"><span style="height: 36px; padding: 0 10px; border-radius: 18px; background: rgba(118,118,128,0.12); display: flex; align-items: center; font-size: 13px; line-height: 18px; font-weight: 700; color: #5C5C60">+{{more}}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"count":{"editor":"int","default":8,"min":0,"max":999},"max":{"editor":"int","default":24,"min":1,"max":48},"people":{"editor":null},"$preview":{"width":358,"height":108}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var count = p.count !== undefined && p.count !== null ? Number(p.count) : 8;
    var max = Number(p.max || 24);
    var list = p.people || [];
    var shown = Math.min(count, max);
    var people = [];
    for (var i = 0; i < shown; i++) {
      var m = list[i] || {};
      people.push({ src: m.src || '', hasSrc: !!m.src, noSrc: !m.src, label: m.person || 'Участник' });
    }
    return { people: people, more: String(count - shown), hasMore: count > shown, aria: 'Участники: ' + count };
  }
}
</script>
</body>
</html>
