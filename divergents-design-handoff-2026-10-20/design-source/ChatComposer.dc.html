<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ChatComposer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <sc-if value="{{hasValue}}" hint-placeholder-val="{{false}}"><input type="text" aria-label="Сообщение ассистенту" placeholder="{{placeholder}}" value="{{value}}" disabled="{{disabled}}" style="{{inputCss}}"></sc-if>
  <sc-if value="{{noValue}}" hint-placeholder-val="{{true}}"><input type="text" aria-label="Сообщение ассистенту" placeholder="{{placeholder}}" disabled="{{disabled}}" style="{{inputCss}}"></sc-if>
  <button type="button" aria-label="Голосовой ввод" disabled="{{disabled}}" style="width: 40px; height: 40px; flex-shrink: 0; border: 0; padding: 0; border-radius: 20px; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="mic" size="md" tone="secondary" hint-size="20px,20px"></dc-import></button>
  <button type="button" aria-label="Отправить сообщение" disabled="{{sendDisabled}}" style="{{sendCss}}"><dc-import name="Icon" icon="arrow-up" size="md" tone="{{sendTone}}" hint-size="20px,20px"></dc-import></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"placeholder":{"editor":"text","default":"Спросите ассистента…"},"value":{"editor":"text","default":""},"disabled":{"editor":"boolean","default":false},"$preview":{"width":358,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var disabled = p.disabled === true || p.disabled === 'true';
    var value = p.value || '';
    var active = !!value.trim() && !disabled;
    var FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif";
    return {
      rootCss: ['display: flex', 'align-items: center', 'gap: 2px', 'min-height: 48px', 'box-sizing: border-box', 'width: 100%', 'min-width: 0',
        'padding: 4px 4px 4px 14px', 'background: #FFFFFF', 'border-radius: 24px', 'border: 0.5px solid rgba(60,60,67,0.18)', FF,
        'opacity: ' + (disabled ? 0.5 : 1)].join('; '),
      inputCss: ['flex: 1', 'min-width: 0', 'border: 0', 'outline: none', 'background: transparent', 'padding: 8px 0', FF,
        'font-size: 17px', 'line-height: 24px', 'letter-spacing: -0.2px', 'color: #000000'].join('; '),
      sendCss: ['width: 40px', 'height: 40px', 'flex-shrink: 0', 'border: 0', 'padding: 0', 'border-radius: 20px', 'cursor: pointer', 'display: flex', 'align-items: center', 'justify-content: center',
        'background: ' + (active ? '#234088' : 'rgba(118,118,128,0.12)')].join('; '),
      sendTone: active ? 'white' : 'secondary',
      sendDisabled: !active,
      placeholder: p.placeholder || 'Спросите ассистента…',
      value: value, hasValue: !!value, noValue: !value, disabled: disabled
    };
  }
}
</script>
</body>
</html>
