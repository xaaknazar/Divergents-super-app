<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Checkbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<button type="button" role="checkbox" aria-checked="{{ariaChecked}}" onClick="{{toggle}}" style="{{css}}">
<span aria-hidden="true" style="{{boxCss}}"><sc-if value="{{checked}}" hint-placeholder-val="{{true}}"><dc-import name="Icon" icon="check" variant="solid" size="sm" tone="white" hint-size="16px,16px"></dc-import></sc-if></span>
<span style="{{textCss}}"><span style="{{labelCss}}">{{label}}</span><sc-if value="{{hasDesc}}" hint-placeholder-val="{{false}}"><span style="{{descCss}}">{{description}}</span></sc-if></span>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Запомнить меня"},"checked":{"editor":"boolean","default":false},"description":{"editor":"text","default":""},"$preview":{"width":320,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var on = this.state && this.state.on !== undefined ? this.state.on : !!p.checked;
    var hasDesc = !!p.description;
    return {
      ariaChecked: on ? 'true' : 'false',
      checked: on,
      toggle: function () { self.setState({ on: !on }); },
      label: p.label ?? 'Запомнить меня',
      description: p.description || '',
      hasDesc: hasDesc,
      css: ['display: flex', 'align-items: ' + (hasDesc ? 'flex-start' : 'center'), 'gap: 10px', 'width: 100%', 'box-sizing: border-box', 'min-height: 48px',
        'padding: ' + (hasDesc ? '6px 0' : '0'), 'margin: 0', 'border: 0', 'background: transparent', 'color: #000000', 'text-align: left', 'cursor: pointer', F].join('; '),
      boxCss: 'width: 24px; height: 24px; border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: ' + (on ? '#234088' : 'transparent') + '; border: ' + (on ? '0' : '1.5px solid rgba(60,60,67,0.30)'),
      textCss: 'flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px',
      labelCss: 'font-size: 15px; line-height: 20px; font-weight: ' + (hasDesc ? 700 : 400) + '; letter-spacing: -0.1px',
      descCss: 'font-size: 12px; line-height: 16px; color: #5C5C60'
    };
  }
}
</script>
</body>
</html>
