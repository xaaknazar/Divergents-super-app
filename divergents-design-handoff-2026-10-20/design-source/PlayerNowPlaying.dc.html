<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PlayerNowPlaying</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 8px; width: 100%; min-width: 0; color: #000000; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="display: flex; align-items: center; gap: 12px">
    <button type="button" aria-label="{{toggleLabel}}" style="min-width: 48px; min-height: 48px; flex-shrink: 0; border: 0; padding: 0; margin: 0; border-radius: 14px; background: #234088; display: flex; align-items: center; justify-content: center; cursor: pointer"><dc-import name="Icon" icon="{{toggleIcon}}" variant="solid" size="md" tone="white" hint-size="20px,20px"></dc-import></button>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
      <dc-import name="Text" variant="subheadEm" lines="1" text="{{title}}" hint-size="100%,20px"></dc-import>
      <dc-import name="Text" variant="footnote" tone="secondary" lines="1" text="{{subtitle}}" hint-size="100%,18px"></dc-import>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 2px">
    <div style="display: flex; justify-content: space-between; gap: 12px">
      <span style="font-size: 13px; line-height: 18px; color: #5C5C60; font-variant-numeric: tabular-nums">{{elapsed}}</span>
      <span style="font-size: 13px; line-height: 18px; color: #5C5C60; font-variant-numeric: tabular-nums">{{total}}</span>
    </div>
    <div role="slider" tabindex="0" aria-label="Позиция воспроизведения" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{pct}}" style="min-height: 48px; display: flex; flex-direction: column; justify-content: center">
      <div style="height: 4px; border-radius: 4px; background: rgba(118,118,128,0.12); overflow: hidden"><div style="{{fillCss}}"></div></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Significance"},"subtitle":{"editor":"text","default":"Максимизация талантов Gallup"},"elapsed":{"editor":"text","default":"4:12"},"total":{"editor":"text","default":"16:05"},"progress":{"editor":"int","default":26,"min":0,"max":100},"playing":{"editor":"boolean","default":true},"$preview":{"width":358,"height":132}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var pct = Math.max(0, Math.min(100, Number(p.progress ?? 26)));
    var playing = p.playing !== false && p.playing !== 'false';
    return {
      title: p.title ?? 'Significance', subtitle: p.subtitle ?? 'Максимизация талантов Gallup',
      elapsed: p.elapsed ?? '4:12', total: p.total ?? '16:05',
      pct: String(pct), fillCss: 'width: ' + pct + '%; height: 100%; border-radius: 4px; background: #234088',
      toggleIcon: playing ? 'pause' : 'play', toggleLabel: playing ? 'Пауза' : 'Воспроизвести'
    };
  }
}
</script>
</body>
</html>
