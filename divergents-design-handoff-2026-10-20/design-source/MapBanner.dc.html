<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MapBanner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div role="status" style="box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 4px 8px rgba(0,0,0,0.12)">
  <span style="{{iconCss}}"><dc-import name="Icon" icon="{{icon}}" variant="solid" size="sm" tone="inherit" hint-size="16px,16px"></dc-import></span>
  <div style="flex: 1; min-width: 0"><dc-import name="Text" variant="caption1" tone="secondary" text="{{text}}" hint-size="100%,16px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tone":{"editor":"enum","default":"warning","options":["warning","info","danger"]},"text":{"editor":"text","default":"Базовая карта без ключа — детализация ограничена."},"$preview":{"width":366,"height":60}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var T = { warning: ['#FF9500', 'exclamation-triangle'], info: ['#234088', 'text-i-circle'], danger: ['#FF3B30', 'wifi-slash'] };
    var t = T[p.tone] || T.warning;
    return {
      iconCss: 'display: flex; flex-shrink: 0; color: ' + t[0],
      icon: t[1],
      text: p.text ?? 'Базовая карта без ключа — детализация ограничена.'
    };
  }
}
</script>
</body>
</html>
