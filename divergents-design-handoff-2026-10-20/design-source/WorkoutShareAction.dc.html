<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WorkoutShareAction</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<sc-if value="{{isLink}}" hint-placeholder-val="{{false}}"><a href="{{href}}" style="{{css}}"><span style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 50%; background: rgba(61,91,219,0.13); color: #234088"><dc-import name="Icon" icon="{{icon}}" size="md" tone="inherit" hint-size="20px,20px"></dc-import></span><dc-import name="Text" variant="caption2" tone="secondary" align="center" text="{{label}}" hint-size="64px,14px"></dc-import></a></sc-if>
<sc-if value="{{isButton}}" hint-placeholder-val="{{true}}"><button type="button" style="{{css}}"><span style="display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 50%; background: rgba(61,91,219,0.13); color: #234088"><dc-import name="Icon" icon="{{icon}}" size="md" tone="inherit" hint-size="20px,20px"></dc-import></span><dc-import name="Text" variant="caption2" tone="secondary" align="center" text="{{label}}" hint-size="64px,14px"></dc-import></button></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","default":"image","options":["image","images","sliders","palette","camera","arrow-to-bracket-down","share-network","pencil"]},"label":{"editor":"text","default":"Фон"},"href":{"editor":"text","default":""},"$preview":{"width":80,"height":76}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    return {
      css: "min-width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 5px; margin: 0; padding: 0; border: 0; background: transparent; text-decoration: none; cursor: pointer; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif",
      icon: p.icon || 'image', label: p.label ?? 'Фон',
      href: p.href || '', isLink: !!p.href, isButton: !p.href
    };
  }
}
</script>
</body>
</html>
