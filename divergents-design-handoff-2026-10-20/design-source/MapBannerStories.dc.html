<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MapBanner — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="340" safe-top="{{false}}" hint-size="390px,340px">
<dc-import name="Wrapper" pad="20" gap="24" hint-size="100%,306px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" text="MapBanner" hint-size="100%,34px"></dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" text="Плашка-статус поверх карты: tone · text" hint-size="100%,18px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" text="TONE=WARNING" hint-size="100%,14px"></dc-import>
<dc-import name="MapBanner" tone="warning" text="Базовая карта без ключа — детализация ограничена." hint-size="100%,44px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" text="TONE=INFO" hint-size="100%,14px"></dc-import>
<dc-import name="MapBanner" tone="info" text="Нажмите на карту, чтобы поставить точку." hint-size="100%,44px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" text="TONE=DANGER" hint-size="100%,14px"></dc-import>
<dc-import name="MapBanner" tone="danger" text="Нет сети — показана сохранённая офлайн-карта." hint-size="100%,44px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":340}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
