<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>FitnessSectionHeader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <div style="flex: 1; min-width: 0"><dc-import name="Text" variant="title3" heading="2" text="{{title}}" hint-size="100%,25px"></dc-import></div>
  <sc-if value="{{actionLink}}" hint-placeholder-val="{{false}}"><a href="{{href}}" style="{{actionCss}}"><dc-import name="Icon" icon="{{actionIcon}}" size="sm" tone="brand" hint-size="16px,16px"></dc-import><span>{{action}}</span></a></sc-if>
  <sc-if value="{{actionButton}}" hint-placeholder-val="{{true}}"><button type="button" style="{{actionCss}}"><dc-import name="Icon" icon="{{actionIcon}}" size="sm" tone="brand" hint-size="16px,16px"></dc-import><span>{{action}}</span></button></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Программы"},"action":{"editor":"text","default":"Новая"},"actionIcon":{"editor":"enum","default":"plus","options":["plus","list","chevron-right","pencil"]},"href":{"editor":"text","default":""},"$preview":{"width":390,"height":32}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var action = p.action ?? 'Новая';
    return {
      rootCss: ['display: flex', 'align-items: center', 'gap: 8px', 'padding: 0 20px', 'min-height: 32px', 'box-sizing: border-box', 'width: 100%', 'color: #000000', F].join('; '),
      actionCss: ['display: flex', 'align-items: center', 'gap: 4px', 'flex-shrink: 0', 'min-height: 32px', 'padding: 0 10px', 'margin: 0', 'border: 0', 'border-radius: 10px',
        'background: rgba(61,91,219,0.13)', 'color: #234088', 'text-decoration: none', 'cursor: pointer', 'font-size: 15px', 'line-height: 20px', 'font-weight: 700', F].join('; '),
      title: p.title ?? 'Программы', action: action, actionIcon: p.actionIcon || 'plus', href: p.href || '',
      actionLink: !!action && !!p.href, actionButton: !!action && !p.href
    };
  }
}
</script>
</body>
</html>
