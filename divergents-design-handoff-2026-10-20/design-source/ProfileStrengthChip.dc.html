<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ProfileStrengthChip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<span style="{{css}}"><span style="{{rankCss}}">{{rank}}</span><span style="font-size: 13px; line-height: 18px; font-weight: 700; color: #000000">{{label}}</span></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"rank":{"editor":"int","default":1,"min":1,"max":34},"label":{"editor":"text","default":"Achiever"},"domain":{"editor":"enum","default":"executing","options":["executing","influencing","relationship","strategic"]},"$preview":{"width":140,"height":32}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var D = { executing: ['#7C3AED', 'rgba(124,58,237,0.094)'], influencing: ['#EA580C', 'rgba(234,88,12,0.094)'], relationship: ['#2563EB', 'rgba(37,99,235,0.094)'], strategic: ['#16A34A', 'rgba(22,163,74,0.094)'] };
    var d = D[p.domain] || D.executing;
    return {
      css: ['display: inline-flex', 'align-items: center', 'gap: 6px', 'padding: 7px 12px', 'border-radius: 16px', 'box-sizing: border-box', 'background: ' + d[1], F].join('; '),
      rankCss: 'font-size: 11px; line-height: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: ' + d[0],
      rank: String(p.rank ?? 1), label: p.label ?? 'Achiever'
    };
  }
}
</script>
</body>
</html>
