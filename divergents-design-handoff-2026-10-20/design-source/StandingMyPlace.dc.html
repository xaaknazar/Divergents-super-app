<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>StandingMyPlace</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{css}}">
<dc-import name="Avatar" person="{{person}}" size="md" hint-size="40px,40px"></dc-import>
<div style="flex: 1; min-width: 0">
<dc-import name="Text" variant="headline" text="{{title}}" lines="1" hint-size="100%,22px"></dc-import>
<dc-import name="Text" variant="caption1" tone="secondary" text="{{subtitle}}" hint-size="100%,16px"></dc-import>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0">
<dc-import name="Text" variant="title3" tone="brand" align="end" text="{{place}}" hint-size="80px,25px"></dc-import>
<dc-import name="Text" variant="caption1" tone="secondary" align="end" numeric="{{true}}" text="{{points}}" hint-size="60px,16px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"person":{"editor":"text","default":"Акназар"},"title":{"editor":"text","default":"Вы · Акназар"},"subtitle":{"editor":"text","default":"KEX group"},"place":{"editor":"text","default":"7 место"},"points":{"editor":"text","default":"336 pts"},"$preview":{"width":358,"height":70}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    return {
      person: p.person ?? 'Акназар', title: p.title ?? 'Вы · Акназар', subtitle: p.subtitle ?? 'KEX group',
      place: p.place ?? '7 место', points: p.points ?? '336 pts',
      css: "display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: rgba(61,91,219,0.13); box-sizing: border-box; width: 100%; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif"
    };
  }
}
</script>
</body>
</html>
