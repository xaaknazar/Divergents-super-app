<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AchievementTile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <sc-if value="{{isGrid}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <dc-import name="AchievementBadge" tier="{{tier}}" category="{{category}}" icon="{{icon}}" earned="{{earned}}" size="md" hint-size="66px,66px"></dc-import>
      <sc-if value="{{earned}}" hint-placeholder-val="{{true}}"><span role="img" aria-label="В коллекции" style="display: flex"><dc-import name="Icon" icon="check-circle" variant="solid" size="md" tone="success" hint-size="20px,20px"></dc-import></span></sc-if>
      <sc-if value="{{locked}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="display: flex"><dc-import name="Icon" icon="chevron-down" size="md" tone="secondary" hint-size="20px,20px"></dc-import></span></sc-if>
    </div>
    <dc-import name="Text" variant="subheadEm" text="{{title}}" hint-size="100%,20px"></dc-import>
    <dc-import name="Text" variant="subhead" tone="secondary" lines="3" text="{{description}}" hint-size="100%,40px"></dc-import>
    <span aria-hidden="true" style="flex: 1"></span>
    <dc-import name="Text" variant="caption1" tone="secondary" text="{{meta}}" hint-size="100%,16px"></dc-import>
    <sc-if value="{{earned}}" hint-placeholder-val="{{true}}"><dc-import name="Text" variant="subhead" tone="success" text="В коллекции" hint-size="100%,20px"></dc-import></sc-if>
    <sc-if value="{{locked}}" hint-placeholder-val="{{false}}">
      <dc-import name="ProgressBar" value="{{pct}}" size="thin" label="" hint-size="100%,4px"></dc-import>
      <dc-import name="Text" variant="subhead" tone="secondary" numeric="{{true}}" text="{{count}}" hint-size="100%,20px"></dc-import>
    </sc-if>
  </sc-if>
  <sc-if value="{{isShelf}}" hint-placeholder-val="{{false}}">
    <dc-import name="AchievementBadge" tier="{{tier}}" category="{{category}}" icon="{{icon}}" earned="{{earned}}" size="md" hint-size="66px,66px"></dc-import>
    <dc-import name="Text" variant="caption1" align="center" lines="2" text="{{title}}" hint-size="100%,16px"></dc-import>
  </sc-if>
  <sc-if value="{{hasHref}}" hint-placeholder-val="{{false}}"><a href="{{href}}" aria-label="{{aria}}" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; border-radius: 14px"></a></sc-if>
  <sc-if value="{{isButton}}" hint-placeholder-val="{{true}}"><button type="button" aria-label="{{aria}}" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; border: 0; padding: 0; margin: 0; background: transparent; border-radius: 16px; cursor: pointer"></button></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"grid","options":["grid","shelf"]},"title":{"editor":"text","default":"Первый шаг"},"description":{"editor":"text","default":"Отметь первый урок пройденным. Прогресс должен сохраниться на сервере."},"tier":{"editor":"enum","default":"bronze","options":["bronze","silver","gold"]},"category":{"editor":"enum","default":"learning","options":["learning","materials","books","challenge","events","map","fitness"]},"icon":{"editor":"enum","default":"play-circle","options":["play-circle","graduation-cap","bookmark","file-doc","book-open","quote-left","flame","seal-check","trophy","medal-sport","people","calendar","plane","ball-soccer","pin","star","weight","check-circle","bolt-vertical","flag","body-standing","bullseye","map"]},"earned":{"editor":"boolean","default":true},"value":{"editor":"int","default":1,"min":0,"max":1000},"goal":{"editor":"int","default":1,"min":1,"max":1000},"href":{"editor":"text","default":""},"$preview":{"width":173,"height":290}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var TIER = { bronze: 'Бронза', silver: 'Серебро', gold: 'Золото' };
    var CAT = { learning: 'Уроки', materials: 'Материалы', books: 'Книги', challenge: 'Челленджи', events: 'События', map: 'Карта', fitness: 'Тренировки' };
    var shelf = p.variant === 'shelf';
    var earned = !(p.earned === false || p.earned === 'false');
    var title = p.title ?? 'Первый шаг';
    var goal = Math.max(1, Number(p.goal ?? 1));
    var value = Math.min(goal, Math.max(0, Number(p.value ?? (earned ? goal : 0))));
    var tier = TIER[p.tier] ? p.tier : 'bronze';
    var category = CAT[p.category] ? p.category : 'learning';
    var css = ['position: relative', 'display: flex', 'flex-direction: column', 'box-sizing: border-box', 'min-width: 0', 'color: #000000', F];
    if (shelf) css.push('width: 104px', 'align-items: center', 'gap: 8px', 'padding: 8px 0');
    else css.push('width: 100%', 'height: 100%', 'gap: 12px', 'padding: 16px', 'background: #FFFFFF', 'border-radius: 14px');
    var count = value + ' из ' + goal;
    return {
      rootCss: css.join('; '),
      isGrid: !shelf, isShelf: shelf,
      title: title, description: p.description ?? 'Отметь первый урок пройденным. Прогресс должен сохраниться на сервере.',
      tier: tier, category: category, icon: p.icon || 'play-circle',
      earned: earned, locked: !earned,
      meta: TIER[tier] + ' · ' + CAT[category],
      pct: Math.round(value / goal * 100), count: count,
      href: p.href || '', hasHref: !!p.href, isButton: !p.href && !shelf,
      aria: title + '. ' + (earned ? 'В коллекции' : count)
    };
  }
}
</script>
</body>
</html>
