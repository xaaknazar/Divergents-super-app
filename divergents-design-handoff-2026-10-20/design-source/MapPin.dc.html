<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MapPin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<sc-if value="{{isLink}}" hint-placeholder-val="{{false}}"><a href="{{href}}" aria-label="{{aria}}" style="{{css}}"><dc-import name="Icon" icon="{{icon}}" size="{{iconSize}}" tone="white" hint-size="16px,16px"></dc-import></a></sc-if>
<sc-if value="{{isButton}}" hint-placeholder-val="{{true}}"><button type="button" aria-label="{{aria}}" style="{{css}}"><dc-import name="Icon" icon="{{icon}}" size="{{iconSize}}" tone="white" hint-size="16px,16px"></dc-import></button></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","default":"cafe","options":["cafe","restaurant","hotel","guesthouse","base","park","gym","picnic","tourism"]},"size":{"editor":"enum","default":"regular","options":["regular","compact"]},"muted":{"editor":"boolean","default":false},"label":{"editor":"text","default":""},"href":{"editor":"text","default":""},"$preview":{"width":48,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var CATS = {
      cafe: ['#C2410C', 'coffee-cup', 'Кафе'], restaurant: ['#B45309', 'utensils', 'Ресторан'], hotel: ['#4338CA', 'building', 'Отель'],
      guesthouse: ['#0E7490', 'home', 'Гостевой дом'], base: ['#047857', 'tent', 'База отдыха'], park: ['#16A34A', 'mountains', 'Парк'],
      gym: ['#BE123C', 'weight', 'Спортзал'], picnic: ['#EA580C', 'sun', 'Пикник'], tourism: ['#0369A1', 'camera', 'Туризм']
    };
    var c = CATS[p.kind] || CATS.cafe;
    var compact = p.size === 'compact';
    var box = compact ? 26 : 32;
    var muted = !!p.muted;
    var css = [
      'display: flex', 'align-items: center', 'justify-content: center', 'box-sizing: border-box', 'margin: 0', 'padding: 0',
      'width: ' + box + 'px', 'height: ' + box + 'px', 'border-radius: 50%', 'border: 2px solid #FFFFFF',
      'background: ' + (muted ? '#9CA3AF' : c[0]), 'box-shadow: ' + (compact ? 'none' : '0 2px 4px rgba(0,0,0,0.25)'),
      'color: #FFFFFF', 'cursor: pointer', 'text-decoration: none'
    ].join('; ');
    var label = p.label || c[2];
    return {
      css: css, icon: c[1], iconSize: compact ? 'xs' : 'sm',
      aria: muted ? label + ', закрыто' : label,
      href: p.href || '', isLink: !!p.href, isButton: !p.href
    };
  }
}
</script>
</body>
</html>
