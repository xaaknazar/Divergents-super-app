<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <sc-if value="{{hasBackdrop}}" hint-placeholder-val="{{false}}">
    <dc-import name="HeaderBackdrop" motif="{{motif}}" hint-size="390px,0px"></dc-import>
  </sc-if>
  <div style="{{contentCss}}">{{children}}</div>
  <sc-if value="{{hasDock}}" hint-placeholder-val="{{false}}">
    <dc-import name="TabDock" active="{{tab}}" hint-size="390px,0px"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"height":{"editor":"int","default":844,"min":844,"max":8000},"surface":{"editor":"enum","default":"grouped","options":["grouped","plain","dark","media"]},"backdrop":{"editor":"boolean","default":true},"tab":{"editor":"enum","default":"none","options":["none","learn","ai","community","map","career","profile"]},"safeTop":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var bg = { grouped: '#F2F2F7', plain: '#FFFFFF', dark: '#0B0E16', media: '#000000' }[p.surface] || '#F2F2F7';
    var fg = (p.surface === 'dark' || p.surface === 'media') ? '#FFFFFF' : '#000000';
    var h = Number(p.height || 844);
    var tab = p.tab || 'none';
    var motif = { learn: 'learn', ai: 'ai', community: 'community', profile: 'profile' }[tab] || '';
    var rootCss = [
      'width: 390px', 'height: ' + h + 'px', 'position: relative', 'overflow: hidden', 'background: ' + bg, 'color: ' + fg,
      "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif", '-webkit-font-smoothing: antialiased'
    ].join('; ');
    var contentCss = ['position: relative', 'display: flex', 'flex-direction: column', 'min-height: 100%', 'box-sizing: border-box',
      'padding-top: ' + (p.safeTop === false ? 0 : 54) + 'px', 'padding-bottom: ' + (tab !== 'none' ? 120 : 34) + 'px'].join('; ');
    return {
      rootCss: rootCss, contentCss: contentCss,
      // tab roots get a decorative header backdrop with the section's motif (career is closed — none)
      hasBackdrop: p.backdrop !== false && p.backdrop !== 'false' && motif !== '' && (p.surface || 'grouped') !== 'dark' && p.surface !== 'media',
      motif: motif,
      hasDock: tab !== 'none',
      tab: tab === 'profile' ? 'none' : tab,
      children: p.children
    };
  }
}
</script>
</body>
</html>
