<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DayRow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<button type="button" aria-label="{{aria}}" style="{{css}}">
<sc-if value="{{separator}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: 0; left: 68px; right: 0; height: 0.5px; background: rgba(60,60,67,0.18)"></span></sc-if>
<span style="width: 40px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center"><span style="{{dayCss}}">{{day}}</span><span style="font-size: 11px; line-height: 14px; font-weight: 500; color: #6B6B70">день</span></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 17px; line-height: 24px; letter-spacing: -0.2px; color: #000000">{{date}}</span><span style="font-size: 12px; line-height: 16px; color: #5C5C60; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{detail}}</span></span>
<sc-if value="{{hasFlags}}" hint-placeholder-val="{{false}}"><dc-import name="StatusBadge" label="{{flags}}" icon="flag" tone="danger" hint-size="40px,22px"></dc-import></sc-if>
<span style="min-width: 54px; display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 15px; line-height: 20px; font-weight: 700; color: #000000; font-variant-numeric: tabular-nums">{{points}}</span><sc-if value="{{hasPenalty}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; line-height: 14px; font-weight: 500; color: #C5221F">{{penalty}}</span></sc-if></span>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"day":{"editor":"text","default":"9"},"date":{"editor":"text","default":"12 октября · идёт"},"detail":{"editor":"text","default":"22 стр. · без сахара · 7 400 шагов"},"points":{"editor":"text","default":"+40"},"penalty":{"editor":"text","default":""},"flags":{"editor":"int","default":0,"min":0,"max":9},"today":{"editor":"boolean","default":true},"separator":{"editor":"boolean","default":false},"$preview":{"width":358,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var on = function (v) { return v === true || v === 'true'; };
    var demo = p.day === undefined && p.date === undefined;
    var today = p.today === undefined ? demo : on(p.today);
    var flags = Number(p.flags || 0);
    var penalty = p.penalty || '';
    var day = p.day ?? '9';
    return {
      day: String(day), date: p.date ?? '12 октября · идёт', detail: p.detail ?? '22 стр. · без сахара · 7 400 шагов',
      points: p.points ?? '+40', penalty: penalty, hasPenalty: !!penalty, flags: String(flags), hasFlags: flags > 0,
      separator: on(p.separator), aria: 'День ' + day,
      css: ['position: relative', 'width: 100%', 'box-sizing: border-box', 'display: flex', 'align-items: center', 'gap: 12px', 'padding: 12px 16px', 'margin: 0', 'border: 0', 'background: transparent', 'cursor: pointer', 'text-align: left', FF].join('; '),
      dayCss: 'font-size: 17px; line-height: 22px; font-weight: 700; color: ' + (today ? '#234088' : '#000000')
    };
  }
}
</script>
</body>
</html>
