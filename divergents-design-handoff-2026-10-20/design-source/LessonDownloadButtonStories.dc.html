<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LessonDownloadButton — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<dc-import name="Screen" height="480" safe-top="{{false}}" hint-size="390px,480px">
  <dc-import name="Wrapper" pad-x="16" pad-top="24" pad-bottom="24" gap="24" hint-size="100%,446px">
    <dc-import name="Text" variant="title2" heading="1" text="LessonDownloadButton" hint-size="100%,28px"></dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,60px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="variant=pill · state=idle" hint-size="100%,18px"></dc-import>
      <dc-import name="Wrapper3" align="start" hint-size="100%,44px"><dc-import name="LessonDownloadButton" variant="pill" state="idle" hint-size="230px,44px"></dc-import></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,60px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="variant=pill · state=downloading" hint-size="100%,18px"></dc-import>
      <dc-import name="Wrapper3" align="start" hint-size="100%,44px"><dc-import name="LessonDownloadButton" variant="pill" state="downloading" progress="45" hint-size="200px,44px"></dc-import></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,60px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="variant=pill · state=downloaded" hint-size="100%,18px"></dc-import>
      <dc-import name="Wrapper3" align="start" hint-size="100%,44px"><dc-import name="LessonDownloadButton" variant="pill" state="downloaded" hint-size="180px,44px"></dc-import></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,60px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="variant=icon · idle / downloading / downloaded (44px, aria-label)" hint-size="100%,18px"></dc-import>
      <dc-import name="Wrapper3" dir="row" gap="12" hint-size="100%,44px"><dc-import name="LessonDownloadButton" variant="icon" state="idle" hint-size="44px,44px"></dc-import><dc-import name="LessonDownloadButton" variant="icon" state="downloading" progress="45" hint-size="44px,44px"></dc-import><dc-import name="LessonDownloadButton" variant="icon" state="downloaded" hint-size="44px,44px"></dc-import></dc-import>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":480}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
