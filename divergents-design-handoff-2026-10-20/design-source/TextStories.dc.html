      </dc-import>

              <dc-import name="Text" variant="headline" tone="{{t.id}}" text="{{t.sample}}" hint-size="100%,22px"></dc-import>

      </dc-import>

    </dc-import>

    <dc-import name="Wrapper2" gap="10" hint-size="100%,150px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="align — start · center · end" hint-size="100%,18px"></dc-import>
      <dc-import name="Card" hint-size="100%,120px">
        <dc-import name="Wrapper3" gap="8" hint-size="100%,84px">
          <dc-import name="Text" variant="body" align="start" text="Привет, Акназар" hint-size="100%,24px"></dc-import>
          <dc-import name="Text" variant="body" align="center" text="Привет, Акназар" hint-size="100%,24px"></dc-import>
          <dc-import name="Text" variant="body" align="end" text="Привет, Акназар" hint-size="100%,24px"></dc-import>
        </dc-import>
      </dc-import>
    </dc-import>

    <dc-import name="Wrapper2" gap="10" hint-size="100%,230px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="lines — обрезка 1 · 2 · без ограничения (0)" hint-size="100%,18px"></dc-import>
      <dc-import name="Card" hint-size="100%,200px">
        <dc-import name="Wrapper3" gap="12" hint-size="100%,164px">
          <dc-import name="Text" variant="subhead" lines="1" text="{{longText}}" hint-size="100%,20px"></dc-import>
          <dc-import name="Text" variant="subhead" lines="2" text="{{longText}}" hint-size="100%,40px"></dc-import>
          <dc-import name="Text" variant="subhead" tone="secondary" text="{{longText}}" hint-size="100%,80px"></dc-import>
        </dc-import>
      </dc-import>
    </dc-import>

    <dc-import name="Wrapper2" gap="10" hint-size="100%,110px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="numeric — табличные цифры (в столбик)" hint-size="100%,18px"></dc-import>
      <dc-import name="Card" hint-size="100%,80px">
        <dc-import name="Wrapper3" gap="2" align="end" hint-size="100%,44px">
          <dc-import name="Text" variant="headline" numeric="{{true}}" text="111 000 ₸" hint-size="120px,22px"></dc-import>
          <dc-import name="Text" variant="headline" numeric="{{true}}" text="40 000 ₸" hint-size="120px,22px"></dc-import>
        </dc-import>
      </dc-import>
    </dc-import>
  </dc-import>
</dc-import>
