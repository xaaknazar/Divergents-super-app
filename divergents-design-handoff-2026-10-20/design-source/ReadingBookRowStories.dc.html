<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ReadingBookRow — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<dc-import name="Screen" height="540" safe-top="{{false}}" hint-size="390px,540px">
  <dc-import name="Wrapper" pad="16" gap="20" hint-size="100%,480px">
    <dc-import name="Wrapper2" pad-x="4" gap="4" hint-size="100%,56px">
      <dc-import name="Text" variant="title1" heading="1" text="ReadingBookRow" hint-size="100%,34px"></dc-import>
      <dc-import name="Text" variant="footnote" tone="secondary" text="Текущая книга: без выдуманной обложки, автор и страница — если известны" hint-size="100%,36px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,120px">
      <dc-import name="Text" variant="caption2Em" tone="secondary" text="CARD" hint-size="100%,14px"></dc-import>
      <dc-import name="ReadingBookRow" hint-size="100%,72px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,120px">
      <dc-import name="Text" variant="caption2Em" tone="secondary" text="БЕЗ АВТОРА" hint-size="100%,14px"></dc-import>
      <dc-import name="ReadingBookRow" title="Мастер и Маргарита" author="" page="Начнём со страницы 1" hint-size="100%,72px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,120px">
      <dc-import name="Text" variant="caption2Em" tone="secondary" text="ТЁМНАЯ" hint-size="100%,14px"></dc-import>
      <dc-import name="StoryBackdrop" tone="dark" hint-size="100%,200px"><dc-import name="ReadingBookRow" scheme="dark" hint-size="100%,72px"></dc-import></dc-import>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":540}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
