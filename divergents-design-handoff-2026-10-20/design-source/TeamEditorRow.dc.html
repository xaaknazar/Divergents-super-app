<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TeamEditorRow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{css}}">
<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 10px; background: rgba(61,91,219,0.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0"><dc-import name="Icon" icon="people" size="md" tone="brand" hint-size="20px,20px"></dc-import></span>
<span role="textbox" aria-label="Название команды" style="flex: 1; min-width: 0; font-size: 17px; line-height: 22px; font-weight: 700; letter-spacing: -0.2px; color: #000000; padding: 6px 0">{{title}}</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="min-width: 0">
<dc-import name="Text" variant="subhead" text="Размер команды" hint-size="140px,20px"></dc-import>
<dc-import name="Text" variant="caption1" tone="secondary" text="{{counts}}" hint-size="160px,16px"></dc-import>
</div>
<dc-import name="TeamStepper" value="{{capacity}}" label="Размер команды" hint-size="170px,56px"></dc-import>
</div>
<dc-import name="SelectField" label="Капитан" value="{{captain}}" icon="star" hint-size="100%,80px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Vertex"},"counts":{"editor":"text","default":"19 принято · 3 свободно"},"capacity":{"editor":"int","default":22,"min":0,"max":999},"captain":{"editor":"text","default":"AbzalAbdr"},"separator":{"editor":"boolean","default":false},"$preview":{"width":358,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var on = function (v) { return v === true || v === 'true'; };
    return {
      title: p.title ?? 'Vertex', counts: p.counts ?? '19 принято · 3 свободно', capacity: Number(p.capacity ?? 22), captain: p.captain ?? 'AbzalAbdr',
      css: "padding: 14px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; width: 100%; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; border-top: " + (on(p.separator) ? '0.5px solid rgba(60,60,67,0.18)' : '0')
    };
  }
}
</script>
</body>
</html>
