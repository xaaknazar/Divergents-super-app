<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PlaceIconTile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<span aria-hidden="true" style="{{css}}"><dc-import name="Icon" icon="{{icon}}" size="{{iconSize}}" tone="inherit" hint-size="28px,28px"></dc-import></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"category":{"editor":"enum","default":"cafe","options":["cafe","restaurant","hotel","guesthouse","base","park","gym","picnic","tourism"]},"size":{"editor":"enum","default":"large","options":["large","medium"]},"$preview":{"width":72,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var CATS = {
      cafe: ['#C2410C', 'coffee-cup', 'Кафе'], restaurant: ['#B45309', 'utensils', 'Ресторан'], hotel: ['#4338CA', 'building', 'Отель'],
      guesthouse: ['#0E7490', 'home', 'Гостевой дом'], base: ['#047857', 'tent', 'База отдыха'], park: ['#16A34A', 'mountains', 'Парк'],
      gym: ['#BE123C', 'weight', 'Спортзал'], picnic: ['#EA580C', 'sun', 'Пикник'], tourism: ['#0369A1', 'camera', 'Туризм']
    };
    var c = CATS[p.category] || CATS.cafe;
    var md = p.size === 'medium';
    var hex = c[0].replace('#', '');
    var rgb = [0, 2, 4].map(function (i) { return parseInt(hex.slice(i, i + 2), 16); }).join(',');
    var box = md ? 40 : 60;
    return {
      icon: c[1], iconSize: md ? 'md' : 'xl',
      css: ['display: flex', 'align-items: center', 'justify-content: center', 'flex-shrink: 0', 'width: ' + box + 'px', 'height: ' + box + 'px',
        'border-radius: ' + (md ? 10 : 16) + 'px', 'background: rgba(' + rgb + ',0.13)', 'color: ' + c[0]].join('; ')
    };
  }
}
</script>
</body>
</html>
