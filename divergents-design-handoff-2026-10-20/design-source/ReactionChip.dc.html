<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ReactionChip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<button type="button" aria-label="{{aria}}" aria-pressed="{{pressed}}" style="{{css}}"><span aria-hidden="true" style="{{iconCss}}"><dc-import name="Icon" icon="{{icon}}" variant="solid" size="sm" tone="inherit" hint-size="16px,16px"></dc-import></span><sc-if value="{{hasCount}}" hint-placeholder-val="{{true}}"><span style="{{countCss}}">{{count}}</span></sc-if></button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","default":"thumbs-up","options":["thumbs-up","heart","flame","hand-heart","sparkles"]},"count":{"editor":"int","default":12,"min":0,"max":9999},"active":{"editor":"boolean","default":false},"$preview":{"width":64,"height":26}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var COLORS = { 'thumbs-up': '#F5A623', heart: '#FF2D55', flame: '#FF9500', 'hand-heart': '#F5A623', sparkles: '#F5A623' };
    var NAMES = { 'thumbs-up': 'Нравится', heart: 'Сердце', flame: 'Огонь', 'hand-heart': 'Поддержка', sparkles: 'Восторг' };
    var icon = COLORS[p.icon] ? p.icon : 'thumbs-up';
    var on = p.active === true || p.active === 'true';
    var count = p.count === undefined || p.count === null ? 12 : Number(p.count);
    return {
      icon: icon,
      css: ['display: inline-flex', 'align-items: center', 'gap: 3px', 'padding: 5px 10px', 'margin: 0', 'border: 0', 'border-radius: 14px', 'cursor: pointer',
        'background: ' + (on ? 'rgba(61,91,219,0.13)' : 'rgba(120,120,128,0.16)'), FF].join('; '),
      iconCss: 'display: flex; color: ' + COLORS[icon],
      countCss: 'font-size: 11px; line-height: 14px; font-weight: 700; color: ' + (on ? '#234088' : '#5C5C60'),
      count: count, hasCount: count > 0,
      pressed: on ? 'true' : 'false',
      aria: NAMES[icon] + (count > 0 ? ', ' + count : '')
    };
  }
}
</script>
</body>
</html>
