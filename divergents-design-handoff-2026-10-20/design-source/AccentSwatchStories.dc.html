<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AccentSwatch — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<dc-import name="Screen" height="440" safe-top="{{false}}" hint-size="390px,440px">
<dc-import name="Wrapper" pad-x="16" pad-top="24" pad-bottom="24" gap="24" hint-size="100%,400px">
  <dc-import name="Text" variant="title2" heading="1" text="AccentSwatch" hint-size="100%,28px"></dc-import>
  <dc-import name="Wrapper2" gap="8" hint-size="100%,100px">
    <dc-import name="Text" variant="footnoteEm" tone="secondary" text="selected / все акценты" hint-size="100%,18px"></dc-import>
    <dc-import name="Wrapper3" cols="4" gap="0" hint-size="100%,100px"><dc-import name="AccentSwatch" accent="divergents" selected="{{true}}" hint-size="100%,90px"></dc-import><dc-import name="AccentSwatch" accent="royal" hint-size="100%,90px"></dc-import><dc-import name="AccentSwatch" accent="violet" hint-size="100%,90px"></dc-import><dc-import name="AccentSwatch" accent="fuchsia" hint-size="100%,90px"></dc-import><dc-import name="AccentSwatch" accent="rose" hint-size="100%,90px"></dc-import><dc-import name="AccentSwatch" accent="sunset" hint-size="100%,90px"></dc-import><dc-import name="AccentSwatch" accent="gold" hint-size="100%,90px"></dc-import><dc-import name="AccentSwatch" accent="emerald" hint-size="100%,90px"></dc-import><dc-import name="AccentSwatch" accent="forest" hint-size="100%,90px"></dc-import><dc-import name="AccentSwatch" accent="ocean" hint-size="100%,90px"></dc-import><dc-import name="AccentSwatch" accent="sky" hint-size="100%,90px"></dc-import><dc-import name="AccentSwatch" accent="graphite" hint-size="100%,90px"></dc-import></dc-import>
  </dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":440}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
