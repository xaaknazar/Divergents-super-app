<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MapControl</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<sc-if value="{{isLink}}" hint-placeholder-val="{{false}}"><a href="{{href}}" aria-label="{{aria}}" style="{{css}}"><dc-import name="Icon" icon="{{icon}}" variant="{{iconVariant}}" size="md" tone="inherit" hint-size="20px,20px"></dc-import><sc-if value="{{hasBadge}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="{{badgeCss}}">{{badgeText}}</span></sc-if></a></sc-if>
<sc-if value="{{isButton}}" hint-placeholder-val="{{true}}"><button type="button" aria-label="{{aria}}" style="{{css}}"><dc-import name="Icon" icon="{{icon}}" variant="{{iconVariant}}" size="md" tone="inherit" hint-size="20px,20px"></dc-import><sc-if value="{{hasBadge}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="{{badgeCss}}">{{badgeText}}</span></sc-if></button></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","default":"navigation","options":["navigation","target-location","plus","seal-check","cloud-arrow-down","layers","compass","minus"]},"label":{"editor":"text","default":"Моё местоположение"},"tone":{"editor":"enum","default":"surface","options":["surface","brand"]},"shape":{"editor":"enum","default":"square","options":["square","round"]},"badge":{"editor":"int","default":0,"min":0,"max":99},"href":{"editor":"text","default":""},"$preview":{"width":64,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var brand = p.tone === 'brand';
    var round = p.shape === 'round';
    var badge = Number(p.badge || 0);
    var label = p.label || 'Моё местоположение';
    var css = [
      'position: relative', 'display: flex', 'align-items: center', 'justify-content: center', 'box-sizing: border-box', 'margin: 0', 'padding: 0', 'border: 0',
      'width: 48px', 'height: 48px', 'border-radius: ' + (round ? '50%' : '14px'), 'background: ' + (brand ? '#234088' : '#FFFFFF'),
      'color: ' + (brand ? '#FFFFFF' : '#234088'), 'box-shadow: ' + (round ? '0 3px 8px rgba(0,0,0,0.18)' : 'none'), 'cursor: pointer', 'text-decoration: none'
    ].join('; ');
    return {
      css: css, icon: p.icon || 'navigation', iconVariant: brand ? 'line' : 'solid',
      aria: badge > 0 ? label + '. ' + badge : label,
      hasBadge: badge > 0, badgeText: badge > 99 ? '99+' : String(badge),
      badgeCss: "position: absolute; top: -4px; right: -6px; min-width: 16px; height: 16px; padding: 0 3px; box-sizing: border-box; border-radius: 8px; background: #234088; color: #FFFFFF; box-shadow: 0 0 0 1.5px #FFFFFF; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; font-size: 11px; line-height: 16px; font-weight: 700; text-align: center",
      href: p.href || '', isLink: !!p.href, isButton: !p.href
    };
  }
}
</script>
</body>
</html>
