<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SearchField</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<label style="{{boxCss}}"><dc-import name="Icon" icon="magnifying-glass" size="md" tone="secondary" hint-size="20px,20px"></dc-import><input type="text" role="searchbox" enterkeyhint="search" autocomplete="off" value="{{val}}" onChange="{{onInput}}" placeholder="{{placeholder}}" aria-label="{{placeholder}}" style="{{inputCss}}"><sc-if value="{{hasValue}}" hint-placeholder-val="{{false}}"><button type="button" aria-label="Очистить поиск" onClick="{{clear}}" style="{{clearCss}}"><dc-import name="Icon" icon="x-circle" variant="solid" size="md" tone="secondary" hint-size="20px,20px"></dc-import></button></sc-if></label>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"placeholder":{"editor":"text","default":"Поиск курсов"},"value":{"editor":"text","default":""},"surface":{"editor":"enum","default":"grouped","options":["grouped","raised"]},"$preview":{"width":390,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var val = this.state && this.state.v !== undefined ? this.state.v : (p.value || '');
    var has = !!val;
    return {
      val: val,
      hasValue: has,
      placeholder: p.placeholder || 'Поиск курсов',
      onInput: function (e) { self.setState({ v: e.target.value }); },
      clear: function () { self.setState({ v: '' }); },
      boxCss: ['display: flex', 'align-items: center', 'gap: 8px', 'width: 100%', 'box-sizing: border-box', 'min-height: 48px',
        (p.surface === 'raised' ? 'background: #FFFFFF' : 'background: rgba(118,118,128,0.12)'), 'border-radius: 12px', 'padding-left: 12px', 'padding-right: ' + (has ? 0 : 12) + 'px', 'cursor: text', F].join('; '),
      inputCss: ['flex: 1', 'min-width: 0', 'min-height: 48px', 'box-sizing: border-box', 'padding: 10px 0', 'margin: 0', 'border: 0', 'outline: none',
        'background: transparent', 'font-size: 17px', 'line-height: 24px', 'letter-spacing: -0.2px', 'color: #000000', '-webkit-appearance: none', 'appearance: none', F].join('; '),
      clearCss: 'width: 48px; min-height: 48px; display: flex; align-items: center; justify-content: center; border: 0; padding: 0; margin: 0; background: transparent; cursor: pointer; flex-shrink: 0'
    };
  }
}
</script>
</body>
</html>
