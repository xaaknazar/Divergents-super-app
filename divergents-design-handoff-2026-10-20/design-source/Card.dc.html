<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"enum","default":"regular","options":["regular","compact","flush"]},"variant":{"editor":"enum","default":"outlined","options":["outlined","elevated","tinted"]},"href":{"editor":"text","default":""},"children":{"editor":null},"$preview":{"width":358,"height":110}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var variant = p.variant || 'outlined';
    var size = p.size || 'regular';
    var pad = size === 'flush' ? 0 : size === 'compact' ? 14 : 18;
    var css = [
      'display: block', 'box-sizing: border-box', 'width: 100%', 'min-width: 0', 'position: relative', 'overflow: hidden',
      'border-radius: 14px', 'padding: ' + pad + 'px', 'text-decoration: none', 'color: #000000',
      "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif", '-webkit-font-smoothing: antialiased'
    ];
    // elevated = functional floating surface only (over a photo / map)
    if (variant === 'elevated') css.push('background: #FFFFFF', 'border: 0', 'box-shadow: 0 8px 18px rgba(0,0,0,0.14)');
    else if (variant === 'tinted') css.push('background: rgba(61,91,219,0.13)', 'border: 0');
    // outlined (default) = flat iOS inset group: white on #F2F2F7, no outline, no shadow
    else css.push('background: #FFFFFF', 'border: 0');
    var hasChildren = p.children !== undefined && p.children !== null && p.children !== '';
    var isLink = !!p.href;
    return {
      css: css.join('; '), href: p.href || '', isLink: isLink, isBlock: !isLink,
      hasChildren: hasChildren, isDemo: !hasChildren, children: p.children
    };
  }
}
</script>
