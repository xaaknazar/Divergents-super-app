<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TaskRow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<sc-if value="{{isMetric}}" hint-placeholder-val="{{true}}">
<div style="{{rootCss}}">
<div style="display: flex; align-items: center; gap: 9px">
<dc-import name="TaskCheck" checked="{{done}}" size="md" hint-size="20px,20px"></dc-import>
<span style="{{titleCss}}">{{title}}</span>
<sc-if value="{{badgeDone}}" hint-placeholder-val="{{true}}"><dc-import name="StatusBadge" label="{{badge}}" tone="success" hint-size="60px,22px"></dc-import></sc-if>
<sc-if value="{{badgeMuted}}" hint-placeholder-val="{{false}}"><dc-import name="Text" variant="caption1" tone="tertiary" text="{{badge}}" hint-size="30px,16px"></dc-import></sc-if>
</div>
<div style="margin: 6px 0 0 29px">
<dc-import name="ProgressBar" value="{{progress}}" size="thin" tone="{{barTone}}" label="" hint-size="100%,4px"></dc-import>
<div style="min-height: 44px; display: flex; align-items: center; gap: 10px; margin-top: 4px">
<span style="{{valueLineCss}}"><b style="{{valueCss}}">{{value}}</b> / {{goal}}<sc-if value="{{hasExtra}}" hint-placeholder-val="{{false}}"><span style="color: #187A32; margin-left: 8px">{{extra}}</span></sc-if></span>
<sc-if value="{{hasAction}}" hint-placeholder-val="{{true}}"><dc-import name="Button" label="{{actionLabel}}" icon="pencil" variant="solid" size="compact" hint-size="130px,44px"></dc-import></sc-if>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{isCheck}}" hint-placeholder-val="{{false}}">
<button type="button" role="checkbox" aria-checked="{{ariaChecked}}" style="{{checkCss}}">
<dc-import name="TaskCheck" checked="{{done}}" size="md" hint-size="20px,20px"></dc-import>
<span style="{{titleCss}}">{{title}}</span>
<sc-if value="{{badgeDone}}" hint-placeholder-val="{{true}}"><dc-import name="StatusBadge" label="{{badge}}" tone="success" hint-size="60px,22px"></dc-import></sc-if>
<sc-if value="{{badgeMuted}}" hint-placeholder-val="{{false}}"><dc-import name="Text" variant="caption1" tone="tertiary" text="{{badge}}" hint-size="30px,16px"></dc-import></sc-if>
</button>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","default":"metric","options":["metric","check"]},"state":{"editor":"enum","default":"done","options":["done","progress"]},"title":{"editor":"text","default":"20 страниц книги"},"value":{"editor":"text","default":"22"},"goal":{"editor":"text","default":"20 стр."},"extra":{"editor":"text","default":"+2"},"progress":{"editor":"int","default":100,"min":0,"max":100},"badge":{"editor":"text","default":"+22 pts"},"actionLabel":{"editor":"text","default":"Изменить"},"separator":{"editor":"boolean","default":false},"$preview":{"width":330,"height":100}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var on = function (v) { return v === true || v === 'true'; };
    var variant = p.variant === 'check' ? 'check' : 'metric';
    var done = (p.state || 'done') === 'done';
    var badge = p.badge ?? (variant === 'check' ? 'Готово' : '+22 pts');
    var sep = 'border-top: ' + (on(p.separator) ? '0.5px solid rgba(60,60,67,0.18)' : '0');
    var strike = variant === 'check' && done;
    var actionLabel = p.actionLabel ?? 'Изменить';
    return {
      isMetric: variant === 'metric', isCheck: variant === 'check',
      done: done, ariaChecked: done ? 'true' : 'false',
      title: p.title ?? '20 страниц книги',
      value: p.value ?? '22', goal: p.goal ?? '20 стр.', extra: p.extra ?? '+2', hasExtra: !!(p.extra ?? '+2'),
      progress: Number(p.progress ?? (done ? 100 : 0)), barTone: done ? 'success' : 'brand',
      badge: badge, badgeDone: !!badge && done, badgeMuted: !!badge && !done,
      actionLabel: actionLabel, hasAction: !!actionLabel,
      rootCss: ['padding: 9px 0', sep, FF].join('; '),
      checkCss: ['width: 100%', 'min-height: 48px', 'display: flex', 'align-items: center', 'gap: 9px', 'padding: 7px 0', 'border: 0', sep, 'background: transparent', 'cursor: pointer', 'text-align: left', 'margin: 0', FF].join('; '),
      titleCss: 'flex: 1; min-width: 0; font-size: 15px; line-height: 20px; font-weight: 700; color: ' + (strike ? '#5C5C60; text-decoration: line-through' : '#000000') + '; ' + FF,
      valueLineCss: 'flex: 1; min-width: 0; font-size: 15px; line-height: 20px; color: #5C5C60; ' + FF,
      valueCss: 'font-weight: 700; color: ' + (done ? '#187A32' : '#234088')
    };
  }
}
</script>
</body>
</html>
