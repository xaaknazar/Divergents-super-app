<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PageHeading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; width: 100%; min-width: 0; color: #000000; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif">
  <dc-import name="Text" variant="title2" heading="1" align="{{align}}" text="{{title}}" hint-size="100%,28px"></dc-import>
  <sc-if value="{{hasDescription}}" hint-placeholder-val="{{true}}"><dc-import name="Text" variant="body" tone="secondary" align="{{align}}" text="{{description}}" hint-size="100%,48px"></dc-import></sc-if>
  <sc-if value="{{hasSummary}}" hint-placeholder-val="{{false}}"><dc-import name="Text" variant="subheadEm" tone="brand" align="{{align}}" text="{{summary}}" hint-size="100%,20px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Анкета участника"},"description":{"editor":"text","default":""},"summary":{"editor":"text","default":""},"align":{"editor":"enum","default":"start","options":["start","center"]},"$preview":{"width":358,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var demo = p.title === undefined && p.description === undefined && p.summary === undefined;
    var title = p.title !== undefined && p.title !== null ? p.title : (demo ? 'Анкета участника' : '');
    var description = p.description || (demo ? 'Заполните четыре раздела — это откроет заявки в сообществе и отклики на вакансии.' : '');
    var summary = p.summary || (demo ? 'Заполнено 1 из 4 разделов' : '');
    return {
      title: title, description: description, summary: summary,
      hasDescription: !!description, hasSummary: !!summary,
      align: p.align === 'center' ? 'center' : 'start'
    };
  }
}
</script>
</body>
</html>
