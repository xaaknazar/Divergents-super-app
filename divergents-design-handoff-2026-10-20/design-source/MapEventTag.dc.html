<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MapEventTag</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<span role="img" aria-label="{{aria}}" style="{{css}}"><dc-import name="Icon" icon="{{icon}}" variant="solid" size="xs" tone="white" hint-size="12px,12px"></dc-import><span style="{{timeCss}}">{{time}}</span></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","default":"meetup","options":["meetup","sport"]},"time":{"editor":"text","default":"18:30"},"$preview":{"width":80,"height":32}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var K = { meetup: ['#234088', 'flag', 'Встреча'], sport: ['#34C759', 'bolt-vertical', 'Спорт'] };
    var k = K[p.kind] || K.meetup;
    var time = p.time ?? '18:30';
    return {
      css: ['display: inline-flex', 'align-items: center', 'gap: 4px', 'box-sizing: border-box', 'padding: 4px 8px', 'border-radius: 10px',
        'border: 2px solid #FFFFFF', 'background: ' + k[0], 'white-space: nowrap', "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif"].join('; '),
      timeCss: 'font-size: 11px; line-height: 14px; font-weight: 700; color: #FFFFFF; font-variant-numeric: tabular-nums',
      icon: k[1], time: time, aria: k[2] + (time ? ', ' + time : '')
    };
  }
}
</script>
</body>
</html>
