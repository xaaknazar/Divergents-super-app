<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AuthSegmented — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<dc-import name="Screen" height="320" safe-top="{{false}}" hint-size="390px,320px">
  <dc-import name="Wrapper" pad-x="16" pad-top="24" gap="20" hint-size="100%,260px">
    <dc-import name="Text" variant="title2" heading="1" text="AuthSegmented" hint-size="100%,28px"></dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,80px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="value=0" hint-size="100%,18px"></dc-import>
      <dc-import name="AuthSegmented" items="{{intents}}" value="0" hint-size="100%,56px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,80px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="value=1" hint-size="100%,18px"></dc-import>
      <dc-import name="AuthSegmented" items="{{intents}}" value="1" hint-size="100%,56px"></dc-import>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":320}}'>
class Component extends DCLogic { renderVals() { return {"intents": ["Вход", "Регистрация"]}; } }
</script>
</body>
</html>
