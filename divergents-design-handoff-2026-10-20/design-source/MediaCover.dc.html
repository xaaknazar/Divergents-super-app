<html lang="ru">
<head>

<title>MediaCover</title>

</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <sc-if value="{{hasSrc}}" hint-placeholder-val="{{true}}"><img src="{{src}}" alt="" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block"></sc-if>
  <sc-if value="{{noSrc}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="{{placeholderIcon}}" size="xxl" tone="brand" hint-size="36px,36px"></dc-import></span></sc-if>
  <sc-if value="{{hasOverlay}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="{{overlayCss}}"></span></sc-if>
  <sc-if value="{{hasBadge}}" hint-placeholder-val="{{true}}"><span style="{{badgeCss}}">{{badge}}</span></sc-if>
  <sc-if value="{{hasChildren}}" hint-placeholder-val="{{false}}"><div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; color: #FFFFFF">{{children}}</div></sc-if>
</div>
</x-dc>

</body>
