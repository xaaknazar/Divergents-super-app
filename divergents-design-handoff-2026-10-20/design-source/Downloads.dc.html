<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Загрузки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<dc-import name="Screen" height="1060" safe-top="{{false}}" hint-size="390px,1060px">
  <dc-import name="NavHeader" variant="plain" title="Загрузки" large-title="{{true}}" subtitle="3 урока · 35,5 МБ на устройстве" back-label="Обучение" back-href="LMSHome.dc.html" hint-size="100%,195px"></dc-import>
  <dc-import name="Wrapper" pad-x="16" pad-top="4" pad-bottom="120" gap="24" hint-size="100%,860px">
    <dc-import name="ListSection" header="Максимизация талантов Gallup" hint-size="100%,176px">
      <dc-import name="DownloadRow" state="downloaded" title="14. Communication" subtitle="9.8 МБ · Доступно офлайн" hint-size="100%,72px"></dc-import>
      <dc-import name="DownloadRow" state="playing" title="15. Significance" subtitle="14.2 МБ · Доступно офлайн" separator="{{true}}" hint-size="100%,72px"></dc-import>
    </dc-import>
    <dc-import name="ListSection" header="Психотипы" hint-size="100%,104px">
      <dc-import name="DownloadRow" state="downloaded" title="1. Психотипы" subtitle="11.5 МБ · Доступно офлайн" hint-size="100%,72px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" pad-top="8" gap="4" hint-size="100%,300px">
      <dc-import name="SectionHeader" title="Можно скачать" action="" hint-size="100%,40px"></dc-import>
      <dc-import name="ListSection" header="Максимизация талантов Gallup" hint-size="100%,248px">
        <sc-for list="{{available}}" as="l" hint-placeholder-count="3">
          <dc-import name="DownloadRow" state="available" title="{{l.title}}" subtitle="Аудио для офлайна" separator="{{l.sep}}" hint-size="100%,72px"></dc-import>
        </sc-for>
      </dc-import>
    </dc-import>
  </dc-import>
  <dc-import name="BottomBar" variant="blur" placement="screen" hint-size="100%,190px">
    <dc-import name="PlayerNowPlaying" title="Significance" subtitle="Максимизация талантов Gallup" elapsed="4:12" total="16:05" progress="26" playing="{{true}}" hint-size="100%,132px"></dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      available: [
        { title: "16. Competition", sep: false },
        { title: "17. Woo", sep: true },
        { title: "18. Adaptability", sep: true }
      ]
    };
  }
}
</script>
</body>
</html>
