<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TalentHero — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="440" safe-top="{{false}}" hint-size="390px,440px">
  <dc-import name="Wrapper" pad-x="16" pad-top="24" gap="20" hint-size="100%,400px">
    <dc-import name="Text" variant="title2" heading="1" text="TalentHero" hint-size="100%,28px"></dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,180px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="инициалы · бейджи" hint-size="100%,18px"></dc-import>
      <dc-import name="TalentHero" person="Акназар [Фамилия]" badges="{{badges}}" hint-size="100%,160px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,150px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="без бейджей" hint-size="100%,18px"></dc-import>
      <dc-import name="TalentHero" person="Айгерим Н." badges="{{none}}" hint-size="100%,130px"></dc-import>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":440}}'>
class Component extends DCLogic {
  renderVals() {
    return {"badges": [{"label": "MBTI · ENTJ", "tone": "brand"}, {"label": "Анкета 85%", "tone": "neutral"}], "none": []};
  }
}
</script>
</body>
</html>
