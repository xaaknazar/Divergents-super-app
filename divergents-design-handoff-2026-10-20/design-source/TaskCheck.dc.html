<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TaskCheck</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<span aria-hidden="true" style="{{rootCss}}">
<sc-if value="{{checked}}" hint-placeholder-val="{{true}}"><dc-import name="Icon" icon="check-circle" variant="solid" size="{{iconSize}}" tone="brand" hint-size="20px,20px"></dc-import></sc-if>
<sc-if value="{{unchecked}}" hint-placeholder-val="{{false}}"><span style="{{ringCss}}"></span></sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"checked":{"editor":"boolean","default":true},"size":{"editor":"enum","default":"md","options":["md","lg"]},"$preview":{"width":24,"height":24}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var on = p.checked === undefined ? true : (p.checked === true || p.checked === 'true');
    var d = p.size === 'lg' ? 24 : 20;
    return {
      checked: on, unchecked: !on, iconSize: p.size === 'lg' ? 'lg' : 'md',
      rootCss: 'display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; width: ' + d + 'px; height: ' + d + 'px',
      ringCss: 'display: block; box-sizing: border-box; width: ' + (d - 2) + 'px; height: ' + (d - 2) + 'px; border-radius: 50%; border: 1.75px solid #76767A'
    };
  }
}
</script>
</body>
</html>
