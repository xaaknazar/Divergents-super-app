<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Segmented</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div role="radiogroup" aria-label="{{aria}}" style="{{trackCss}}"><sc-for list="{{segs}}" as="s" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{s.checked}}" onClick="{{s.pick}}" style="{{s.css}}"><sc-if value="{{s.hasIcon}}" hint-placeholder-val="{{false}}"><dc-import name="Icon" icon="{{s.icon}}" variant="solid" size="xs" tone="primary" hint-size="12px,12px"></dc-import></sc-if><span style="{{labelCss}}">{{s.label}}</span></button></sc-for></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"items":{"editor":null},"value":{"editor":"int","default":0,"min":0,"max":6},"icons":{"editor":null},"$preview":{"width":390,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var items = Array.isArray(p.items) && p.items.length ? p.items : ['Курсы', 'Книги', 'Мои'];
    var icons = Array.isArray(p.icons) ? p.icons : null;
    var picked = this.state && this.state.picked !== undefined ? this.state.picked : Number(p.value || 0);
    var stacked = items.length > 3;
    var trackCss = [
      'display: flex', 'flex-direction: ' + (stacked ? 'column' : 'row'), 'background: rgba(118,118,128,0.12)', 'border-radius: 10px',
      'padding: 2px', 'min-height: 48px', 'box-sizing: border-box', 'width: 100%', F
    ].join('; ');
    return {
      trackCss: trackCss,
      aria: p.aria || 'Раздел',
      labelCss: 'font-size: 13px; line-height: 18px; font-weight: 700; color: #000000; text-align: center; min-width: 0',
      segs: items.map(function (label, i) {
        var on = i === picked;
        return {
          label: label,
          icon: icons ? (icons[i] || '') : '',
          hasIcon: !!(icons && icons[i]),
          checked: on ? 'true' : 'false',
          pick: function () { self.setState({ picked: i }); },
          css: [
            stacked ? 'flex: none' : 'flex: 1 1 0', 'min-width: 0', 'min-height: 44px', 'display: flex', 'align-items: center', 'justify-content: center',
            'gap: 5px', 'padding: 8px 4px', 'border: 0', 'border-radius: 8px', 'margin: 0', 'cursor: pointer', 'font: inherit',
            'background: ' + (on ? '#FFFFFF' : 'transparent'), 'box-shadow: ' + (on ? '0 1px 2px rgba(0,0,0,0.12)' : 'none')
          ].join('; ')
        };
      })
    };
  }
}
</script>
</body>
</html>
