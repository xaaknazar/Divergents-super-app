<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MapSheet — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="460" safe-top="{{false}}" hint-size="390px,460px">
<dc-import name="Wrapper" pad="20" gap="24" hint-size="100%,426px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" text="MapSheet" hint-size="100%,34px"></dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" text="Нижний лист поверх карты (слот children)" hint-size="100%,18px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" text="С МЕТРИКАМИ И КНОПКАМИ" hint-size="100%,14px"></dc-import>
<dc-import name="MapSheet" hint-size="100%,182px">
<dc-import name="Wrapper3" dir="row" fill="equal" hint-size="100%,46px">
<dc-import name="MetricValue" variant="strip" value="2.47" label="км" separator="{{true}}" hint-size="100%,46px"></dc-import>
<dc-import name="MetricValue" variant="strip" value="14:32" label="время" hint-size="100%,46px"></dc-import>
</dc-import>
<dc-import name="Wrapper3" dir="row" fill="equal" gap="12" pad-top="16" hint-size="100%,72px">
<dc-import name="Button" label="Пауза" icon="pause" variant="tinted" tone="neutral" size="large" full-width="{{true}}" hint-size="100%,56px"></dc-import>
<dc-import name="Button" label="Финиш" icon="check" variant="solid" tone="danger" size="large" full-width="{{true}}" hint-size="100%,56px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" text="DEFAULT (ДЕМО)" hint-size="100%,14px"></dc-import>
<dc-import name="MapSheet" hint-size="100%,86px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":460}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
