<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AccentSwatch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<button type="button" aria-label="{{aria}}" aria-pressed="{{pressed}}" style="{{rootCss}}">
  <span aria-hidden="true" style="{{ringCss}}"><span style="{{discCss}}"><sc-if value="{{selected}}" hint-placeholder-val="{{false}}"><span style="width: 24px; height: 24px; border-radius: 12px; background: rgba(255,255,255,0.95); display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="check" size="xs" tone="brand" hint-size="12px,12px"></dc-import></span></sc-if></span></span>
  <span style="{{labelCss}}">{{label}}</span>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","default":"divergents","options":["divergents","royal","violet","fuchsia","rose","sunset","gold","emerald","forest","ocean","sky","graphite"]},"label":{"editor":"text","default":""},"selected":{"editor":"boolean","default":false},"$preview":{"width":84,"height":90}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var A = {
      divergents: ['Divergents', '#234088', '#3D5BDB'], royal: ['Королевский', '#4338CA', '#6366F1'], violet: ['Фиолет', '#6D28D9', '#8B5CF6'],
      fuchsia: ['Фуксия', '#A21CAF', '#D946EF'], rose: ['Роза', '#BE123C', '#F43F5E'], sunset: ['Закат', '#C2410C', '#F97316'],
      gold: ['Золото', '#B45309', '#F59E0B'], emerald: ['Изумруд', '#047857', '#10B981'], forest: ['Лес', '#3F6212', '#65A30D'],
      ocean: ['Океан', '#0E7490', '#06B6D4'], sky: ['Небо', '#0369A1', '#0EA5E9'], graphite: ['Графит', '#334155', '#64748B']
    };
    var a = A[p.accent] || A.divergents;
    var sel = p.selected === true || p.selected === 'true';
    var label = p.label || a[0];
    return {
      rootCss: ['width: 100%', 'padding: 8px 0', 'margin: 0', 'border: 0', 'background: transparent', 'cursor: pointer', 'display: flex', 'flex-direction: column', 'align-items: center', F].join('; '),
      ringCss: 'width: 54px; height: 54px; border-radius: 27px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: ' + (sel ? '2.5px solid #000000' : '0'),
      discCss: 'width: ' + (sel ? 44 : 50) + 'px; height: ' + (sel ? 44 : 50) + 'px; border-radius: 25px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, ' + a[1] + ', ' + a[2] + ')',
      labelCss: 'font-size: 11px; line-height: 14px; font-weight: 500; margin-top: 6px; text-align: center; color: ' + (sel ? '#000000' : '#5C5C60'),
      label: label, selected: sel, pressed: sel ? 'true' : 'false', aria: 'Акцент ' + label
    };
  }
}
</script>
</body>
</html>
