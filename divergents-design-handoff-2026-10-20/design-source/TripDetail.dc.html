<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поездка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="2020" surface="plain" safe-top="{{false}}" hint-size="390px,2020px">
  <dc-import name="EventHero" title="Кольсай и Каинды" subtitle="Алматинская область · сложность: средняя" date="1 ноября · 2 дн." back-href="CommunityHome.dc.html" back-label="Сообщество" favorite="{{true}}" share="{{true}}" hint-size="100%,240px"></dc-import>
  <dc-import name="Wrapper" dir="row" fill="equal" pad-y="14" hint-size="100%,66px">
    <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
      <dc-import name="MetricValue" variant="detail" value="{{s.value}}" label="{{s.label}}" value-type="{{s.valueType}}" separator="{{s.separator}}" hint-size="100%,38px"></dc-import>
    </sc-for>
  </dc-import>
  <dc-import name="Divider" hint-size="100%,1px"></dc-import>
  <dc-import name="Wrapper" pad-x="16" pad-top="4" gap="6" pad-bottom="120" hint-size="100%,1680px">
    <dc-import name="ListSection" header="О поездке" hint-size="100%,150px">
      <dc-import name="Wrapper2" pad-x="16" pad-y="12" hint-size="100%,100px">
        <dc-import name="Text" variant="body" text="{{about}}" hint-size="100%,96px"></dc-import>
      </dc-import>
    </dc-import>
    <dc-import name="ListSection" header="Место сбора" hint-size="100%,220px">
      <dc-import name="ListRow" icon="pin" icon-style="plain" title="{{place.address}}" trailing="none" hint-size="100%,48px"></dc-import>
      <dc-import name="ListRow" icon="clock-3h" icon-style="plain" title="{{place.when}}" subtitle="Время сбора" trailing="none" separator="{{true}}" hint-size="100%,68px"></dc-import>
      <dc-import name="ListRow" icon="map" icon-style="plain" title="Открыть точку на карте" subtitle="{{place.coords}}" trailing="chevron" separator="{{true}}" hint-size="100%,68px"></dc-import>
    </dc-import>
    <dc-import name="ListSection" header="Город" hint-size="100%,82px">
      <dc-import name="ListRow" icon-style="none" title="{{city}}" trailing="none" hint-size="100%,48px"></dc-import>
    </dc-import>
    <dc-import name="ListSection" header="Организатор" hint-size="100%,100px">
      <dc-import name="ListRow" person="{{organizer.initial}}" title="{{organizer.name}}" subtitle="{{organizer.role}}" trailing="none" hint-size="100%,68px"></dc-import>
    </dc-import>
    <dc-import name="ListSection" header="Организатору" hint-size="100%,100px">
      <dc-import name="ListRow" icon="people" icon-style="plain" title="Заявки" subtitle="{{pendingLabel}}" trailing="badge" badge="{{pending}}" chevron="{{true}}" href="EventApplicants.dc.html" hint-size="100%,68px"></dc-import>
    </dc-import>
    <dc-import name="ListSection" header="{{routeHeader}}" hint-size="100%,380px">
      <sc-for list="{{route}}" as="r" hint-placeholder-count="4">
        <dc-import name="TripRouteStep" icon="{{r.icon}}" day="{{r.day}}" title="{{r.title}}" note="{{r.note}}" last="{{r.last}}" hint-size="100%,82px"></dc-import>
      </sc-for>
    </dc-import>
    <dc-import name="ListSection" header="Что включено" hint-size="100%,180px">
      <sc-for list="{{included}}" as="i" hint-placeholder-count="3">
        <dc-import name="ListRow" icon="{{i.icon}}" icon-style="plain" title="{{i.title}}" trailing="check" checked="{{true}}" check-tone="success" separator="{{i.separator}}" hint-size="100%,48px"></dc-import>
      </sc-for>
    </dc-import>
    <dc-import name="ListSection" header="{{goingHeader}}" hint-size="100%,142px">
      <dc-import name="EventAttendees" count="{{going}}" hint-size="100%,108px"></dc-import>
    </dc-import>
  </dc-import>
  <dc-import name="BottomBar" placement="screen" variant="solid" hint-size="100%,108px">
    <dc-import name="Button" label="Вы организатор" icon="paperplane" variant="solid" tone="brand" full-width="{{true}}" disabled="{{true}}" hint-size="100%,50px"></dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2020}}'>
class Component extends DCLogic {
  renderVals() {
    var going = 9;
    var people = function (n) { var m = n % 10, h = n % 100; return (m >= 2 && m <= 4 && (h < 12 || h > 14)) ? 'человека' : 'человек'; };
    return {
      stats: [{ value: String(going), label: 'Идут', valueType: 'number', separator: true }, { value: '5', label: 'Свободных мест', valueType: 'number', separator: true }, { value: 'Бесплатно', label: 'Стоимость', valueType: 'text', separator: false }],
      about: 'Два дня в горах: озёра Кольсай и Каинды, прогулки, ночёвка в гостевом доме и разговоры о целях у костра. Каждый оплачивает проживание и питание сам.',
      place: { address: 'Парковка у ТРЦ, пр. Розыбакиева 247а', when: '1 ноября в 06:00 · UTC+5', coords: '43.20190, 76.89240' },
      city: 'Алматы',
      organizer: { initial: 'А', name: 'Акназар', role: 'Участник' },
      going: going,
      goingHeader: 'Идут · ' + going + ' ' + people(going),
      pending: '3', pendingLabel: '3 заявки ждут решения',
      routeHeader: 'Маршрут · 2 дн.',
      route: [
        { icon: 'car', day: 'День 1', title: 'Переезд к озеру Кольсай', note: 'Выезд в 06:00, в пути около 4 часов', last: false },
        { icon: 'crescent', day: 'День 1', title: 'Ночёвка в гостевом доме', note: 'Ужин и вечер у костра', last: false },
        { icon: 'mountains', day: 'День 2', title: 'Озеро Каинды', note: 'Пеший подъём около 1 часа', last: false },
        { icon: 'home', day: 'День 2', title: 'Возвращение в Алматы', note: 'Прибытие к 20:00', last: true }
      ],
      included: [
        { icon: 'car', title: 'Групповой трансфер', separator: false },
        { icon: 'person', title: 'Сопровождение организатора', separator: true },
        { icon: 'home', title: 'Ночёвка в гостевом доме', separator: true }
      ]
    };
  }
}
</script>
</body>
</html>
