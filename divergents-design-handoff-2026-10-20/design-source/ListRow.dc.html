<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ListRow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <sc-if value="{{separator}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="{{sepCss}}"></span></sc-if>
  <sc-if value="{{showTile}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="{{tileCss}}"><dc-import name="Icon" icon="{{icon}}" variant="solid" size="sm" tone="white" hint-size="16px,16px"></dc-import></span></sc-if>
  <sc-if value="{{showPlain}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="{{plainCss}}"><dc-import name="Icon" icon="{{icon}}" variant="line" size="md" tone="inherit" hint-size="20px,20px"></dc-import></span></sc-if>
  <sc-if value="{{showThumb}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="{{thumbCss}}"><img src="{{thumb}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></span></sc-if>
  <sc-if value="{{showAvatar}}" hint-placeholder-val="{{false}}"><dc-import name="Avatar" src="{{avatar}}" person="{{personName}}" size="md" hint-size="40px,40px"></dc-import></sc-if>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
    <dc-import name="Text" variant="body" text="{{title}}" hint-size="100%,24px"></dc-import>
    <sc-if value="{{hasSubtitle}}" hint-placeholder-val="{{false}}"><dc-import name="Text" variant="subhead" tone="secondary" text="{{subtitle}}" hint-size="100%,20px"></dc-import></sc-if>
  </div>
  <sc-if value="{{hasDetail}}" hint-placeholder-val="{{false}}"><div style="flex-shrink: 1; min-width: 0; max-width: 38%"><dc-import name="Text" variant="body" tone="{{detailTone}}" align="end" text="{{detail}}" hint-size="60px,24px"></dc-import></div></sc-if>
  <sc-if value="{{isChevron}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="display: flex; flex-shrink: 0"><dc-import name="Icon" icon="chevron-right" size="sm" tone="tertiary" hint-size="16px,16px"></dc-import></span></sc-if>
  <sc-if value="{{isToggle}}" hint-placeholder-val="{{false}}"><div style="position: relative; z-index: 2; flex-shrink: 0; margin: -8px 0"><dc-import name="Toggle" checked="{{checked}}" label="{{title}}" hint-size="51px,48px"></dc-import></div></sc-if>
  <sc-if value="{{isCheckOn}}" hint-placeholder-val="{{false}}"><span aria-label="Выбрано" role="img" style="display: flex; flex-shrink: 0"><dc-import name="Icon" icon="check" size="md" tone="{{checkTone}}" hint-size="20px,20px"></dc-import></span></sc-if>
  <sc-if value="{{isCheckOff}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 20px; height: 20px; flex-shrink: 0"></span></sc-if>
  <sc-if value="{{isBadge}}" hint-placeholder-val="{{false}}"><span style="min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 6px; border-radius: 10px; background: #234088; color: #FFFFFF; font-size: 11px; line-height: 20px; font-weight: 700; text-align: center; flex-shrink: 0">{{badge}}</span></sc-if>
  <sc-if value="{{isIcon}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="display: flex; flex-shrink: 0"><dc-import name="Icon" icon="{{trailingIcon}}" size="md" tone="{{trailingTone}}" hint-size="20px,20px"></dc-import></span></sc-if>
  <sc-if value="{{isTextStatic}}" hint-placeholder-val="{{false}}"><span style="{{actionCss}}">{{actionLabel}}</span></sc-if>
  <sc-if value="{{isTextButton}}" hint-placeholder-val="{{false}}"><button type="button" style="{{actionBtnCss}}">{{actionLabel}}</button></sc-if>
  <sc-if value="{{extraChevron}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="display: flex; flex-shrink: 0"><dc-import name="Icon" icon="chevron-right" size="sm" tone="tertiary" hint-size="16px,16px"></dc-import></span></sc-if>
  <sc-if value="{{hasHref}}" hint-placeholder-val="{{false}}"><a href="{{href}}" aria-label="{{ariaLabel}}" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1"></a></sc-if>
</div>
</x-dc>
