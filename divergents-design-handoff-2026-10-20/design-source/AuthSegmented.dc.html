<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AuthSegmented</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div role="radiogroup" aria-label="{{aria}}" style="display: flex; box-sizing: border-box; width: 100%; background: rgba(120,120,128,0.16); border-radius: 13px; padding: 4px; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased"><sc-for list="{{segs}}" as="s" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{s.checked}}" onClick="{{s.pick}}" style="{{s.css}}">{{s.label}}</button></sc-for></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"items":{"editor":null},"value":{"editor":"int","default":0,"min":0,"max":3},"$preview":{"width":322,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var p = this.props;
    var items = Array.isArray(p.items) && p.items.length ? p.items : ['Вход', 'Регистрация'];
    var picked = this.state && this.state.picked !== undefined ? this.state.picked : Number(p.value || 0);
    return {
      aria: 'Вход или регистрация',
      segs: items.map(function (label, i) {
        var on = i === picked;
        return {
          label: label, checked: on ? 'true' : 'false',
          pick: function () { self.setState({ picked: i }); },
          css: ['flex: 1 1 0', 'min-width: 0', 'min-height: 48px', 'padding: 10px', 'margin: 0', 'border: 0', 'border-radius: 10px', 'cursor: pointer', 'font: inherit',
            'font-size: 15px', 'line-height: 20px', 'font-weight: 700', 'text-align: center',
            'background: ' + (on ? '#FFFFFF' : 'transparent'), 'box-shadow: ' + (on ? '0 1px 3px rgba(0,0,0,0.12)' : 'none'),
            'color: ' + (on ? '#234088' : '#5C5C60')].join('; ')
        };
      })
    };
  }
}
</script>
</body>
</html>
