<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ChannelCard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{css}}">
  <sc-if value="{{isCover}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="{{bannerCss}}"></span></sc-if>
  <div style="{{rowCss}}">
  <span aria-hidden="true" style="{{avatarCss}}"><sc-if value="{{hasSrc}}" hint-placeholder-val="{{true}}"><img src="{{src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></sc-if><sc-if value="{{noSrc}}" hint-placeholder-val="{{false}}"><dc-import name="Icon" icon="chat-bubbles" variant="solid" size="lg" tone="brand" hint-size="24px,24px"></dc-import></sc-if></span>
  <div style="{{textCss}}">
    <div style="display: flex; align-items: center; gap: 6px; min-width: 0">
      <div style="min-width: 0"><dc-import name="Text" variant="headline" lines="1" text="{{title}}" hint-size="160px,22px"></dc-import></div>
      <sc-if value="{{verified}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="Проверенный канал" style="display: flex; flex-shrink: 0; color: #0369A1"><dc-import name="Icon" icon="seal-check" variant="solid" size="sm" tone="inherit" hint-size="16px,16px"></dc-import></span></sc-if>
    </div>
    <dc-import name="Text" variant="subhead" tone="secondary" lines="1" text="{{description}}" hint-size="100%,20px"></dc-import>
    <div style="display: flex; align-items: center; gap: 5px; margin-top: 1px">
      <span aria-hidden="true" style="display: flex"><dc-import name="Icon" icon="file" variant="solid" size="xs" tone="tertiary" hint-size="12px,12px"></dc-import></span>
      <dc-import name="Text" variant="caption2" tone="tertiary" text="{{meta}}" hint-size="120px,14px"></dc-import>
    </div>
  </div>
  <sc-if value="{{joined}}" hint-placeholder-val="{{false}}"><span role="img" aria-label="Вы участник" style="position: relative; display: flex; flex-shrink: 0"><dc-import name="Icon" icon="check-circle" variant="solid" size="md" tone="brand" hint-size="20px,20px"></dc-import></span></sc-if>
  </div>
  <sc-if value="{{hasHref}}" hint-placeholder-val="{{true}}"><a href="{{href}}" aria-label="{{aria}}" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; border-radius: inherit"></a></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Danday Amokachi"},"description":{"editor":"text","default":"Про развитие"},"src":{"editor":"text","default":"/_blob/f528fbb80d712d453cd5785a9e1e06f6"},"posts":{"editor":"text","default":"191"},"access":{"editor":"enum","default":"Открытый","options":["Открытый","Закрытый"]},"verified":{"editor":"boolean","default":false},"joined":{"editor":"boolean","default":false},"variant":{"editor":"enum","default":"plain","options":["plain","cover"]},"href":{"editor":"text","default":"ServerChannel.dc.html"},"$preview":{"width":358,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var demo = p.title === undefined && p.src === undefined && p.href === undefined;
    var on = function (v) { return v === true || v === 'true'; };
    var cover = p.variant === 'cover';
    var src = p.src !== undefined ? (p.src || '') : '/_blob/f528fbb80d712d453cd5785a9e1e06f6';
    var title = p.title || 'Danday Amokachi';
    var description = p.description !== undefined ? (p.description || '') : 'Про развитие';
    var meta = [p.posts || (demo ? '191' : ''), p.access || 'Открытый'].filter(Boolean).join(' · ');
    var href = p.href !== undefined ? (p.href || '') : 'ServerChannel.dc.html';
    var isCover = cover && !!src;
    return {
      css: ['position: relative', 'display: flex', 'flex-direction: column', 'box-sizing: border-box', 'width: 100%', 'min-width: 0',
        'background: #FFFFFF', 'border-radius: 14px', 'overflow: hidden', 'box-shadow: 0 1px 3px rgba(16,24,40,0.08), 0 12px 28px -10px rgba(16,24,40,0.28)', 'color: #000000', FF].join('; '),
      rowCss: 'display: flex; gap: ' + (isCover ? 12 : 14) + 'px; padding: ' + (isCover ? '0 14px 14px' : '14px') + '; align-items: ' + (isCover ? 'flex-end' : 'center'),
      avatarCss: 'position: relative; width: 56px; height: 56px; border-radius: 18px; background: #E5E5EA; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center' + (isCover ? '; margin-top: -26px; box-shadow: 0 0 0 3px #FFFFFF, 0 4px 12px rgba(16,29,44,0.18)' : ''),
      textCss: 'position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px' + (isCover ? '; padding-top: 10px' : ''),
      src: src, hasSrc: !!src, noSrc: !src,
      // cover: the channel's own picture as a banner strip, avatar overlapping it (profile-header pattern)
      isCover: isCover,
      bannerCss: 'display: block; height: 72px; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.25) 100%), url(' + src + ') center 35% / cover no-repeat',
      title: title, description: description, meta: meta,
      verified: demo ? true : on(p.verified),
      joined: on(p.joined),
      href: href, hasHref: !!href,
      aria: [title, description, meta].filter(Boolean).join(', ')
    };
  }
}
</script>
</body>
</html>
