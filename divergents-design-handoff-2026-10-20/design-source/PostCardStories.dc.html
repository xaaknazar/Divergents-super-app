<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PostCard — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="1060" safe-top="{{false}}" hint-size="390px,1060px">
<dc-import name="Wrapper" pad="20" gap="24" hint-size="100%,1026px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" hint-size="100%,34px">PostCard</dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" hint-size="100%,18px">Публикация канала: kind · clamped · reactions</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">ARTICLE · CLAMPED</dc-import>
<dc-import name="PostCard" kind="article" date="10 окт., 18:30" title="Анонс встреч на октябрь" text="{{longText}}" clamped="{{true}}" reactions="{{r1}}" total="25" hint-size="100%,330px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">VOICE</dc-import>
<dc-import name="PostCard" kind="voice" date="8 окт., 09:15" title="Итоги прошлого челленджа" text="" reactions="{{r2}}" total="19" hint-size="100%,190px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">ARTICLE · КОРОТКИЙ ТЕКСТ</dc-import>
<dc-import name="PostCard" kind="article" date="3 окт., 20:00" title="Новый формат встреч" text="Теперь мероприятия можно создавать прямо в приложении: кнопка «+» на вкладке «Сообщество»." reactions="{{r3}}" total="6" hint-size="100%,200px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      longText: 'Друзья, в октябре нас ждёт насыщенный месяц. Каждую среду собираемся в книжном клубе, в выходные — выезд в горы для всех желающих. 12 октября стартует Divergents challenge: Teachers version — 15 дней, пять команд и общий рейтинг. Заявки уже открыты во вкладке «Челленджи». Также готовим лекцию о привычках и кинопоказ с обсуждением.',
      r1: [{ icon: 'thumbs-up', count: 12 }, { icon: 'heart', count: 8, active: true }, { icon: 'flame', count: 5 }, { icon: 'hand-heart', count: 0 }, { icon: 'sparkles', count: 0 }],
      r2: [{ icon: 'thumbs-up', count: 6 }, { icon: 'heart', count: 0 }, { icon: 'flame', count: 9 }, { icon: 'hand-heart', count: 4 }, { icon: 'sparkles', count: 0 }],
      r3: [{ icon: 'thumbs-up', count: 4 }, { icon: 'heart', count: 0 }, { icon: 'flame', count: 0 }, { icon: 'hand-heart', count: 2 }, { icon: 'sparkles', count: 0 }]
    };
  }
}
</script>
</body>
</html>
