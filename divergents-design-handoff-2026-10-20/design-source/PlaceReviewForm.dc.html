<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PlaceReviewForm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<section style="box-sizing: border-box; width: 100%; padding: 18px; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <dc-import name="Text" variant="headline" heading="2" text="{{title}}" hint-size="100%,22px"></dc-import>
  <div role="radiogroup" aria-label="Оценка" style="display: flex; gap: 2px; margin-top: -2px">
    <sc-for list="{{stars}}" as="s" hint-placeholder-count="5"><button type="button" role="radio" aria-checked="{{s.checked}}" aria-label="{{s.aria}}" onClick="{{s.pick}}" style="{{s.css}}"><dc-import name="Icon" icon="star" variant="{{s.variant}}" size="xl" tone="inherit" hint-size="28px,28px"></dc-import></button></sc-for>
  </div>
  <textarea aria-label="Текст отзыва" placeholder="{{placeholder}}" value="{{val}}" onChange="{{onInput}}" style="display: block; width: 100%; box-sizing: border-box; margin: 0; min-height: 70px; border: 0; border-radius: 12px; background: rgba(118,118,128,0.12); padding: 12px; font-family: inherit; font-size: 17px; line-height: 24px; letter-spacing: -0.2px; color: #000000; resize: none; outline: none"></textarea>
  <dc-import name="Button" label="Отправить отзыв" icon="paperplane" variant="solid" full-width="{{true}}" disabled="{{disabled}}" hint-size="100%,50px"></dc-import>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Ваш отзыв"},"rating":{"editor":"int","default":0,"min":0,"max":5},"value":{"editor":"text","default":""},"placeholder":{"editor":"text","default":"Чем понравилось / что улучшить"},"$preview":{"width":358,"height":252}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var p = this.props;
    var st = this.state || {};
    var rating = st.r !== undefined ? st.r : Number(p.rating || 0);
    var val = st.v !== undefined ? st.v : (p.value || '');
    var stars = [1, 2, 3, 4, 5].map(function (n) {
      var on = n <= rating;
      return {
        aria: String(n), checked: n === rating ? 'true' : 'false', variant: on ? 'solid' : 'line',
        pick: function () { self.setState({ r: n }); },
        css: 'display: flex; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; color: ' + (on ? '#F5A623' : '#6B6B70')
      };
    });
    return {
      title: p.title ?? 'Ваш отзыв',
      placeholder: p.placeholder ?? 'Чем понравилось / что улучшить',
      stars: stars, val: val,
      onInput: function (e) { self.setState({ v: e.target.value }); },
      disabled: rating === 0
    };
  }
}
</script>
</body>
</html>
