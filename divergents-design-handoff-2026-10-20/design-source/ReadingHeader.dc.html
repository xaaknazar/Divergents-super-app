<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ReadingHeader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<section aria-label="{{title}}" style="{{rootCss}}">
  <sc-if value="{{isEditorial}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; justify-content: flex-end"><img src="{{book}}" alt="" aria-hidden="true" style="width: 236px; max-width: 100%; height: 157px; object-fit: contain"></div>
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 12px">
      <span style="{{eyebrowCss}}">{{eyebrow}}</span>
      <h1 style="{{titleCss}}">{{title}}</h1>
      <sc-if value="{{hasSubtitle}}" hint-placeholder-val="{{true}}"><p style="{{subtitleCss}}">{{subtitle}}</p></sc-if>
      <span style="{{metaCss}}"><dc-import name="Icon" icon="clock-3h" size="sm" tone="inherit" hint-size="16px,16px"></dc-import>{{meta}}</span>
    </div>
  </sc-if>
  <sc-if value="{{isCompact}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; gap: 12px; align-items: center">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <span style="{{eyebrowCss}}">{{eyebrow}}</span>
        <h1 style="{{titleSmCss}}">{{title}}</h1>
        <span style="{{metaCss}}"><dc-import name="Icon" icon="clock-3h" size="sm" tone="inherit" hint-size="16px,16px"></dc-import>{{meta}}</span>
      </div>
      <img src="{{book}}" alt="" aria-hidden="true" style="width: 108px; height: 72px; object-fit: contain; flex-shrink: 0">
    </div>
  </sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant": {"editor": "enum", "default": "editorial", "options": ["editorial", "compact"]}, "scheme": {"editor": "enum", "default": "light", "options": ["light", "dark"]}, "eyebrow": {"editor": "text", "default": "Reading challenge"}, "title": {"editor": "text", "default": "\"Extreme reading\" Challenge"}, "subtitle": {"editor": "text", "default": "Читаем каждый день."}, "meta": {"editor": "text", "default": "60 минут в день"}, "$preview": {"width": 358, "height": 370}}'>
class Component extends DCLogic {
  static PAL = {
    light: { card: '#FFFFFF', border: '#E4E7EF', sep: 'rgba(60,60,67,0.12)', ink: '#0B0E16', ink2: '#5C5C60', ink3: '#6B6B70', brand: '#234088', accent: '#3D5BDB', tint: 'rgba(35,64,136,0.07)', track: '#E9ECF5', ok: '#187A32', okTint: 'rgba(24,122,50,0.09)', warn: '#934900', warnTint: 'rgba(255,149,0,0.12)', shadow: '0 1px 2px rgba(16,24,40,0.05), 0 10px 24px -14px rgba(16,24,40,0.22)', book: '/_blob/534c3a5937de37a34afa6a6ebd91be4b' },
    dark: { card: '#161B26', border: 'rgba(255,255,255,0.08)', sep: 'rgba(255,255,255,0.10)', ink: '#F5F6FA', ink2: 'rgba(235,235,245,0.64)', ink3: 'rgba(235,235,245,0.5)', brand: '#8AA0FF', accent: '#8AA0FF', tint: 'rgba(138,160,255,0.12)', track: 'rgba(255,255,255,0.10)', ok: '#6FD39A', okTint: 'rgba(111,211,154,0.12)', warn: '#FFB35C', warnTint: 'rgba(255,179,92,0.14)', shadow: 'none', book: '/_blob/402f38a271f02261a3be20e630746183' }
  };
  static FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";

  // Challenge header: editorial (before joining — book on top, large title) or compact (participant — one row, keeps the timer on the first screen)
  renderVals() {
    var p = this.props;
    var C = Component.PAL[p.scheme === 'dark' ? 'dark' : 'light'];
    var editorial = p.variant !== 'compact';
    var subtitle = p.subtitle ?? 'Читаем каждый день.';
    return {
      isEditorial: editorial, isCompact: !editorial, book: C.book,
      eyebrow: p.eyebrow ?? 'Reading challenge', title: p.title ?? '"Extreme reading" Challenge',
      subtitle: subtitle, hasSubtitle: !!subtitle, meta: p.meta ?? '60 минут в день',
      rootCss: ['box-sizing: border-box', 'width: 100%', 'min-width: 0', 'padding: ' + (editorial ? '22px' : '16px 16px 16px 18px'), 'border-radius: 16px',
        'background: ' + C.card, 'border: 1px solid ' + C.border, 'color: ' + C.ink, Component.FF].join('; '),
      eyebrowCss: 'font-size: 15px; line-height: 20px; color: ' + C.ink2,
      titleCss: 'margin: 0; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.3px; color: ' + C.ink,
      titleSmCss: 'margin: 0; font-size: 20px; line-height: 25px; font-weight: 700; letter-spacing: -0.2px; color: ' + C.ink,
      subtitleCss: 'margin: 0; font-size: 17px; line-height: 24px; color: ' + C.ink2,
      metaCss: 'display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: ' + C.ink2
    };
  }
}
</script>
</body>
</html>
