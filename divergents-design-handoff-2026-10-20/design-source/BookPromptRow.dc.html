<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>BookPromptRow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<button type="button" style="{{css}}">
  <sc-if value="{{separator}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: 0; left: 52px; right: 0; height: 0.5px; background: rgba(60,60,67,0.18)"></span></sc-if>
  <span aria-hidden="true" style="display: flex; flex-shrink: 0; width: 24px; justify-content: center"><dc-import name="Icon" icon="sparkles" variant="solid" size="md" tone="brand" hint-size="20px,20px"></dc-import></span>
  <span style="flex: 1; min-width: 0; font-size: 17px; line-height: 24px; letter-spacing: -0.2px; color: #000000">{{label}}</span>
  <span aria-hidden="true" style="display: flex; flex-shrink: 0"><dc-import name="Icon" icon="arrow-up" size="sm" tone="tertiary" hint-size="16px,16px"></dc-import></span>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Что почитать под мои таланты?"},"separator":{"editor":"boolean","default":false},"$preview":{"width":358,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    return {
      label: p.label || 'Что почитать под мои таланты?',
      separator: p.separator === true || p.separator === 'true',
      css: ['position: relative', 'display: flex', 'align-items: center', 'gap: 12px', 'box-sizing: border-box', 'width: 100%', 'min-height: 48px', 'margin: 0',
        'padding: 12px 16px', 'border: 0', 'background: #FFFFFF', 'text-align: left', 'cursor: pointer', "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif", '-webkit-font-smoothing: antialiased'].join('; ')
    };
  }
}
</script>
</body>
</html>
