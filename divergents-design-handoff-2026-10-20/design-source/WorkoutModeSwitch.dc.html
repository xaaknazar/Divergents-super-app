<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WorkoutModeSwitch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div role="group" aria-label="Тип тренировки" style="display: inline-flex; box-sizing: border-box; padding: 2px; border-radius: 10px; background: rgba(120,120,128,0.16); font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <sc-for list="{{items}}" as="it" hint-placeholder-count="2"><button type="button" aria-pressed="{{it.pressed}}" disabled="{{it.disabled}}" onClick="{{it.pick}}" style="{{it.css}}"><dc-import name="Icon" icon="{{it.icon}}" variant="solid" size="xs" tone="inherit" hint-size="12px,12px"></dc-import><span style="font-size: 11px; line-height: 14px; font-weight: 700">{{it.label}}</span></button></sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"value":{"editor":"enum","default":"run","options":["run","walk"]},"locked":{"editor":"boolean","default":false},"$preview":{"width":180,"height":40}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var p = this.props;
    var locked = !!p.locked;
    var value = (this.state && this.state.v) || p.value || 'run';
    var M = [['run', 'bolt-vertical', 'Бег'], ['walk', 'body-standing', 'Ходьба']];
    var items = M.map(function (m) {
      var on = m[0] === value;
      return {
        icon: m[1], label: m[2], pressed: on ? 'true' : 'false', disabled: locked,
        pick: function () { if (!locked) self.setState({ v: m[0] }); },
        css: ['display: flex', 'align-items: center', 'gap: 4px', 'margin: 0', 'padding: 5px 10px', 'border: 0', 'border-radius: 8px', 'font: inherit',
          'background: ' + (on ? '#FFFFFF' : 'transparent'), 'color: ' + (on ? '#234088' : '#5C5C60'),
          'box-shadow: ' + (on ? '0 1px 2px rgba(0,0,0,0.12)' : 'none'), 'opacity: ' + (locked && !on ? '0.5' : '1'),
          'cursor: ' + (locked ? 'default' : 'pointer')].join('; ')
      };
    });
    return { items: items };
  }
}
</script>
</body>
</html>
