<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>EmptyState</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 32px 24px; box-sizing: border-box; width: 100%; min-width: 0; color: #000000; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <sc-if value="{{hasIllustration}}" hint-placeholder-val="{{false}}"><dc-import name="Illustration" kind="{{illustration}}" size="welcome" hint-size="112px,112px"></dc-import></sc-if>
  <sc-if value="{{showHalo}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="width: 76px; height: 76px; border-radius: 38px; background: rgba(118,118,128,0.12); display: flex; align-items: center; justify-content: center"><span style="width: 56px; height: 56px; border-radius: 28px; background: rgba(118,118,128,0.12); display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="{{icon}}" size="xl" tone="tertiary" hint-size="28px,28px"></dc-import></span></span></sc-if>
  <div style="margin-top: 6px; width: 100%"><dc-import name="Text" variant="headline" heading="2" align="center" text="{{title}}" hint-size="100%,22px"></dc-import></div>
  <sc-if value="{{hasSubtitle}}" hint-placeholder-val="{{true}}"><div style="width: 100%"><dc-import name="Text" variant="body" tone="secondary" align="center" text="{{subtitle}}" hint-size="100%,48px"></dc-import></div></sc-if>
  <sc-if value="{{hasAction}}" hint-placeholder-val="{{false}}"><div style="margin-top: 14px; display: flex; justify-content: center"><dc-import name="Button" label="{{actionLabel}}" href="{{actionHref}}" variant="solid" size="regular" hint-size="200px,50px"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"illustration":{"editor":"enum","default":"none","options":["none","trophy","book","orb"]},"icon":{"editor":"enum","default":"inbox","options":["inbox","bell","book","books-spines","calendar","chat-bubbles","magnifying-glass","people","map","briefcase","cloud-arrow-down","trophy","bookmark"]},"title":{"editor":"text","default":"Пока пусто"},"subtitle":{"editor":"text","default":""},"actionLabel":{"editor":"text","default":""},"actionHref":{"editor":"text","default":""},"$preview":{"width":358,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var demo = p.title === undefined && p.subtitle === undefined && p.actionLabel === undefined;
    var ill = p.illustration && p.illustration !== 'none' ? p.illustration : '';
    var title = p.title !== undefined && p.title !== null ? p.title : (demo ? 'Нет скачанных уроков' : '');
    var subtitle = p.subtitle || (demo ? 'Скачайте уроки в курсе, чтобы смотреть их без интернета' : '');
    var actionLabel = p.actionLabel || (demo ? 'Перейти к курсам' : '');
    var actionHref = p.actionHref || (demo ? 'LMSHome.dc.html' : '');
    return {
      illustration: ill, hasIllustration: !!ill, showHalo: !ill,
      icon: p.icon || (demo ? 'cloud-arrow-down' : 'inbox'),
      title: title, subtitle: subtitle, hasSubtitle: !!subtitle,
      actionLabel: actionLabel, actionHref: actionHref, hasAction: !!actionLabel
    };
  }
}
</script>
</body>
</html>
