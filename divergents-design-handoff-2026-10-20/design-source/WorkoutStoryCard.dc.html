<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WorkoutStoryCard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="{{aria}}" style="width: 300px; height: 533px; box-sizing: border-box; padding: 43px 0 32px; border-radius: 18px; overflow: hidden; background: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 21px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
      <sc-for list="{{metrics}}" as="m" hint-placeholder-count="3"><dc-import name="MetricValue" variant="story" label="{{m.label}}" value="{{m.value}}" hint-size="260px,62px"></dc-import></sc-for>
    </div>
    <dc-import name="RouteThumb" size="share" variant="bare" points="{{route}}" hint-size="126px,126px"></dc-import>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <div style="display: flex; align-items: center; gap: 7px"><dc-import name="Logo" size="sm" variant="color" hint-size="19px,24px"></dc-import><span style="color: #FFFFFF; font-size: 22px; line-height: 26px; font-weight: 700; letter-spacing: 0.5px">Divergents</span></div>
      <span style="color: rgba(255,255,255,0.9); font-size: 10px; line-height: 12px; font-weight: 500; letter-spacing: 1.35px; text-transform: uppercase">non stop development</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"metrics":{"editor":null},"route":{"editor":null},"$preview":{"width":300,"height":533}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var metrics = p.metrics || [
      { label: 'Расстояние', value: '5,02 км' }, { label: 'Темп', value: '5:34 /км' }, { label: 'Время', value: '27 мин 58 с' }
    ];
    return {
      metrics: metrics,
      route: p.route || '12.6,59.4 24,59.4 24,41.1 37.7,41.1 37.7,29.7 51.4,29.7 51.4,17.1 61.7,17.1 61.7,10.3 54.9,5.7 45.7,5.7',
      aria: 'Карточка для сторис: ' + metrics.map(function (m) { return m.label + ' ' + m.value; }).join(', ')
    };
  }
}
</script>
</body>
</html>
