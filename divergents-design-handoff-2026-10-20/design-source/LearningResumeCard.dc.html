<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LearningResumeCard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<a href="{{href}}" aria-label="{{aria}}" style="{{rootCss}}">
  <div style="display: flex; gap: 12px; align-items: center; min-width: 0">
    <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 12px; overflow: hidden; flex-shrink: 0; background: rgba(61,91,219,0.13); display: flex; align-items: center; justify-content: center">
      <sc-if value="{{hasSrc}}" hint-placeholder-val="{{true}}"><img src="{{src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></sc-if>
      <sc-if value="{{noSrc}}" hint-placeholder-val="{{false}}"><dc-import name="Icon" icon="graduation-cap" size="xl" tone="brand" hint-size="28px,28px"></dc-import></sc-if>
    </span>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
      <dc-import name="Text" variant="caption1" tone="secondary" lines="1" text="{{lesson}}" hint-size="100%,16px"></dc-import>
      <dc-import name="Text" variant="headline" heading="2" lines="2" text="{{title}}" hint-size="100%,44px"></dc-import>
    </div>
    <span aria-hidden="true" title="{{actionLabel}}" style="width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(35,64,136,0.09); color: #234088"><span style="display: flex; margin-left: 2px"><dc-import name="Icon" icon="play" variant="solid" size="md" tone="inherit" hint-size="20px,20px"></dc-import></span></span>
  </div>
  <div style="display: flex; align-items: center; gap: 10px">
    <div role="progressbar" aria-label="{{progressAria}}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{progress}}" style="flex: 1; height: 4px; border-radius: 2px; background: rgba(118,118,128,0.14); overflow: hidden"><div style="{{fillCss}}"></div></div>
    <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #5C5C60; font-variant-numeric: tabular-nums; white-space: nowrap">{{progressText}}</span>
  </div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Максимизация талантов Gallup"},"lesson":{"editor":"text","default":"Урок 15 из 34 · Significance"},"src":{"editor":"text","default":"/_blob/d2748e25aa43564a123b0f02c16ddc18"},"progress":{"editor":"int","default":42,"min":0,"max":100},"actionLabel":{"editor":"text","default":"Продолжить"},"href":{"editor":"text","default":"Video.dc.html"},"$preview":{"width":358,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var demo = p.title === undefined;
    var progress = Math.max(0, Math.min(100, Number(p.progress ?? 42)));
    var title = p.title ?? 'Максимизация талантов Gallup';
    var src = p.src ?? (demo ? '/_blob/d2748e25aa43564a123b0f02c16ddc18' : '');
    var lesson = p.lesson ?? (demo ? 'Урок 15 из 34 · Significance' : '');
    return {
      rootCss: ['display: flex', 'flex-direction: column', 'gap: 14px', 'box-sizing: border-box', 'width: 100%', 'min-width: 0', 'padding: 14px 14px 16px',
        'background: #FFFFFF', 'border-radius: 14px', 'box-shadow: 0 1px 3px rgba(16,24,40,0.08), 0 12px 28px -10px rgba(16,24,40,0.28)', 'text-decoration: none', 'color: #000000',
        "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif", '-webkit-font-smoothing: antialiased'].join('; '),
      aria: (p.actionLabel || 'Продолжить') + ': ' + title + (lesson ? ', ' + lesson : '') + ', пройдено ' + progress + '%',
      title: title, lesson: lesson,
      src: src, hasSrc: !!src, noSrc: !src,
      progress: String(progress), progressText: progress + '% пройдено',
      progressAria: 'Пройдено: ' + title,
      fillCss: 'width: ' + progress + '%; height: 100%; border-radius: 2px; background: #234088',
      actionLabel: p.actionLabel || 'Продолжить',
      href: p.href ?? 'Video.dc.html'
    };
  }
}
</script>
</body>
</html>
