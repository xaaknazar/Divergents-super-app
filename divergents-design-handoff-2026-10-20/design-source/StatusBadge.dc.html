<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>StatusBadge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<span style="{{css}}"><sc-if value="{{hasIcon}}" hint-placeholder-val="{{false}}"><dc-import name="Icon" icon="{{icon}}" variant="solid" size="xs" tone="inherit" hint-size="12px,12px"></dc-import></sc-if><span style="{{labelCss}}">{{label}}</span></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Новое"},"icon":{"editor":"enum","default":"","options":["","arrow-down","arrow-from-square-up-right","arrow-left","arrow-right","arrow-rotate-cw-up","arrow-to-bracket-down","arrow-up","ball-soccer","bell","bell-slash","bike","bin","body-standing","bolt-vertical","book","book-bookmark","book-open","bookmark","books-spines","briefcase","building","bullseye","calendar","calendar-check","calendar-star","camera","car","chart-bar","chart-line","chart-pie","chat-bubble","chat-bubbles","check","check-circle","checks","chevron-down","chevron-left","chevron-right","chevron-small-down","chevron-small-right","chevron-up","clipboard","clock-3h","cloud-arrow-down","coffee-cup","compass","copy","credit-card","crescent","crown","dots-three-horizontal","dots-three-vertical","envelope","exclamation-circle","exclamation-triangle","eye","eye-slash","fast-backward","fast-forward","file","file-doc","flag","flame","funnel","gear","gift","globe","graduation-cap","grid-2x2","hand-heart","handshake","headphones","heart","history","home","image","images","inbox","layers","lightbulb","link","list","lock-locked","lock-unlocked","magic-wand","magnifying-glass","map","medal-sport","mic","minus","mountains","navigation","note","palette","paperplane","pause","pause-circle","pencil","pencil-square","people","person","person-check","person-circle","person-plus","person-running","person-square","phone","pin","pin-check","plane","play","play-circle","plus","plus-circle","pulse","qr-code","question-circle","quote-left","robot","rocket","seal-check","share-network","shield-check","shop","skip-backward","skip-forward","sliders","smartphone","sparkles","speaker","star","star-half","stopwatch","sun","tag","target-location","tent","text-i-circle","text-t","thumbs-up","ticket","translate","trending-up","trophy","utensils","video-camera","volume-2","wallet","weight","wifi-slash","x","x-circle"]},"tone":{"editor":"enum","default":"brand","options":["brand","success","warning","danger","neutral","sky","emerald"]},"variant":{"editor":"enum","default":"tinted","options":["tinted","solid","outline","frosted"]},"size":{"editor":"enum","default":"regular","options":["regular","compact"]},"$preview":{"width":100,"height":22}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var TINT = {
      brand: ['rgba(61,91,219,0.13)', '#234088'], success: ['rgba(16,185,129,0.10)', '#187A32'], warning: ['rgba(255,149,0,0.16)', '#934900'],
      danger: ['rgba(255,59,48,0.14)', '#C5221F'], neutral: ['rgba(118,118,128,0.12)', '#000000'], sky: ['rgba(14,165,233,0.10)', '#0369A1'],
      emerald: ['rgba(16,185,129,0.10)', '#065F46']
    };
    var SOLID = {
      brand: ['#234088', '#FFFFFF'], success: ['#34C759', '#000000'], warning: ['#FF9500', '#000000'], danger: ['#FF3B30', '#000000'],
      neutral: ['#6B6B70', '#FFFFFF'], sky: ['#0284C7', '#FFFFFF'], emerald: ['#065F46', '#FFFFFF']
    };
    var tone = TINT[p.tone] ? p.tone : 'brand';
    var variant = p.variant || 'tinted';
    var compact = p.size === 'compact';
    // frosted: for tinted/illustrated card backgrounds — white glass pill, tone-coloured text
    var c = variant === 'solid' ? SOLID[tone] : variant === 'frosted' ? ['rgba(255,255,255,0.78)', tone === 'neutral' ? '#1C1C1E' : TINT[tone][1]] : TINT[tone];
    var outline = variant === 'outline';
    var ink = outline ? (tone === 'neutral' ? '#5C5C60' : TINT[tone][1]) : c[1];
    var pad = compact ? (outline ? '2px 7px' : '3px 8px') : (outline ? '3px 9px' : '4px 10px');
    return {
      css: ['display: inline-flex', 'align-items: center', 'gap: 4px', 'max-width: 100%', 'box-sizing: border-box', 'padding: ' + pad, 'border-radius: 999px',
        'background: ' + (outline ? 'transparent' : c[0]), 'color: ' + ink, 'border: ' + (outline ? '1px solid ' + ink : '0'), 'white-space: nowrap', F].join('; '),
      labelCss: 'font-size: 11px; line-height: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; min-width: 0',
      label: p.label ?? 'Новое',
      icon: p.icon || '',
      hasIcon: !!p.icon
    };
  }
}
</script>
</body>
</html>
