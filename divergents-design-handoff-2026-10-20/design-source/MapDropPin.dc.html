<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MapDropPin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<svg width="{{w}}" height="{{h}}" viewBox="0 0 26 34" role="img" aria-label="{{aria}}" style="display: block"><path d="M13 0C5.8 0 0 5.6 0 12.6 0 22 13 34 13 34s13-12 13-21.4C26 5.6 20.2 0 13 0z" fill="{{color}}"></path><circle cx="13" cy="12.5" r="4.5" fill="#FFFFFF"></circle></svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","default":"place","options":["place","start","finish"]},"category":{"editor":"enum","default":"cafe","options":["cafe","restaurant","hotel","guesthouse","base","park","gym","picnic","tourism"]},"size":{"editor":"enum","default":"regular","options":["regular","large"]},"$preview":{"width":40,"height":44}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var CATS = {
      cafe: ['#C2410C', 'coffee-cup', 'Кафе'], restaurant: ['#B45309', 'utensils', 'Ресторан'], hotel: ['#4338CA', 'building', 'Отель'],
      guesthouse: ['#0E7490', 'home', 'Гостевой дом'], base: ['#047857', 'tent', 'База отдыха'], park: ['#16A34A', 'mountains', 'Парк'],
      gym: ['#BE123C', 'weight', 'Спортзал'], picnic: ['#EA580C', 'sun', 'Пикник'], tourism: ['#0369A1', 'camera', 'Туризм']
    };
    var kind = p.kind || 'place';
    var large = p.size === 'large';
    var color = kind === 'start' ? '#34C759' : kind === 'finish' ? '#FF3B30' : (CATS[p.category] || CATS.cafe)[0];
    var aria = kind === 'start' ? 'Старт' : kind === 'finish' ? 'Финиш' : 'Метка места';
    return { w: large ? 30 : 26, h: large ? 39 : 34, color: color, aria: aria };
  }
}
</script>
</body>
</html>
