  <dc-import name="NavHeader" variant="inline" title="Моя анкета" back-label="Карьера" back-href="CareerHome.dc.html" actions="{{headerActions}}" action-label="Править" action-href="ResumeForm.dc.html" hint-size="100%,118px"></dc-import>
  <dc-import name="Wrapper" pad-x="20" pad-top="16" pad-bottom="16" hint-size="100%,192px">
    <dc-import name="TalentHero" person="Акназар [Фамилия]" badges="{{heroBadges}}" hint-size="100%,160px"></dc-import>
  </dc-import>
  <dc-import name="Wrapper" pad-x="16" pad-bottom="40" gap="6" hint-size="100%,2700px">

    <dc-import name="ListSection" hint-size="100%,384px">
      <sc-for list="{{personal}}" as="r" hint-placeholder-count="8">
        <dc-import name="ListRow" title="{{r.title}}" detail="{{r.detail}}" trailing="none" separator="{{r.sep}}" hint-size="100%,48px"></dc-import>
      </sc-for>
    </dc-import>
    <dc-import name="SectionHeader" size="small" title="Карьера и образование" action="Изменить" chevron="{{false}}" href="ResumeForm.dc.html" hint-size="100%,32px"></dc-import>
    <dc-import name="ListSection" hint-size="100%,424px">
      <sc-for list="{{career}}" as="r" hint-placeholder-count="7">
        <dc-import name="ListRow" title="{{r.title}}" subtitle="{{r.subtitle}}" detail="{{r.detail}}" trailing="none" separator="{{r.sep}}" hint-size="100%,48px"></dc-import>
      </sc-for>
    </dc-import>
    <dc-import name="SectionHeader" size="small" title="О себе" action="Изменить" chevron="{{false}}" href="ResumeForm.dc.html" hint-size="100%,32px"></dc-import>
    <dc-import name="ListSection" hint-size="100%,288px">
      <sc-for list="{{about}}" as="r" hint-placeholder-count="6">
        <dc-import name="ListRow" title="{{r.title}}" detail="{{r.detail}}" trailing="none" separator="{{r.sep}}" hint-size="100%,48px"></dc-import>
      </sc-for>
    </dc-import>
    <dc-import name="ListSection" header="Опыт работы" hint-size="100%,166px">
      <sc-for list="{{jobs}}" as="r" hint-placeholder-count="2">
        <dc-import name="ListRow" icon="briefcase" icon-style="plain" icon-tone="brand" title="{{r.title}}" subtitle="{{r.subtitle}}" trailing="none" separator="{{r.sep}}" hint-size="100%,68px"></dc-import>
      </sc-for>
    </dc-import>
    <dc-import name="ListSection" header="Тип личности (MBTI)" hint-size="100%,86px">
      <dc-import name="Wrapper2" pad="16" hint-size="100%,56px">
        <dc-import name="Text" variant="body" text="ENTJ · Командир" hint-size="100%,24px"></dc-import>
      </dc-import>
    </dc-import>
    <dc-import name="SectionHeader" size="small" title="Таланты Gallup · 10" action="Изменить" chevron="{{false}}" hint-size="100%,32px"></dc-import>
    <dc-import name="ListSection" footer="Порядок талантов сохраняется только на этом устройстве. Официальный отчёт Talentslab формируется на сайте и не меняется." hint-size="100%,740px">
      <sc-for list="{{talents}}" as="t" hint-placeholder-count="10">
        <dc-import name="TalentRankRow" rank="{{t.rank}}" title="{{t.title}}" domain="{{t.domain}}" separator="{{t.sep}}" hint-size="100%,68px"></dc-import>
      </sc-for>
    </dc-import>
    <dc-import name="SectionHeader" size="small" title="Множественный интеллект (Гарднер)" action="" hint-size="100%,32px"></dc-import>
    <dc-import name="GardnerChart" items="{{gardner}}" hint-size="100%,200px"></dc-import>
    <dc-import name="ListSection" header="Отчёты" hint-size="100%,126px">
      <sc-for list="{{reports}}" as="r" hint-placeholder-count="2">
        <dc-import name="ListRow" icon="file" icon-style="plain" title="{{r.title}}" trailing="text" action-label="Поделиться" separator="{{r.sep}}" hint-size="100%,48px"></dc-import>
      </sc-for>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
