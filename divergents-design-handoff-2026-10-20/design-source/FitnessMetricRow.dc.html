<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>FitnessMetricRow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <sc-if value="{{separator}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: rgba(60,60,67,0.18)"></span></sc-if>
  <dc-import name="IconTile" icon="{{icon}}" tone="{{tone}}" variant="solid" size="sm" hint-size="36px,36px"></dc-import>
  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><dc-import name="Text" variant="body" text="{{title}}" hint-size="100%,24px"></dc-import><dc-import name="Text" variant="caption1" tone="secondary" lines="1" text="{{subtitle}}" hint-size="100%,16px"></dc-import></span>
  <span style="display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0"><dc-import name="Text" variant="title3" align="end" numeric="{{true}}" text="{{value}}" hint-size="80px,25px"></dc-import><dc-import name="Text" variant="caption2" tone="tertiary" align="end" text="{{caption}}" hint-size="60px,14px"></dc-import></span>
  <button type="button" aria-label="{{addLabel}}" style="width: 36px; height: 36px; border-radius: 18px; border: 0; padding: 0; margin: 0; background: #234088; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><dc-import name="Icon" icon="plus" size="sm" tone="white" hint-size="16px,16px"></dc-import></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","default":"weight","options":["weight","stopwatch","pulse","body-standing","heart","flame","bolt-vertical"]},"tone":{"editor":"enum","default":"violet","options":["brand","violet","orange","sport","trip","pink"]},"title":{"editor":"text","default":"Подтягивания"},"subtitle":{"editor":"text","default":"последний 10 раз · 6 окт"},"value":{"editor":"text","default":"12 раз"},"caption":{"editor":"text","default":"рекорд"},"separator":{"editor":"boolean","default":false},"$preview":{"width":358,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var tone = { brand: 1, violet: 1, orange: 1, sport: 1, trip: 1, pink: 1 }[p.tone] ? p.tone : 'violet';
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var title = p.title ?? 'Подтягивания';
    return {
      tone: tone,
      rootCss: ['position: relative', 'display: flex', 'align-items: center', 'gap: 12px', 'padding: 12px 16px', 'box-sizing: border-box', 'width: 100%', 'color: #000000', F].join('; '),
      icon: p.icon || 'weight', title: title, subtitle: p.subtitle ?? 'последний 10 раз · 6 окт', value: p.value ?? '12 раз', caption: p.caption ?? 'рекорд',
      addLabel: 'Записать ' + title,
      separator: p.separator === true || p.separator === 'true'
    };
  }
}
</script>
</body>
</html>
