<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AISuggestionChip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<sc-if value="{{isLink}}" hint-placeholder-val="{{false}}"><a href="{{href}}" style="{{css}}">{{label}}</a></sc-if><sc-if value="{{isButton}}" hint-placeholder-val="{{true}}"><button type="button" style="{{css}}">{{label}}</button></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Какой курс мне подойдёт?"},"href":{"editor":"text","default":""},"$preview":{"width":260,"height":44}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    return {
      css: ['display: inline-flex', 'align-items: center', 'justify-content: center', 'box-sizing: border-box', 'min-height: 44px', 'margin: 0', 'padding: 8px 16px', 'border: 0',
        'border-radius: 14px', 'background: rgba(61,91,219,0.13)', 'color: #234088', 'font-size: 17px', 'line-height: 22px', 'font-weight: 700', 'letter-spacing: -0.2px',
        'white-space: nowrap', 'flex-shrink: 0', 'text-decoration: none', 'cursor: pointer', FF].join('; '),
      label: p.label || 'Какой курс мне подойдёт?',
      href: p.href || '', isLink: !!p.href, isButton: !p.href
    };
  }
}
</script>
</body>
</html>
