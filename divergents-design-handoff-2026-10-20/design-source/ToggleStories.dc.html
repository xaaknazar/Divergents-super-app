<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Toggle — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="420" safe-top="{{false}}" hint-size="390px,420px">
<dc-import name="Wrapper" pad="20" gap="24" hint-size="100%,386px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" hint-size="100%,34px">Toggle</dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" hint-size="100%,18px">Переключатель iOS: checked · disabled (подпись — через Text в Wrapper)</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,130px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">ON / OFF</dc-import>
<dc-import name="Wrapper3" gap="10"  hint-size="100%,106px">
<dc-import name="Wrapper4" dir="row" fill="first" gap="12" hint-size="100%,48px">
<dc-import name="Text" variant="body" tone="primary" hint-size="100%,24px">Уведомления</dc-import>
<dc-import name="Toggle" checked="{{true}}" label="Уведомления" hint-size="51px,48px"></dc-import>
</dc-import>
<dc-import name="Wrapper4" dir="row" fill="first" gap="12" hint-size="100%,48px">
<dc-import name="Text" variant="body" tone="primary" hint-size="100%,24px">Звук</dc-import>
<dc-import name="Toggle" label="Звук" hint-size="51px,48px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,72px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">DISABLED</dc-import>
<dc-import name="Wrapper3" dir="row" gap="16" align="center" wrap="{{true}}" hint-size="100%,48px">
<dc-import name="Toggle" checked="{{true}}" disabled="{{true}}" label="Синхронизация" hint-size="51px,48px"></dc-import>
<dc-import name="Toggle" disabled="{{true}}" label="Геолокация" hint-size="51px,48px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
