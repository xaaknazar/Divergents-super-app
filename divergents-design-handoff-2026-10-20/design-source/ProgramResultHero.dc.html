<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ProgramResultHero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<section style="{{rootCss}}">
  <div style="display: flex; align-items: center; gap: 8px">
    <dc-import name="Icon" icon="flag" variant="solid" size="lg" tone="white" hint-size="24px,24px"></dc-import>
    <span style="flex: 1; min-width: 0"><dc-import name="Text" variant="subheadEm" tone="white" text="{{status}}" hint-size="100%,20px"></dc-import></span>
  </div>
  <div style="margin-top: 20px"><dc-import name="Text" variant="title1" tone="white" heading="2" text="{{title}}" hint-size="100%,34px"></dc-import></div>
  <div style="margin-top: 8px"><dc-import name="Text" variant="subhead" tone="white" text="{{dates}}" hint-size="100%,20px"></dc-import></div>
  <div style="margin-top: 28px; padding-top: 20px; border-top: 0.5px solid #FFFFFF; display: flex; flex-direction: column">
    <dc-import name="Text" variant="subhead" tone="white" text="{{totalLabel}}" hint-size="100%,20px"></dc-import>
    <div style="margin-top: 8px"><dc-import name="Text" variant="display" tone="white" numeric="{{true}}" text="{{total}}" hint-size="100%,50px"></dc-import></div>
    <div style="margin-top: 4px"><dc-import name="Text" variant="title3" tone="white" text="{{unit}}" hint-size="100%,25px"></dc-import></div>
    <div style="margin-top: 12px"><dc-import name="Text" variant="footnote" tone="white" text="{{goal}}" hint-size="100%,18px"></dc-import></div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"status":{"editor":"text","default":"Программа завершена"},"title":{"editor":"text","default":"Отжимания"},"dates":{"editor":"text","default":"12 сент. 2026 г. — 2 окт. 2026 г."},"totalLabel":{"editor":"text","default":"Всего за программу"},"total":{"editor":"text","default":"612"},"unit":{"editor":"text","default":"раз"},"goal":{"editor":"text","default":"Цель — 30 раз каждый день, 21 день"},"$preview":{"width":358,"height":350}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    return {
      rootCss: ['display: flex', 'flex-direction: column', 'box-sizing: border-box', 'width: 100%', 'padding: 24px', 'border-radius: 24px', 'background: #234088', 'color: #FFFFFF', F].join('; '),
      status: p.status ?? 'Программа завершена', title: p.title ?? 'Отжимания', dates: p.dates ?? '12 сент. 2026 г. — 2 окт. 2026 г.',
      totalLabel: p.totalLabel ?? 'Всего за программу', total: p.total ?? '612', unit: p.unit ?? 'раз', goal: p.goal ?? 'Цель — 30 раз каждый день, 21 день'
    };
  }
}
</script>
</body>
</html>
