<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>VacancyHero — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="380" safe-top="{{false}}" hint-size="390px,380px">
  <dc-import name="Wrapper" pad-x="16" pad-top="24" gap="20" hint-size="100%,340px">
    <dc-import name="Text" variant="title2" heading="1" text="VacancyHero" hint-size="100%,28px"></dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,130px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="с тегами" hint-size="100%,18px"></dc-import>
      <dc-import name="VacancyHero" title="HR бизнес-партнёр" company="Ритейл-группа" city="Алматы" logo-tone="brand" tags="{{tags}}" hint-size="100%,100px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,90px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="без тегов" hint-size="100%,18px"></dc-import>
      <dc-import name="VacancyHero" title="Продуктовый аналитик" company="IT-компания" city="Астана" logo-tone="indigo" tags="{{none}}" hint-size="100%,64px"></dc-import>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":380}}'>
class Component extends DCLogic {
  renderVals() {
    return {"tags": [{"label": "Гибрид"}, {"label": "от 600 000 ₸"}, {"label": "3 дня назад"}], "none": []};
  }
}
</script>
</body>
</html>
