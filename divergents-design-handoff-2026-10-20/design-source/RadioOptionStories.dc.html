<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>RadioOption — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="760" safe-top="{{false}}" hint-size="390px,760px">
<dc-import name="Wrapper" pad="20" gap="24" hint-size="100%,726px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" hint-size="100%,34px">RadioOption</dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" hint-size="100%,18px">Строка выбора: title · description · icon · selected</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,238px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">ROUTE MODE · WITH ICON</dc-import>
<dc-import name="Wrapper3" gap="8"  hint-size="100%,214px">
<dc-import name="RadioOption" title="Пешком" description="Маршрут по тротуарам и паркам" icon="body-standing" selected="{{true}}" hint-size="100%,66px"></dc-import>
<dc-import name="RadioOption" title="На велосипеде" description="Велодорожки, где они есть" icon="bike" hint-size="100%,66px"></dc-import>
<dc-import name="RadioOption" title="На машине" description="Самый быстрый путь по дорогам" icon="car" hint-size="100%,66px"></dc-import>
</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,156px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">WITHOUT ICON</dc-import>
<dc-import name="Wrapper3" gap="8"  hint-size="100%,132px">
<dc-import name="RadioOption" title="Еженедельно" description="Отчёт приходит по понедельникам" icon="" selected="{{true}}" hint-size="100%,62px"></dc-import>
<dc-import name="RadioOption" title="Ежемесячно" description="Отчёт приходит 1-го числа" icon="" hint-size="100%,62px"></dc-import>
</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,128px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">TITLE ONLY</dc-import>
<dc-import name="Wrapper3" gap="8"  hint-size="100%,104px">
<dc-import name="RadioOption" title="Да" description="" icon="" selected="{{true}}" hint-size="100%,48px"></dc-import>
<dc-import name="RadioOption" title="Нет" description="" icon="" hint-size="100%,48px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
