<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PostFeedHeader</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{css}}">
  <div style="display: flex; align-items: center; gap: 8px">
    <dc-import name="Text" variant="title3" heading="2" text="{{title}}" hint-size="140px,25px"></dc-import>
    <sc-if value="{{hasCount}}" hint-placeholder-val="{{true}}"><span style="min-width: 22px; height: 22px; box-sizing: border-box; padding: 0 7px; border-radius: 11px; background: rgba(120,120,128,0.16); display: flex; align-items: center; justify-content: center; font-size: 11px; line-height: 14px; font-weight: 700; color: #5C5C60">{{count}}</span></sc-if>
  </div>
  <sc-if value="{{hasFilters}}" hint-placeholder-val="{{true}}">
    <div role="group" aria-label="Фильтр публикаций" style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3"><button type="button" aria-pressed="{{f.pressed}}" style="{{f.css}}"><span style="{{f.labelCss}}">{{f.label}}</span><span style="{{f.countCss}}">{{f.count}}</span></button></sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Публикации"},"count":{"editor":"int","default":3,"min":0,"max":9999},"filters":{"editor":null},"$preview":{"width":358,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var demo = p.title === undefined && p.filters === undefined;
    var filters = (p.filters || (demo ? [{ label: 'Все', count: 3, active: true }, { label: 'Статьи', count: 2 }, { label: 'Голос', count: 1 }] : [])).map(function (f) {
      var on = !!f.active;
      return {
        label: f.label, count: f.count === undefined ? '' : String(f.count), pressed: on ? 'true' : 'false',
        css: ['display: flex', 'align-items: center', 'gap: 5px', 'margin: 0', 'padding: 7px 13px', 'border: 0', 'border-radius: 999px', 'cursor: pointer', FF,
          'background: ' + (on ? '#234088' : 'rgba(120,120,128,0.16)')].join('; '),
        labelCss: 'font-size: 13px; line-height: 18px; font-weight: 700; color: ' + (on ? '#FFFFFF' : '#5C5C60'),
        countCss: 'font-size: 11px; line-height: 14px; font-weight: 700; color: ' + (on ? 'rgba(255,255,255,0.85)' : '#6B6B70')
      };
    });
    var count = p.count !== undefined && p.count !== null ? Number(p.count) : (demo ? 3 : 0);
    return {
      css: ['display: flex', 'flex-direction: column', 'gap: 12px', 'box-sizing: border-box', 'width: 100%', 'min-width: 0', FF].join('; '),
      title: p.title || 'Публикации',
      count: String(count), hasCount: count > 0,
      filters: filters, hasFilters: filters.length > 0
    };
  }
}
</script>
</body>
</html>
