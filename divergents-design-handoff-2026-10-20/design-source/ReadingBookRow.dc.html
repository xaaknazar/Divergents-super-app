<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ReadingBookRow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <span aria-hidden="true" style="{{coverCss}}"><dc-import name="Icon" icon="book" variant="solid" size="md" tone="inherit" hint-size="20px,20px"></dc-import></span>
  <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
    <span style="{{titleCss}}">{{title}}</span>
    <span style="{{metaCss}}">{{meta}}</span>
  </span>
  <sc-if value="{{hasAction}}" hint-placeholder-val="{{false}}"><span style="{{actionCss}}">{{action}}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scheme": {"editor": "enum", "default": "light", "options": ["light", "dark"]}, "title": {"editor": "text", "default": "Атомные привычки"}, "author": {"editor": "text", "default": "Джеймс Клир"}, "page": {"editor": "text", "default": "Страница 128"}, "action": {"editor": "text", "default": "Сменить"}, "variant": {"editor": "enum", "default": "card", "options": ["card", "plain"]}, "$preview": {"width": 358, "height": 72}}'>
class Component extends DCLogic {
  static PAL = {
    light: { card: '#FFFFFF', border: '#E4E7EF', sep: 'rgba(60,60,67,0.12)', ink: '#0B0E16', ink2: '#5C5C60', ink3: '#6B6B70', brand: '#234088', accent: '#3D5BDB', tint: 'rgba(35,64,136,0.07)', track: '#E9ECF5', ok: '#187A32', okTint: 'rgba(24,122,50,0.09)', warn: '#934900', warnTint: 'rgba(255,149,0,0.12)', shadow: '0 1px 2px rgba(16,24,40,0.05), 0 10px 24px -14px rgba(16,24,40,0.22)', book: '/_blob/534c3a5937de37a34afa6a6ebd91be4b' },
    dark: { card: '#161B26', border: 'rgba(255,255,255,0.08)', sep: 'rgba(255,255,255,0.10)', ink: '#F5F6FA', ink2: 'rgba(235,235,245,0.64)', ink3: 'rgba(235,235,245,0.5)', brand: '#8AA0FF', accent: '#8AA0FF', tint: 'rgba(138,160,255,0.12)', track: 'rgba(255,255,255,0.10)', ok: '#6FD39A', okTint: 'rgba(111,211,154,0.12)', warn: '#FFB35C', warnTint: 'rgba(255,179,92,0.14)', shadow: 'none', book: '/_blob/402f38a271f02261a3be20e630746183' }
  };
  static FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";

  // Current book line: cover placeholder (no invented cover), title, author · page
  renderVals() {
    var p = this.props;
    var C = Component.PAL[p.scheme === 'dark' ? 'dark' : 'light'];
    var card = p.variant !== 'plain';
    var action = p.action ?? 'Сменить';
    return {
      title: p.title || 'Атомные привычки',
      meta: [p.author ?? 'Джеймс Клир', p.page ?? 'Страница 128'].filter(Boolean).join(' · '),
      action: action, hasAction: !!action,
      rootCss: ['display: flex', 'align-items: center', 'gap: 12px', 'box-sizing: border-box', 'width: 100%', 'min-width: 0', Component.FF, 'color: ' + C.ink,
        card ? 'padding: 12px 14px; border-radius: 16px; background: ' + C.card + '; border: 1px solid ' + C.border : 'padding: 0'].join('; '),
      coverCss: 'width: 34px; height: 46px; border-radius: 4px 7px 7px 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: ' + C.tint + '; color: ' + C.brand + '; box-shadow: inset 3px 0 0 ' + C.brand,
      titleCss: 'font-size: 16px; line-height: 21px; font-weight: 700; color: ' + C.ink + '; white-space: nowrap; overflow: hidden; text-overflow: ellipsis',
      metaCss: 'font-size: 13px; line-height: 18px; color: ' + C.ink2 + '; white-space: nowrap; overflow: hidden; text-overflow: ellipsis',
      actionCss: 'flex-shrink: 0; font-size: 15px; font-weight: 700; color: ' + C.brand + '; min-height: 44px; display: flex; align-items: center'
    };
  }
}
</script>
</body>
</html>
