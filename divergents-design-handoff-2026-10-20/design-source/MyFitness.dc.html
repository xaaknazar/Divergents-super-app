<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мои тренировки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<dc-import name="Screen" height="1880" safe-top="{{false}}" hint-size="390px,1880px">
<dc-import name="FitnessHero" back-label="Профиль" back-href="ProfileHome.dc.html" eyebrow="Физические показатели" title="Мои тренировки" stats="{{heroStats}}" primary-label="Записать бег" primary-href="WorkoutTrack.dc.html" secondary-label="История" secondary-href="WorkoutHistory.dc.html" hint-size="100%,300px"></dc-import>

  <dc-import name="Wrapper" pad-top="18" gap="10" hint-size="100%,170px">
    <dc-import name="FitnessSectionHeader" title="Программы" action="Новая" action-icon="plus" hint-size="100%,32px"></dc-import>
    <dc-import name="Wrapper2" pad-x="16" hint-size="100%,118px">
      <dc-import name="ProgramCard" variant="active" title="Приседания · 50 раз" caption="День 5 из 30" reminder="07:00" streak="1 день подряд" days="{{programDays}}" hint-size="100%,118px"></dc-import>
    </dc-import>
  </dc-import>

  <dc-import name="Wrapper" pad-x="16" pad-top="12" gap="12" hint-size="100%,160px">
    <dc-import name="ShortcutCard" variant="outlined" icon="history" title="История программ" subtitle="2 завершённые программы · ваши итоги" href="ProgramHistory.dc.html" hint-size="100%,72px"></dc-import>
    <dc-import name="Card" variant="tinted" size="regular" href="ProgramResult.dc.html" hint-size="100%,80px">
      <dc-import name="Wrapper2" gap="4" hint-size="100%,44px">
        <dc-import name="Text" variant="subheadEm" tone="brand" text="Последний результат · Отжимания" hint-size="100%,20px"></dc-import>
        <dc-import name="Text" variant="subhead" text="Норма выполнена: 19 из 21 дней. Посмотреть итоги" hint-size="100%,20px"></dc-import>
      </dc-import>
    </dc-import>
  </dc-import>

  <dc-import name="Wrapper" pad-top="24" gap="10" hint-size="100%,310px">
    <dc-import name="FitnessSectionHeader" title="Рекорды" action="" hint-size="100%,32px"></dc-import>
    <dc-import name="Wrapper2" pad-x="16" cols="2" gap="10" hint-size="100%,260px">
      <sc-for list="{{records}}" as="r" hint-placeholder-count="4">
        <dc-import name="FitnessRecordTile" icon="{{r.icon}}" tone="{{r.tone}}" value="{{r.value}}" label="{{r.label}}" caption="{{r.caption}}" hint-size="100%,124px"></dc-import>
      </sc-for>
    </dc-import>
  </dc-import>

  <dc-import name="Wrapper" pad-top="24" gap="10" hint-size="100%,220px">
    <dc-import name="FitnessSectionHeader" title="Цели" action="Добавить" action-icon="plus" hint-size="100%,32px"></dc-import>
    <dc-import name="Wrapper2" pad-x="16" hint-size="100%,172px">
      <dc-import name="ListSection" header="" hint-size="100%,172px">
        <sc-for list="{{goals}}" as="g" hint-placeholder-count="2">
          <dc-import name="FitnessGoalRow" title="{{g.title}}" current="{{g.current}}" target="{{g.target}}" value="{{g.value}}" separator="{{g.separator}}" hint-size="100%,86px"></dc-import>
        </sc-for>
      </dc-import>
    </dc-import>
  </dc-import>

  <dc-import name="Wrapper" pad-top="24" gap="10" hint-size="100%,175px">
    <dc-import name="FitnessSectionHeader" title="Показатели" action="Добавить" action-icon="plus" hint-size="100%,32px"></dc-import>
    <dc-import name="Wrapper2" pad-x="16" hint-size="100%,128px">
      <dc-import name="ListSection" header="" hint-size="100%,128px">
        <sc-for list="{{metrics}}" as="m" hint-placeholder-count="2">
          <dc-import name="FitnessMetricRow" icon="{{m.icon}}" tone="{{m.tone}}" title="{{m.title}}" subtitle="{{m.subtitle}}" value="{{m.value}}" caption="рекорд" separator="{{m.separator}}" hint-size="100%,64px"></dc-import>
        </sc-for>
      </dc-import>
    </dc-import>
  </dc-import>

  <dc-import name="Wrapper" pad-top="24" gap="10" hint-size="100%,265px">
    <dc-import name="FitnessSectionHeader" title="Последние тренировки" action="Все" action-icon="list" href="WorkoutHistory.dc.html" hint-size="100%,32px"></dc-import>
    <dc-import name="Wrapper2" pad-x="16" hint-size="100%,222px">
      <dc-import name="ListSection" header="" hint-size="100%,222px">
        <sc-for list="{{workouts}}" as="w" hint-placeholder-count="3">
          <dc-import name="FitnessWorkoutRow" title="{{w.title}}" subtitle="{{w.subtitle}}" route="{{w.route}}" href="WorkoutHistory.dc.html" separator="{{w.separator}}" hint-size="100%,74px"></dc-import>
        </sc-for>
      </dc-import>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1880}}'>
class Component extends DCLogic {
  renderVals() {
    var days = ['done', 'done', 'missed', 'done', 'today'];
    for (var i = 0; i < 25; i++) days.push('future');
    return {
      heroStats: [
        { value: '12,6', label: 'км за неделю' },
        { value: '6', label: 'тренировок' },
        { value: '1', label: 'на сегодня' }
      ],
      programDays: days,
      records: [
        { icon: 'person-running', tone: 'brand', value: '8,4 км', label: 'Самая длинная пробежка', caption: '3 окт · 5′42″/км' },
        { icon: 'stopwatch', tone: 'warning', value: '5′12″', label: 'Лучший темп', caption: '5,0 км · 27 сен' },
        { icon: 'mountains', tone: 'success', value: '6,2 км', label: 'Самая длинная прогулка', caption: '21 сен · 1:14:30' },
        { icon: 'trending-up', tone: 'violet', value: '64,8 км', label: 'Всего пройдено', caption: '4 пробежки · 2 прогулки' }
      ],
      goals: [
        { title: 'Пробежать 10 км', current: 'сейчас 8,4 км', target: 'цель 10 км', value: 84, separator: false },
        { title: 'Подтягивания: 15 раз', current: 'сейчас 12 раз', target: 'цель 15 раз', value: 80, separator: true }
      ],
      metrics: [
        { icon: 'weight', tone: 'violet', title: 'Подтягивания', subtitle: 'последний 10 раз · 6 окт', value: '12 раз', separator: false },
        { icon: 'stopwatch', tone: 'orange', title: 'Планка', subtitle: 'последний 150 сек · 4 окт', value: '180 сек', separator: true }
      ],
      workouts: [
        { title: 'Пробежка · 5,02 км', subtitle: '9 окт · 27:40 · 5′31″/км', route: 'loop', separator: false },
        { title: 'Ходьба · 3,40 км', subtitle: '7 окт · 41:12 · 12′07″/км', route: 'line', separator: true },
        { title: 'Пробежка · 8,40 км', subtitle: '3 окт · 47:53 · 5′42″/км', route: 'circuit', separator: true }
      ]
    };
  }
}
</script>
</body>
</html>
