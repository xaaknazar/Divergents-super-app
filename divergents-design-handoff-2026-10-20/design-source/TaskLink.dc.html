<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TaskLink</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<sc-if value="{{isLink}}" hint-placeholder-val="{{true}}"><a href="{{href}}" style="{{css}}"><dc-import name="Icon" icon="{{icon}}" size="{{iconSize}}" tone="brand" hint-size="20px,20px"></dc-import><span style="{{labelCss}}">{{label}}</span><dc-import name="Icon" icon="chevron-right" size="sm" tone="tertiary" hint-size="16px,16px"></dc-import></a></sc-if>
<sc-if value="{{isButton}}" hint-placeholder-val="{{false}}"><button type="button" style="{{css}}"><dc-import name="Icon" icon="{{icon}}" size="{{iconSize}}" tone="brand" hint-size="20px,20px"></dc-import><span style="{{labelCss}}">{{label}}</span><dc-import name="Icon" icon="chevron-right" size="sm" tone="tertiary" hint-size="16px,16px"></dc-import></button></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Записать бег или ходьбу"},"icon":{"editor":"enum","default":"navigation","options":["navigation","question-circle","body-standing","map","stopwatch","pulse","calendar"]},"variant":{"editor":"enum","default":"primary","options":["primary","help"]},"href":{"editor":"text","default":""},"separator":{"editor":"boolean","default":false},"$preview":{"width":330,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var on = function (v) { return v === true || v === 'true'; };
    var help = p.variant === 'help';
    var demo = p.label === undefined && p.href === undefined;
    return {
      label: p.label ?? 'Записать бег или ходьбу', icon: p.icon || (help ? 'question-circle' : 'navigation'),
      iconSize: help ? 'sm' : 'md', href: p.href || (demo ? 'WorkoutTrack.dc.html' : ''),
      isLink: !!(p.href || demo), isButton: !(p.href || demo),
      css: ['width: 100%', 'box-sizing: border-box', 'min-height: ' + (help ? 44 : 48) + 'px', 'display: flex', 'align-items: center', 'gap: ' + (help ? 8 : 9) + 'px', 'padding: 0', 'margin: 0',
        'border: 0', 'border-top: ' + (on(p.separator) ? '0.5px solid rgba(60,60,67,0.18)' : '0'), 'background: transparent', 'cursor: pointer', 'text-align: left', 'text-decoration: none', 'color: #234088', FF].join('; '),
      labelCss: 'flex: 1; min-width: 0; font-size: 15px; line-height: 20px; color: #234088; font-weight: ' + (help ? 400 : 700)
    };
  }
}
</script>
</body>
</html>
