<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>BookRatingInput</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div role="radiogroup" aria-label="{{label}}" style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 12px 0; width: 100%"><sc-for list="{{stars}}" as="s" hint-placeholder-count="5"><button type="button" aria-label="{{s.aria}}" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="width: 48px; height: 48px; border: 0; padding: 0; margin: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><dc-import name="Icon" icon="star" variant="{{s.variant}}" size="xl" tone="{{s.tone}}" hint-size="28px,28px"></dc-import></button></sc-for></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"value":{"editor":"int","default":4,"min":0,"max":5},"label":{"editor":"text","default":"Моя оценка"},"$preview":{"width":326,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var p = this.props;
    var value = this.state && this.state.v !== undefined ? this.state.v : Number(p.value ?? 4);
    var stars = [];
    for (var i = 1; i <= 5; i++) {
      (function (n) {
        stars.push({ aria: n + ' из 5', pressed: n === value ? 'true' : 'false', variant: n <= value ? 'solid' : 'line', tone: n <= value ? 'warning' : 'secondary',
          pick: function () { self.setState({ v: n }); } });
      })(i);
    }
    return { label: p.label || 'Моя оценка', stars: stars };
  }
}
</script>
</body>
</html>
