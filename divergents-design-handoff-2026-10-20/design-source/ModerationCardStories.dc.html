<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ModerationCard — варианты</title>

<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="800" safe-top="{{false}}" hint-size="390px,800px">
<dc-import name="Wrapper" pad="20" gap="24" hint-size="100%,766px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" text="ModerationCard" hint-size="100%,34px"></dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" text="Заявка на метку: src · title · category · meta · description · hours · features · author" hint-size="100%,18px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" text="С ФОТО" hint-size="100%,14px"></dc-import>
<dc-import name="ModerationCard" hint-size="100%,380px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">

<dc-import name="ModerationCard" title="Культура" category="cafe" meta="Кафе · Астана, Казахстан" description="Вкусный колд-брю. Очень вкусная кухня и отличный вайб." features="{{f}}" author="Yerassyl" src="" hours="" hint-size="100%,250px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { f: [{ label: 'Халяль', icon: 'seal-check' }, { label: 'Без алкоголя', icon: 'x' }] };
  }
}
</script>
</body>
</html>
