<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>GardnerChart — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="520" safe-top="{{false}}" hint-size="390px,520px">
  <dc-import name="Wrapper" pad-x="16" pad-top="24" gap="20" hint-size="100%,480px">
    <dc-import name="Text" variant="title2" heading="1" text="GardnerChart" hint-size="100%,28px"></dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,220px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="9 интеллектов (по умолчанию, скролл по X)" hint-size="100%,18px"></dc-import>
      <dc-import name="GardnerChart" items="{{all}}" hint-size="100%,200px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,220px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="3 значения" hint-size="100%,18px"></dc-import>
      <dc-import name="GardnerChart" items="{{three}}" hint-size="100%,200px"></dc-import>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    return {"all": [{"label": "Лингвистический", "value": 72}, {"label": "Логико-математический", "value": 85}, {"label": "Музыкальный", "value": 40}, {"label": "Телесно-кинестетический", "value": 55}, {"label": "Пространственный", "value": 63}, {"label": "Межличностный", "value": 88}, {"label": "Внутриличностный", "value": 80}, {"label": "Натуралистический", "value": 45}, {"label": "Экзистенциальный", "value": 60}], "three": [{"label": "Лингвистический", "value": 30}, {"label": "Логико-математический", "value": 100}, {"label": "Музыкальный", "value": 65}]};
  }
}
</script>
</body>
</html>
