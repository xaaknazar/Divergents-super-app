<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PlaceHighlight — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="240" safe-top="{{false}}" hint-size="390px,240px">
<dc-import name="Wrapper" pad="20" gap="24" hint-size="100%,206px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" text="PlaceHighlight" hint-size="100%,34px"></dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" text="Блок «Чем хорошо»: title · text (переносы \n)" hint-size="100%,18px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,80px">
<dc-import name="Text" variant="caption2Em" tone="secondary" text="DEFAULT" hint-size="100%,14px"></dc-import>
<dc-import name="PlaceHighlight" hint-size="100%,108px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
