<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>LessonRow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<sc-if value="{{isLink}}" hint-placeholder-val="{{true}}"><a href="{{href}}" aria-current="{{current}}" style="{{css}}"><sc-if value="{{separator}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: 0; left: 54px; right: 0; height: 0.5px; background: rgba(60,60,67,0.18)"></span></sc-if><span aria-hidden="true" style="display: flex; flex-shrink: 0; width: 26px; height: 26px; align-items: center; justify-content: center"><dc-import name="Icon" icon="{{icon}}" variant="solid" size="lg" tone="{{iconTone}}" hint-size="24px,24px"></dc-import></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; line-height: 24px; letter-spacing: -0.2px; color: {{titleColor}}">{{heading}}</span><span style="font-size: 13px; line-height: 18px; color: #5C5C60">{{subtitle}}</span></span></a></sc-if><sc-if value="{{isStatic}}" hint-placeholder-val="{{false}}"><div aria-disabled="true" style="{{css}}"><sc-if value="{{separator}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: 0; left: 54px; right: 0; height: 0.5px; background: rgba(60,60,67,0.18)"></span></sc-if><span aria-hidden="true" style="display: flex; flex-shrink: 0; width: 26px; height: 26px; align-items: center; justify-content: center"><dc-import name="Icon" icon="{{icon}}" variant="solid" size="lg" tone="{{iconTone}}" hint-size="24px,24px"></dc-import></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; line-height: 24px; letter-spacing: -0.2px; color: {{titleColor}}">{{heading}}</span><span style="font-size: 13px; line-height: 18px; color: #5C5C60">{{subtitle}}</span></span></div></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"number":{"editor":"text","default":"15"},"title":{"editor":"text","default":"Significance"},"subtitle":{"editor":"text","default":""},"state":{"editor":"enum","default":"current","options":["done","current","upcoming","locked"]},"href":{"editor":"text","default":"Video.dc.html"},"separator":{"editor":"boolean","default":false},"$preview":{"width":358,"height":76}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var state = p.state || 'current';
    var S = {
      done: ['check-circle', 'success', 'Пройдено'],
      current: ['play-circle', 'brand', 'Аудио'],
      upcoming: ['play-circle', 'brand', 'Аудио'],
      locked: ['lock-locked', 'tertiary', 'Откроется после оплаты']
    };
    var s = S[state] || S.current;
    var locked = state === 'locked';
    var href = locked ? '' : (p.href ?? 'Video.dc.html');
    var css = ['position: relative', 'display: flex', 'align-items: center', 'gap: 12px', 'padding: 16px', 'min-height: 64px', 'box-sizing: border-box', 'width: 100%',
      'text-decoration: none', 'color: #000000', "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif", '-webkit-font-smoothing: antialiased',
      'background: ' + (state === 'current' ? 'rgba(61,91,219,0.13)' : 'transparent')].join('; ');
    var num = p.number ?? '15';
    return {
      css: css, href: href, isLink: !!href, isStatic: !href, separator: !!p.separator,
      current: state === 'current' ? 'step' : 'false',
      icon: s[0], iconTone: s[1],
      titleColor: locked ? '#6B6B70' : '#000000',
      heading: (num ? num + '. ' : '') + (p.title ?? 'Significance'),
      subtitle: p.subtitle || s[2]
    };
  }
}
</script>
</body>
</html>
