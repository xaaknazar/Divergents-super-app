<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>CareerChoiceGroup — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="760" safe-top="{{false}}" hint-size="390px,760px">
  <dc-import name="Wrapper" pad-x="16" pad-top="24" gap="20" hint-size="100%,720px">
    <dc-import name="Text" variant="title2" heading="1" text="CareerChoiceGroup" hint-size="100%,28px"></dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,160px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="variant=tinted · layout=wrap · required" hint-size="100%,18px"></dc-import>
      <dc-import name="CareerChoiceGroup" label="Семейное положение" required="{{true}}" options="{{marital}}" selected="{{one}}" hint-size="100%,140px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,100px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="variant=tinted · layout=equal" hint-size="100%,18px"></dc-import>
      <dc-import name="CareerChoiceGroup" label="Готов(а) к переезду" options="{{yesno}}" selected="{{none}}" layout="equal" hint-size="100%,76px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,100px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="variant=solid · layout=equal" hint-size="100%,18px"></dc-import>
      <dc-import name="CareerChoiceGroup" label="Формат" options="{{formats}}" selected="{{zero}}" layout="equal" variant="solid" hint-size="100%,72px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,120px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="variant=solid · layout=wrap · multiple · helper" hint-size="100%,18px"></dc-import>
      <dc-import name="CareerChoiceGroup" label="Опыт работы" options="{{exp}}" selected="{{one}}" multiple="{{true}}" variant="solid" helper="Можно выбрать несколько" hint-size="100%,90px"></dc-import>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return {"marital": ["Холост/Не замужем", "Женат/Замужем", "Разведен(а)", "Вдовец/Вдова"], "yesno": ["Да", "Нет"], "formats": ["Гибрид", "Офис", "Удалёнка"], "exp": ["Опыт 1-3 года", "Опыт 3-6 лет", "Без опыта"], "one": [1], "zero": [0], "none": []};
  }
}
</script>
</body>
</html>
