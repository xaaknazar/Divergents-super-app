<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>FitnessRecordTile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <dc-import name="IconTile" icon="{{icon}}" tone="{{tileTone}}" variant="solid" size="sm" hint-size="36px,36px"></dc-import>
    <button type="button" aria-label="{{shareLabel}}" style="min-width: 32px; min-height: 32px; margin: -8px -8px -8px 0; border: 0; padding: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="share-network" size="sm" tone="tertiary" hint-size="16px,16px"></dc-import></button>
  </div>
  <div style="margin-top: 10px"><dc-import name="Text" variant="title2" numeric="{{true}}" text="{{value}}" hint-size="100%,28px"></dc-import></div>
  <div style="margin-top: 2px"><dc-import name="Text" variant="caption1" lines="1" text="{{label}}" hint-size="100%,16px"></dc-import></div>
  <div style="margin-top: 1px"><dc-import name="Text" variant="caption2" tone="secondary" text="{{caption}}" hint-size="100%,14px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","default":"body-standing","options":["person-running","body-standing","stopwatch","pulse","flag","trophy","bolt-vertical","flame","weight","medal-sport","mountains","trending-up","navigation"]},"tone":{"editor":"enum","default":"brand","options":["brand","warning","success","danger","sport","violet"]},"value":{"editor":"text","default":"8,4 км"},"label":{"editor":"text","default":"Самая длинная пробежка"},"caption":{"editor":"text","default":"3 окт · 5′42″/км"},"$preview":{"width":174,"height":124}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var label = p.label ?? 'Самая длинная пробежка';
    return {
      rootCss: ['display: flex', 'flex-direction: column', 'box-sizing: border-box', 'width: 100%', 'height: 100%', 'min-height: 124px', 'padding: 14px', 'background: #FFFFFF',
        'border-radius: 14px', 'color: #000000', F].join('; '),
      tileTone: { brand: 'brand', warning: 'orange', success: 'trip', danger: 'challenge', sport: 'sport', violet: 'violet' }[p.tone] || 'brand',
      icon: p.icon || 'body-standing', value: p.value ?? '8,4 км', label: label, caption: p.caption ?? '3 окт · 5′42″/км',
      shareLabel: 'Поделиться: ' + label
    };
  }
}
</script>
</body>
</html>
