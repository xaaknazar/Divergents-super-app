<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ResumeStepHeader — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="300" safe-top="{{false}}" hint-size="390px,300px">
  <dc-import name="Wrapper" pad-x="16" pad-top="24" gap="20" hint-size="100%,260px">
    <dc-import name="Text" variant="title2" heading="1" text="ResumeStepHeader" hint-size="100%,28px"></dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,60px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="шаг 1 из 4" hint-size="100%,18px"></dc-import>
      <dc-import name="ResumeStepHeader" icon="person" step="{{1}}" total="{{4}}" title="Личные данные" hint-size="100%,40px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,60px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="шаг 3 из 4" hint-size="100%,18px"></dc-import>
      <dc-import name="ResumeStepHeader" icon="graduation-cap" step="{{3}}" total="{{4}}" title="Образование и опыт" hint-size="100%,40px"></dc-import>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
