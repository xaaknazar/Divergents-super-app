<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ProgramHighlight — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<dc-import name="Screen" height="320" safe-top="{{false}}" hint-size="390px,320px">
<dc-import name="Wrapper" pad-x="16" pad-top="24" pad-bottom="24" gap="24" hint-size="100%,280px">
  <dc-import name="Text" variant="title2" heading="1" text="ProgramHighlight" hint-size="100%,28px"></dc-import>
  <dc-import name="Wrapper2" gap="8" hint-size="100%,100px">
    <dc-import name="Text" variant="footnoteEm" tone="secondary" text="icon flame / bolt-vertical" hint-size="100%,18px"></dc-import>
    <dc-import name="Wrapper3" gap="12" hint-size="100%,172px"><dc-import name="ProgramHighlight" hint-size="100%,80px"></dc-import><dc-import name="ProgramHighlight" icon="bolt-vertical" title="Больше цели" text="Вы превысили дневную норму: 6 дней." hint-size="100%,80px"></dc-import></dc-import>
  </dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":320}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
