<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DownloadRow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <sc-if value="{{separator}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: 0; left: 54px; right: 0; height: 0.5px; background: rgba(60,60,67,0.18)"></span></sc-if>
  <sc-if value="{{isPlayable}}" hint-placeholder-val="{{true}}"><button type="button" aria-label="{{mainLabel}}" aria-pressed="{{pressed}}" style="flex: 1; min-width: 0; min-height: 48px; display: flex; align-items: center; gap: 12px; border: 0; padding: 0; margin: 0; background: transparent; font: inherit; text-align: left; cursor: pointer"><span aria-hidden="true" style="display: flex; flex-shrink: 0; width: 26px; height: 26px; align-items: center; justify-content: center"><dc-import name="Icon" icon="{{leadIcon}}" variant="{{leadVariant}}" size="lg" tone="brand" hint-size="24px,24px"></dc-import></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; line-height: 24px; letter-spacing: -0.2px; color: #000000">{{title}}</span><span style="font-size: 13px; line-height: 18px; color: #5C5C60">{{subtitle}}</span></span></button></sc-if>
  <sc-if value="{{isAvailable}}" hint-placeholder-val="{{false}}"><div style="flex: 1; min-width: 0; min-height: 48px; display: flex; align-items: center; gap: 12px"><span aria-hidden="true" style="display: flex; flex-shrink: 0; width: 26px; height: 26px; align-items: center; justify-content: center"><dc-import name="Icon" icon="{{leadIcon}}" variant="{{leadVariant}}" size="lg" tone="brand" hint-size="24px,24px"></dc-import></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; line-height: 24px; letter-spacing: -0.2px; color: #000000">{{title}}</span><span style="font-size: 13px; line-height: 18px; color: #5C5C60">{{subtitle}}</span></span></div></sc-if>
  <button type="button" aria-label="{{actionLabel}}" style="width: 48px; height: 48px; flex-shrink: 0; border: 0; padding: 0; margin: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><dc-import name="Icon" icon="{{actionIcon}}" size="lg" tone="{{actionTone}}" hint-size="24px,24px"></dc-import></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"15. Significance"},"subtitle":{"editor":"text","default":"14.2 МБ · Доступно офлайн"},"state":{"editor":"enum","default":"downloaded","options":["downloaded","playing","available"]},"separator":{"editor":"boolean","default":false},"$preview":{"width":358,"height":76}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var st = p.state || 'downloaded';
    var title = p.title ?? '15. Significance';
    var available = st === 'available';
    var playing = st === 'playing';
    return {
      rootCss: ['position: relative', 'display: flex', 'align-items: center', 'gap: 8px', 'padding: 12px 8px 12px 16px', 'box-sizing: border-box', 'width: 100%', 'min-width: 0',
        'background: ' + (playing ? 'rgba(61,91,219,0.13)' : 'transparent'), 'color: #000000',
        "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif", '-webkit-font-smoothing: antialiased'].join('; '),
      separator: !!p.separator,
      isPlayable: !available, isAvailable: available,
      mainLabel: title + '. ' + (playing ? 'Пауза' : 'Воспроизвести'),
      pressed: playing ? 'true' : 'false',
      leadIcon: available ? 'headphones' : (playing ? 'pause-circle' : 'play-circle'),
      leadVariant: available ? 'line' : 'solid',
      title: title,
      subtitle: p.subtitle ?? (available ? 'Аудио для офлайна' : 'Доступно офлайн'),
      actionIcon: available ? 'cloud-arrow-down' : 'bin',
      // calm: delete glyph is quiet grey (destructive red only on confirm)
      actionTone: available ? 'brand' : 'tertiary',
      actionLabel: available ? 'Скачать аудио' : 'Удалить загрузку'
    };
  }
}
</script>
</body>
</html>
