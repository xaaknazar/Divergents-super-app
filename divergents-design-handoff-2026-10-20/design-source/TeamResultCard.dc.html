<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>TeamResultCard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{css}}">
<div style="display: flex; align-items: center; gap: 12px; padding: 14px">
<span aria-hidden="true" style="{{tileCss}}"><dc-import name="Icon" icon="trophy" variant="solid" size="lg" tone="inherit" hint-size="24px,24px"></dc-import></span>
<div style="flex: 1; min-width: 0">
<dc-import name="Text" variant="headline" text="{{title}}" hint-size="100%,22px"></dc-import>
<dc-import name="Text" variant="caption1" tone="secondary" text="{{subtitle}}" hint-size="100%,16px"></dc-import>
</div>
</div>
<div aria-hidden="true" style="height: 0.5px; background: rgba(60,60,67,0.18); margin-left: 14px"></div>
<div style="display: flex; gap: 12px; padding: 16px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px">
<dc-import name="Text" variant="subheadEm" align="center" numeric="{{true}}" text="{{s.value}}" hint-size="100%,20px"></dc-import>
<dc-import name="Text" variant="caption1" tone="secondary" align="center" text="{{s.label}}" hint-size="100%,16px"></dc-import>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tone":{"editor":"enum","default":"winner","options":["winner","neutral"]},"title":{"editor":"text","default":"KEX group"},"subtitle":{"editor":"text","default":"1 место из 8 · 4 200 pts · 20 человек"},"stats":{"editor":null},"$preview":{"width":358,"height":150}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var winner = (p.tone || 'winner') === 'winner';
    var stats = Array.isArray(p.stats) && p.stats.length ? p.stats : [{ value: '3 600', label: 'страниц' }, { value: '1 600 000', label: 'шагов' }, { value: '120', label: 'дней без сахара' }];
    return {
      title: p.title ?? 'KEX group', subtitle: p.subtitle ?? '1 место из 8 · 4 200 pts · 20 человек',
      stats: stats.map(function (s) { return { value: String(s.value), label: s.label }; }),
      css: "background: #FFFFFF; border-radius: 14px; overflow: hidden; box-sizing: border-box; width: 100%; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; border: " + (winner ? '1px solid #E0A21A' : '0'),
      tileCss: 'width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: ' + (winner ? 'rgba(240,180,41,0.16); color: #E0A21A' : 'rgba(61,91,219,0.13); color: #234088')
    };
  }
}
</script>
</body>
</html>
