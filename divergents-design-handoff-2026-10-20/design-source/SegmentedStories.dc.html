<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Segmented — варианты</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Screen" height="700" safe-top="{{false}}" hint-size="390px,700px">
<dc-import name="Wrapper" pad="20" gap="24" hint-size="100%,666px">
<dc-import name="Wrapper2" gap="4" hint-size="100%,56px">
<dc-import name="Text" variant="title1" heading="1" hint-size="100%,34px">Segmented</dc-import>
<dc-import name="Text" variant="footnote" tone="secondary" hint-size="100%,18px">Сегменты: items · value · icons (4+ пункта складываются в столбик, как в приложении)</dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,72px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">TWO ITEMS</dc-import>
<dc-import name="Segmented" items="{{two}}" value="0" hint-size="100%,48px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,72px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">THREE ITEMS</dc-import>
<dc-import name="Segmented" items="{{three}}" value="1" hint-size="100%,48px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,72px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">WITH ICONS</dc-import>
<dc-import name="Segmented" items="{{theme}}" icons="{{themeIcons}}" value="0" hint-size="100%,48px"></dc-import>
</dc-import>
<dc-import name="Wrapper2" gap="10" hint-size="100%,208px">
<dc-import name="Text" variant="caption2Em" tone="secondary" hint-size="100%,14px">4+ ITEMS · STACKED</dc-import>
<dc-import name="Segmented" items="{{four}}" value="2" hint-size="100%,184px"></dc-import>
</dc-import>
</dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    return { two: ['Курсы', 'Книги'], three: ['День', 'Неделя', 'Месяц'], theme: ['Система', 'Светлая', 'Тёмная'], themeIcons: ['gear', 'sun', 'crescent'], four: ['Все', 'Курсы', 'Книги', 'Сертификаты'] };
  }
}
</script>
</body>
</html>
