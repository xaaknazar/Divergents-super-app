<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Книга — Код таланта</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<dc-import name="Screen" height="1760" safe-top="{{false}}" hint-size="390px,1760px">
  <dc-import name="NavHeader" variant="plain" back-label="Книги" back-href="BooksCatalog.dc.html" actions="{{actions}}" hint-size="100%,118px"></dc-import>
  <dc-import name="Wrapper" pad-x="16" pad-top="4" pad-bottom="120" gap="28" hint-size="100%,1560px">
    <dc-import name="Wrapper2" gap="20" hint-size="100%,412px">
      <dc-import name="BookHero" title="Код таланта. Гениями не рождаются. Ими становятся" author="Дэниел Койл" src="/_blob/ab29d7c214eb7576b59de35205483cdb" rating="5.0" reader-rating="5.0" reader-count="3" genres="{{genres}}" hint-size="100%,344px"></dc-import>
      <dc-import name="Segmented" items="{{statuses}}" icons="{{statusIcons}}" value="1" hint-size="100%,48px"></dc-import>
    </dc-import>
    <dc-import name="ListSection" header="Прогресс чтения" hint-size="100%,162px">
      <dc-import name="Wrapper2" pad="16" gap="12" hint-size="100%,130px">
        <dc-import name="Wrapper3" dir="row" justify="between" align="baseline" hint-size="100%,20px">
          <dc-import name="Text" variant="subheadEm" text="Прочитано" hint-size="100px,20px"></dc-import>
          <dc-import name="Text" variant="subheadEm" tone="brand" numeric="{{true}}" text="35%" hint-size="40px,20px"></dc-import>
        </dc-import>
        <dc-import name="ProgressBar" value="35" size="thin" tone="brand" label="" hint-size="100%,4px"></dc-import>
        <dc-import name="BookProgressSteps" steps="{{steps}}" hint-size="100%,48px"></dc-import>
      </dc-import>
    </dc-import>
    <dc-import name="ListSection" header="Моя оценка" hint-size="100%,104px">
      <dc-import name="BookRatingInput" value="4" label="Моя оценка" hint-size="100%,72px"></dc-import>
    </dc-import>
    <dc-import name="ListSection" header="Описание" hint-size="100%,352px">
      <dc-import name="Wrapper2" pad="16" hint-size="100%,320px">
        <dc-import name="Text" variant="body" text="{{description}}" hint-size="100%,288px"></dc-import>
      </dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="12" hint-size="100%,164px">
      <dc-import name="Segmented" items="{{reviewTabs}}" value="0" hint-size="100%,48px"></dc-import>
      <dc-import name="Card" size="regular" hint-size="100%,104px">
        <dc-import name="Wrapper3" gap="6" align="center" hint-size="100%,68px">
          <dc-import name="Text" variant="headline" align="center" text="Пока нет рецензий" hint-size="100%,22px"></dc-import>
          <dc-import name="Text" variant="subhead" tone="secondary" align="center" text="Станьте первым, кто поделится мнением о книге." hint-size="100%,40px"></dc-import>
        </dc-import>
      </dc-import>
    </dc-import>
    <dc-import name="Card" size="flush" hint-size="100%,50px">
      <dc-import name="Button" label="Убрать с полки" icon="bin" variant="plain" tone="danger" full-width="{{true}}" hint-size="100%,50px"></dc-import>
    </dc-import>
  </dc-import>
  <dc-import name="BottomBar" variant="blur" placement="screen" hint-size="100%,166px">
    <dc-import name="BookComposer" variant="review" placeholder="Написать рецензию" action-label="Отправить" hint-size="100%,104px"></dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1760}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      "actions": [
        {
          "icon": "share-network",
          "label": "Поделиться"
        }
      ],
      "genres": [
        "Личная эффективность",
        "Психология",
        "HR"
      ],
      "statuses": [
        "В планах",
        "Читаю",
        "Прочитано"
      ],
      "statusIcons": [
        "bookmark",
        "book-open",
        "check-circle"
      ],
      "reviewTabs": [
        "Рецензии · 0",
        "Комментарии · 0"
      ],
      "description": "Исследование механизмов, превращающих естественные задатки в выдающиеся способности. Автор объясняет неврологическую природу мастерства через процесс миелинизации нервных путей в мозге. Книга предлагает практический подход к глубинному обучению, эффективной практике и поддержанию высокого уровня мотивации для достижения профессионального превосходства.",
      "steps": [
        "0%",
        "25%",
        "50%",
        "75%",
        "100%"
      ]
    };
  }
}
</script>
</body>
</html>
