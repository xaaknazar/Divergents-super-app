<head>

<x-dc>

  <dc-import name="Wrapper" pad="16" gap="20" hint-size="100%,720px">
    <dc-import name="Wrapper2" pad-x="4" gap="4" hint-size="100%,56px">
      <dc-import name="Text" variant="title1" heading="1" text="ReadingProgressSummary" hint-size="100%,34px"></dc-import>

    </dc-import>

      <dc-import name="ReadingProgressSummary" today="18" pace="54" hint-size="100%,170px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,120px">
      <dc-import name="Text" variant="caption2Em" tone="secondary" text="ТЕМП ДОСТИГНУТ" hint-size="100%,14px"></dc-import>
      <dc-import name="ReadingProgressSummary" today="72" pace="66" streak="11" pages="540" hint-size="100%,170px"></dc-import>
    </dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,120px">
      <dc-import name="Text" variant="caption2Em" tone="secondary" text="ТЁМНАЯ" hint-size="100%,14px"></dc-import>
      <dc-import name="StoryBackdrop" tone="dark" hint-size="100%,200px"><dc-import name="ReadingProgressSummary" scheme="dark" hint-size="100%,170px"></dc-import></dc-import>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":880}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
