<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MetricValue</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{css}}">
  <sc-if value="{{isStory}}" hint-placeholder-val="{{false}}"><span style="{{storyLabelCss}}">{{label}}</span><span style="{{storyValueCss}}">{{value}}</span></sc-if>
  <sc-if value="{{isPlain}}" hint-placeholder-val="{{true}}"><dc-import name="Text" variant="{{valueVariant}}" numeric="{{numeric}}" align="{{align}}" text="{{value}}" hint-size="100%,28px"></dc-import><dc-import name="Text" variant="caption1" tone="secondary" align="{{align}}" text="{{label}}" hint-size="100%,16px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"value":{"editor":"text","default":"5,02 км"},"label":{"editor":"text","default":"Дистанция"},"variant":{"editor":"enum","default":"grid","options":["strip","grid","story","detail","card"]},"valueType":{"editor":"enum","default":"number","options":["number","text"]},"separator":{"editor":"boolean","default":false},"$preview":{"width":180,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var V = { strip: 1, grid: 1, story: 1, detail: 1, card: 1 };
    var variant = V[p.variant] ? p.variant : 'grid';
    var story = variant === 'story';
    // strip / detail / card = centered cells of an equal row (Wrapper dir=row fill=equal), right hairline via separator
    var centered = variant === 'strip' || variant === 'detail' || variant === 'card';
    var event = variant === 'detail' || variant === 'card';
    var sep = p.separator === true || p.separator === 'true';
    var textValue = p.valueType === 'text';
    var css = ['box-sizing: border-box', 'width: 100%', 'min-width: 0', 'display: flex', 'flex-direction: column',
      "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif", '-webkit-font-smoothing: antialiased'];
    if (centered) css.push('align-items: center', 'justify-content: flex-start', 'gap: ' + (event ? 1 : 2) + 'px', 'text-align: center', 'padding: 0 ' + (event ? 6 : 0) + 'px', 'border-right: ' + (sep ? '0.5px solid rgba(60,60,67,0.18)' : '0'));
    else if (story) css.push('align-items: center', 'gap: 2px');
    else css.push('align-items: stretch', 'gap: 1px', 'padding: 12px 4px');
    var VV = { strip: 'title2', grid: 'title2', detail: 'headline', card: 'title3' };
    return {
      css: css.join('; '),
      value: p.value ?? '5,02 км',
      label: p.label ?? 'Дистанция',
      align: centered ? 'center' : 'start',
      valueVariant: textValue ? 'footnoteEm' : (VV[variant] || 'title2'),
      numeric: !textValue,
      isStory: story, isPlain: !story,
      storyLabelCss: 'color: #FFFFFF; font-size: 13px; line-height: 16px; font-weight: 700; letter-spacing: 0.2px; text-align: center',
      storyValueCss: 'color: #FFFFFF; font-size: 37px; line-height: 44px; font-weight: 700; letter-spacing: -0.5px; text-align: center; white-space: nowrap'
    };
  }
}
</script>
</body>
</html>
