<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PlaceHero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="display: flex; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif">
  <dc-import name="PlaceIconTile" category="{{category}}" size="large" hint-size="60px,60px"></dc-import>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
    <div style="display: flex; align-items: center; gap: 6px">
      <dc-import name="Text" variant="title2" heading="1" text="{{title}}" hint-size="200px,28px"></dc-import>
      <sc-if value="{{verified}}" hint-placeholder-val="{{true}}"><span role="img" aria-label="Проверено Divergents" style="display: flex; flex-shrink: 0; color: #0369A1"><dc-import name="Icon" icon="seal-check" variant="solid" size="md" tone="inherit" hint-size="20px,20px"></dc-import></span></sc-if>
    </div>
    <dc-import name="Text" variant="subhead" tone="secondary" text="{{subtitle}}" hint-size="100%,20px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Origo Coffee Shop"},"subtitle":{"editor":"text","default":"Кафе · Не указано"},"category":{"editor":"enum","default":"cafe","options":["cafe","restaurant","hotel","guesthouse","base","park","gym","picnic","tourism"]},"verified":{"editor":"boolean","default":true},"$preview":{"width":350,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    return {
      title: p.title ?? 'Origo Coffee Shop',
      subtitle: p.subtitle ?? 'Кафе · Не указано',
      category: p.category || 'cafe',
      verified: p.verified !== false
    };
  }
}
</script>
</body>
</html>
