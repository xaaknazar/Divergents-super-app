<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}

  <div role="dialog" aria-modal="true" aria-label="{{label}}" style="position: absolute; top: 59px; left: 0; right: 0; bottom: 0; background: #F2F2F7; border-radius: 12px 12px 0 0; overflow: hidden; display: flex; flex-direction: column; color: #000000">
    <sc-if value="{{hasChildren}}" hint-placeholder-val="{{false}}">{{children}}</sc-if>
    <sc-if value="{{isDemo}}" hint-placeholder-val="{{true}}">

      <div style="padding: 28px 36px; display: flex; justify-content: center"><dc-import name="Text" variant="subhead" tone="secondary" align="center" text="Содержимое модального окна" hint-size="100%,20px"></dc-import></div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Книжный советник"},"children":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var hasChildren = p.children !== undefined && p.children !== null && p.children !== '';
    return { label: p.label || 'Окно', hasChildren: hasChildren, isDemo: !hasChildren, children: p.children };
  }
}
</script>
