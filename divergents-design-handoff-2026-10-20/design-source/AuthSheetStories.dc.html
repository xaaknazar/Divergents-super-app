<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>AuthSheet — stories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<dc-import name="Screen" height="630" surface="plain" safe-top="{{false}}" hint-size="390px,630px">
  <dc-import name="Wrapper" pad-x="16" pad-top="24" gap="20" hint-size="100%,570px">
    <dc-import name="Text" variant="title2" heading="1" text="AuthSheet" hint-size="100%,28px"></dc-import>
    <dc-import name="Wrapper2" gap="8" hint-size="100%,506px">
      <dc-import name="Text" variant="footnoteEm" tone="secondary" text="после AuthHero variant=brand — белый лист с радиусом 28, углы продолжают navy" hint-size="100%,18px"></dc-import>
      <dc-import name="Wrapper3" hint-size="100%,480px"><dc-import name="AuthHero" variant="brand" title="Добро пожаловать" subtitle="Один аккаунт для обучения, сообщества и карьеры" hint-size="100%,258px"></dc-import><dc-import name="AuthSheet" hint-size="100%,220px"><dc-import name="Wrapper4" gap="16" hint-size="100%,200px"><dc-import name="AuthSegmented" items="{{intents}}" value="0" hint-size="100%,56px"></dc-import><dc-import name="AuthField" variant="filled" label="Почта" type="email" icon="envelope" value="" placeholder="you@example.com" hint-size="100%,75px"></dc-import></dc-import></dc-import></dc-import>
    </dc-import>
  </dc-import>
</dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":630}}'>
class Component extends DCLogic { renderVals() { return { intents: ["Вход", "Регистрация"] }; } }
</script>
</body>
</html>
