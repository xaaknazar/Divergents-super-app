<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Chip</title>

<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<sc-if value="{{isLink}}" hint-placeholder-val="{{false}}"><a href="{{href}}" aria-current="{{current}}" style="{{css}}"><sc-if value="{{hasIcon}}" hint-placeholder-val="{{false}}"><span style="{{iconCss}}"><dc-import name="Icon" icon="{{icon}}" size="xs" tone="inherit" hint-size="12px,12px"></dc-import></span></sc-if><span style="{{labelCss}}">{{label}}</span></a></sc-if><sc-if value="{{isButton}}" hint-placeholder-val="{{true}}"><button type="button" aria-pressed="{{pressed}}" style="{{css}}"><sc-if value="{{hasIcon}}" hint-placeholder-val="{{false}}"><span style="{{iconCss}}"><dc-import name="Icon" icon="{{icon}}" size="xs" tone="inherit" hint-size="12px,12px"></dc-import></span></sc-if><span style="{{labelCss}}">{{label}}</span></button></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Менеджмент"},"icon":{"editor":"enum","default":"","options":["","arrow-down","arrow-from-square-up-right","arrow-left","arrow-right","arrow-rotate-cw-up","arrow-to-bracket-down","arrow-up","ball-soccer","bell","bell-slash","bike","bin","body-standing","bolt-vertical","book","book-bookmark","book-open","bookmark","books-spines","briefcase","building","bullseye","calendar","calendar-check","calendar-star","camera","car","chart-bar","chart-line","chart-pie","chat-bubble","chat-bubbles","check","check-circle","checks","chevron-down","chevron-left","chevron-right","chevron-small-down","chevron-small-right","chevron-up","clipboard","clock-3h","cloud-arrow-down","coffee-cup","compass","copy","credit-card","crescent","crown","dots-three-horizontal","dots-three-vertical","envelope","exclamation-circle","exclamation-triangle","eye","eye-slash","fast-backward","fast-forward","file","file-doc","flag","flame","funnel","gear","gift","globe","graduation-cap","grid-2x2","hand-heart","handshake","headphones","heart","history","home","image","images","inbox","layers","lightbulb","link","list","lock-locked","lock-unlocked","magic-wand","magnifying-glass","map","medal-sport","mic","minus","mountains","navigation","note","palette","paperplane","pause","pause-circle","pencil","pencil-square","people","person","person-check","person-circle","person-plus","person-running","person-square","phone","pin","pin-check","plane","play","play-circle","plus","plus-circle","pulse","qr-code","question-circle","quote-left","robot","rocket","seal-check","share-network","shield-check","shop","skip-backward","skip-forward","sliders","smartphone","sparkles","speaker","star","star-half","stopwatch","sun","tag","target-location","tent","text-i-circle","text-t","thumbs-up","ticket","translate","trending-up","trophy","utensils","video-camera","volume-2","wallet","weight","wifi-slash","x","x-circle"]},"active":{"editor":"boolean","default":false},"size":{"editor":"enum","default":"regular","options":["regular","small"]},"href":{"editor":"text","default":""},"$preview":{"width":160,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var on = !!p.active;
    var small = p.size === 'small';
    var css = [
      'display: inline-flex', 'align-items: center', 'gap: 5px', 'max-width: 100%', 'box-sizing: border-box', 'margin: 0',
      'min-height: ' + (small ? 34 : 48) + 'px', 'padding: ' + (small ? '6px 12px' : '8px 14px'), 'border-radius: 999px',
      'background: ' + (on ? '#234088' : '#FFFFFF'), 'border: 0', 'box-shadow: none', 'color: ' + (on ? '#FFFFFF' : '#000000'),
      'text-decoration: none', 'cursor: pointer', 'flex-shrink: 0', F
    ].join('; ');
    return {
      current: (p.active === true || p.active === 'true') ? 'page' : undefined,
      css: css,
      iconCss: 'display: flex; flex-shrink: 0; color: ' + (on ? '#FFFFFF' : '#234088'),
      labelCss: 'font-size: ' + (small ? 12 : 13) + 'px; line-height: ' + (small ? 16 : 18) + 'px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0',
      label: p.label ?? 'Менеджмент',
      icon: p.icon || '',
      hasIcon: !!p.icon,
      pressed: on ? 'true' : 'false',
      href: p.href || '',
      isLink: !!p.href,
      isButton: !p.href
    };
  }
}
</script>
</body>
</html>
