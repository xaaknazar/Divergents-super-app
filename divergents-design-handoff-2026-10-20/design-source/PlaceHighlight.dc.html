<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PlaceHighlight</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<section style="box-sizing: border-box; width: 100%; padding: 18px; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; gap: 6px; font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <h2 style="margin: 0; font-size: 13px; line-height: 18px; font-weight: 700; color: #5C5C60; text-transform: uppercase">{{title}}</h2>
  <p style="margin: 0; font-size: 17px; line-height: 24px; letter-spacing: -0.2px; color: #000000; white-space: pre-line">{{text}}</p>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Чем хорошо"},"text":{"editor":"text","default":"Дерзкий кофе. Спешлти и т.д.\nРаботают с 2013 года."},"$preview":{"width":358,"height":110}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    return { title: p.title ?? 'Чем хорошо', text: p.text ?? 'Дерзкий кофе. Спешлти и т.д.\nРаботают с 2013 года.' };
  }
}
</script>
</body>
</html>
