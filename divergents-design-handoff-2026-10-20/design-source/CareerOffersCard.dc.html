<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>CareerOffersCard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <span aria-hidden="true" style="width: 46px; height: 46px; border-radius: 13px; background: #234088; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><dc-import name="Logo" size="sm" variant="white" hint-size="24px,24px"></dc-import></span>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
    <dc-import name="Text" variant="headline" heading="3" text="{{title}}" hint-size="100%,22px"></dc-import>
    <sc-if value="{{hasText}}" hint-placeholder-val="{{true}}"><dc-import name="Text" variant="footnote" tone="secondary" text="{{text}}" hint-size="100%,36px"></dc-import></sc-if>
  </div>
  <sc-if value="{{hasHref}}" hint-placeholder-val="{{false}}"><a href="{{href}}" aria-label="{{ariaLabel}}" style="{{overlayCss}}"></a></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Пока нет офферов"},"text":{"editor":"text","default":"Здесь появятся приглашения и офферы от компаний, которым вы подойдёте по талантам."},"href":{"editor":"text","default":""},"$preview":{"width":358,"height":100}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    var demo = p.title === undefined && p.text === undefined;
    var title = p.title ?? 'Пока нет офферов';
    var text = p.text ?? (demo ? 'Здесь появятся приглашения и офферы от компаний, которым вы подойдёте по талантам.' : '');
    var href = p.href || '';
    var R = 16;
    return {
      rootCss: ['position: relative', 'display: flex', 'align-items: center', 'gap: 14px', 'box-sizing: border-box', 'width: 100%', 'min-width: 0', 'padding: 16px',
        'border-radius: 16px', 'overflow: hidden', 'color: #000000', 'background: linear-gradient(135deg, rgba(61,91,219,0.20), rgba(61,91,219,0.13))', F].join('; '),
      title: title, text: text, hasText: !!text,
      href: href, hasHref: !!href, ariaLabel: [title, text].filter(Boolean).join('. '),
      overlayCss: 'position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; border-radius: ' + R + 'px'
    };
  }
}
</script>
</body>
</html>
