<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>BookCover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{css}}">
  <sc-if value="{{hasSrc}}" hint-placeholder-val="{{true}}"><img src="{{src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block"></sc-if>
  <sc-if value="{{noSrc}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="book" size="xl" tone="tertiary" hint-size="28px,28px"></dc-import></span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"src":{"editor":"text","default":"/_blob/ab29d7c214eb7576b59de35205483cdb"},"size":{"editor":"enum","default":"detail","options":["fill","detail"]},"$preview":{"width":120,"height":176}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var src = p.src ?? (p.size === undefined ? '/_blob/ab29d7c214eb7576b59de35205483cdb' : '');
    var detail = (p.size || 'detail') === 'detail';
    return {
      src: src, hasSrc: !!src, noSrc: !src,
      css: ['position: relative', 'display: block', 'box-sizing: border-box', detail ? 'width: 120px' : 'width: 100%', 'aspect-ratio: 0.68', 'border-radius: 12px',
        'background: rgba(118,118,128,0.12)', 'overflow: hidden', 'flex-shrink: 0'].join('; ')
    };
  }
}
</script>
</body>
</html>
