<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ReadingJoinGuide</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<section aria-label="{{heading}}" style="{{rootCss}}">
  <span style="{{headCss}}">{{heading}}</span>
  <ol style="list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
      <li style="display: flex; gap: 12px; align-items: stretch">
        <span style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0">
          <span style="{{s.badgeCss}}"><sc-if value="{{s.done}}" hint-placeholder-val="{{false}}"><dc-import name="Icon" icon="check" size="sm" tone="inherit" hint-size="16px,16px"></dc-import></sc-if><sc-if value="{{s.notDone}}" hint-placeholder-val="{{true}}">{{s.n}}</sc-if></span>
          <span style="{{s.lineCss}}"></span>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px; padding: 3px 0 16px; min-width: 0">
          <span style="{{s.titleCss}}">{{s.title}}</span>
          <span style="{{textCss}}">{{s.text}}</span>
        </span>
      </li>
    </sc-for>
  </ol>
  <sc-if value="{{hasNote}}" hint-placeholder-val="{{true}}"><span style="{{noteCss}}"><dc-import name="Icon" icon="shield-check" size="sm" tone="inherit" hint-size="16px,16px"></dc-import>{{note}}</span></sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state": {"editor": "enum", "default": "choose", "options": ["choose", "pending", "approved"]}, "scheme": {"editor": "enum", "default": "light", "options": ["light", "dark"]}, "team": {"editor": "text", "default": "Vertex"}, "startDate": {"editor": "text", "default": "20 октября"}, "$preview": {"width": 358, "height": 322}}'>
class Component extends DCLogic {
  static PAL = {
    light: { card: '#FFFFFF', border: '#E4E7EF', sep: 'rgba(60,60,67,0.12)', ink: '#0B0E16', ink2: '#5C5C60', ink3: '#6B6B70', brand: '#234088', accent: '#3D5BDB', tint: 'rgba(35,64,136,0.07)', track: '#E9ECF5', ok: '#187A32', okTint: 'rgba(24,122,50,0.09)', warn: '#934900', warnTint: 'rgba(255,149,0,0.12)', shadow: '0 1px 2px rgba(16,24,40,0.05), 0 10px 24px -14px rgba(16,24,40,0.22)', book: '/_blob/534c3a5937de37a34afa6a6ebd91be4b' },
    dark: { card: '#161B26', border: 'rgba(255,255,255,0.08)', sep: 'rgba(255,255,255,0.10)', ink: '#F5F6FA', ink2: 'rgba(235,235,245,0.64)', ink3: 'rgba(235,235,245,0.5)', brand: '#8AA0FF', accent: '#8AA0FF', tint: 'rgba(138,160,255,0.12)', track: 'rgba(255,255,255,0.10)', ok: '#6FD39A', okTint: 'rgba(111,211,154,0.12)', warn: '#FFB35C', warnTint: 'rgba(255,179,92,0.14)', shadow: 'none', book: '/_blob/402f38a271f02261a3be20e630746183' }
  };
  static FF = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";

  // Next-step explainer: what to do now (choose a team → captain approves → read 60 min a day)
  renderVals() {
    var p = this.props;
    var C = Component.PAL[p.scheme === 'dark' ? 'dark' : 'light'];
    var st = { choose: 0, pending: 1, approved: 2 }[p.state] ?? 0;
    var team = p.team || 'Vertex', start = p.startDate || '20 октября';
    var defs = [
      ['Выберите команду', st === 0 ? 'Ниже — команды со свободными местами' : 'Команда «' + team + '»'],
      ['Капитан одобрит заявку', st === 1 ? 'Ждём ответа капитана. Повторная заявка не нужна' : st > 1 ? 'Вы в команде' : 'Обычно в течение дня'],
      ['Читайте 60 минут в день', st === 2 ? 'Таймер откроется в день старта — ' + start : 'Можно в несколько подходов']
    ];
    var steps = defs.map(function (d, i) {
      var done = i < st, cur = i === st;
      return {
        n: String(i + 1), title: d[0], text: d[1], done: done, notDone: !done,
        badgeCss: 'width: 28px; height: 28px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; box-sizing: border-box; '
          + (done ? 'background: ' + C.brand + '; color: ' + (p.scheme === 'dark' ? '#0B0E16' : '#FFFFFF') : cur ? 'border: 1.5px solid ' + C.brand + '; color: ' + C.brand : 'border: 1px solid ' + C.border + '; color: ' + C.ink3),
        lineCss: i < 2 ? 'flex: 1; width: 1px; margin: 4px 0; background: ' + (done ? C.brand : C.sep) : 'display: none',
        titleCss: 'font-size: 16px; line-height: 21px; font-weight: ' + (cur ? 700 : 500) + '; color: ' + (cur || done ? C.ink : C.ink2)
      };
    });
    var note = st === 0 ? 'Капитан выбранной команды и администраторы смогут посмотреть вашу анкету' : '';
    return {
      heading: st === 0 ? 'Как вступить' : st === 1 ? 'Заявка на рассмотрении' : 'Вы в команде «' + team + '»',
      steps: steps, note: note, hasNote: !!note,
      rootCss: ['box-sizing: border-box', 'width: 100%', 'min-width: 0', 'padding: 18px 18px 6px', 'border-radius: 16px', 'background: ' + C.card, 'border: 1px solid ' + C.border, 'color: ' + C.ink, Component.FF].join('; '),
      headCss: 'display: block; font-size: 17px; line-height: 22px; font-weight: 700; color: ' + C.ink,
      textCss: 'font-size: 13px; line-height: 18px; color: ' + C.ink2,
      noteCss: 'display: flex; gap: 8px; align-items: flex-start; margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: ' + C.tint + '; font-size: 12px; line-height: 16px; color: ' + C.ink2
    };
  }
}
</script>
</body>
</html>
