<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ProgramMetricTile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Rounded';src:url(/_blob/92c640fe018c2e26a60b16fe2c9a1bdf) format('opentype');font-weight:400;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/d12941af6cfeccdeef01ccee92a0f6e3) format('opentype');font-weight:500;font-style:normal}
@font-face{font-family:'Gotham Rounded';src:url(/_blob/c2d151a5429ab2fbffbf91e93a8c4c76) format('opentype');font-weight:700;font-style:normal}
body{margin:0}
</style>
</helmet>
<div style="{{rootCss}}">
  <dc-import name="Text" variant="footnote" tone="secondary" text="{{label}}" hint-size="100%,18px"></dc-import>
  <div style="margin-top: 8px"><dc-import name="Text" variant="title2" numeric="{{true}}" text="{{value}}" hint-size="100%,28px"></dc-import></div>
  <div style="margin-top: 4px"><dc-import name="Text" variant="footnote" tone="secondary" text="{{caption}}" hint-size="100%,18px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"label":{"editor":"text","default":"Норма выполнена"},"value":{"editor":"text","default":"19 из 21"},"caption":{"editor":"text","default":"дней программы"},"$preview":{"width":173,"height":104}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var F = "font-family: 'Gotham Rounded', 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased";
    return {
      rootCss: ['display: flex', 'flex-direction: column', 'box-sizing: border-box', 'width: 100%', 'height: 100%', 'padding: 16px', 'background: #FFFFFF', 'border-radius: 14px', 'color: #000000', F].join('; '),
      label: p.label ?? 'Норма выполнена', value: p.value ?? '19 из 21', caption: p.caption ?? 'дней программы'
    };
  }
}
</script>
</body>
</html>
